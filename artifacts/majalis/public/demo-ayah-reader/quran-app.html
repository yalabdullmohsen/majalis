<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e8e4d9" />
<meta name="robots" content="noindex" />
<title>نموذج ورقي — مصحف المدينة (تجريبي)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --screen-bg: #e8e4d9;
    --paper-bg: #fcf9f0;
    --ink: #2e231d;
    --gold: #b8944d;
    --bar: #f7f3e8;
    --hairline: rgba(46, 35, 29, 0.12);
    --top-h: 52px;
    --bot-h: 56px;
    --paper-pad-y: 60px;
    --paper-pad-x: 70px;
    --font-quran: "Scheherazade New", "Amiri", "Traditional Arabic", serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--screen-bg);
    color: var(--ink);
    font-family: var(--font-quran);
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: calc(var(--top-h) + env(safe-area-inset-top, 0px));
    padding: env(safe-area-inset-top, 0px) 0.75rem 0;
    background: var(--bar);
    border-bottom: 1px solid var(--hairline);
  }
  .top-bar__title {
    margin: 0;
    flex: 1;
    text-align: center;
    font-size: 1rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icon-btn, .nav-btn {
    min-width: 44px;
    min-height: 44px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 1.1rem;
    cursor: pointer;
    border-radius: 8px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active, .nav-btn:active { background: rgba(46,35,29,0.06); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 12px 10px;
    overflow: hidden;
  }

  .paper {
    width: 100%;
    max-width: 750px;
    height: 100%;
    background: var(--paper-bg);
    box-shadow:
      0 1px 2px rgba(46, 35, 29, 0.06),
      0 10px 28px rgba(46, 35, 29, 0.12),
      0 0 0 1px rgba(184, 148, 77, 0.18);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .paper-inner {
    flex: 1;
    min-height: 0;
    padding: var(--paper-pad-y) var(--paper-pad-x);
    overflow: hidden;
  }

  .quran-page {
    height: 100%;
    font-size: 24px;
    line-height: 3;
    word-spacing: 0.1em;
    text-align: justify;
    text-align-last: center;
    color: var(--ink);
    overflow: hidden;
  }

  .surah-plaque {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.25rem;
    padding: 10px 40px;
    max-width: 92%;
    border: 2px solid var(--gold);
    outline: 1px solid var(--gold);
    outline-offset: 4px;
    background: linear-gradient(180deg, rgba(184,148,77,0.08), rgba(184,148,77,0.02));
    text-align: center;
  }
  .surah-plaque__name {
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
  }
  .surah-plaque__type {
    margin-top: 4px;
    font-size: 14px;
    color: var(--gold);
    font-weight: 700;
  }

  .ayah { display: inline; color: var(--ink); }

  .ayah-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    margin-inline: 0.25em;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    color: var(--gold);
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    vertical-align: middle;
  }

  .status {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--ink);
    font-size: 1rem;
  }
  .status--err { color: #8b2e2e; }

  .measure-wrap {
    position: absolute;
    left: -9999px;
    top: 0;
    width: min(750px, 100vw);
    pointer-events: none;
    visibility: hidden;
  }
  .measure-wrap .paper-inner { height: auto; }

  .bottom-bar {
    position: sticky;
    bottom: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: calc(var(--bot-h) + env(safe-area-inset-bottom, 0px));
    padding: 0 1rem env(safe-area-inset-bottom, 0px);
    background: var(--bar);
    border-top: 1px solid var(--hairline);
  }
  .page-label {
    font-size: 0.92rem;
    font-weight: 700;
  }

  @media (max-width: 640px) {
    :root {
      --paper-pad-y: 36px;
      --paper-pad-x: 28px;
    }
    .quran-page { font-size: 22px; line-height: 2.75; }
    .surah-plaque { padding: 8px 24px; }
    .surah-plaque__name { font-size: 24px; }
  }
</style>
</head>
<body>
  <header class="top-bar" role="banner">
    <a class="icon-btn" href="/mushaf" aria-label="المصحف الكامل">⟵</a>
    <h1 class="top-bar__title" id="surah-name">جاري التحميل…</h1>
    <a class="icon-btn" href="/mushaf/about-edition" aria-label="عن الطبعة">ⓘ</a>
  </header>

  <div class="stage" id="stage">
    <article class="paper" id="paper" aria-label="صفحة المصحف">
      <div class="paper-inner">
        <div class="quran-page" id="quran-page">
          <p class="status" id="load-status">جاري تحميل النص من مصدر المصحف…</p>
        </div>
      </div>
    </article>
  </div>

  <div class="measure-wrap" aria-hidden="true">
    <div class="paper">
      <div class="paper-inner">
        <div class="quran-page" id="measure-page"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-bar" aria-label="تنقل الصفحات">
    <button type="button" class="nav-btn" id="btn-prev" aria-label="السابق" disabled>◀</button>
    <span class="page-label" id="page-label">—</span>
    <button type="button" class="nav-btn" id="btn-next" aria-label="التالي" disabled>▶</button>
  </nav>

<script>
(function () {
  "use strict";

  /**
   * سور النموذج — أرقام عثمانية صحيحة فقط.
   * النص يُحمَّل من /data/quran/surah-*.json دون تعديل يدوي.
   */
  const SURAH_IDS = [1, 108, 106, 107, 112, 113, 114];
  const STORAGE_KEY = "madinah-paper-mushaf-page-v2";

  const state = {
    surahs: [],
    pages: [],
    pageIndex: 0,
    ready: false,
  };

  const $ = (id) => document.getElementById(id);

  function dataUrl(n) {
    const base = document.body.getAttribute("data-base") || "/";
    const root = base.endsWith("/") ? base.slice(0, -1) : base;
    return root + "/data/quran/surah-" + String(n).padStart(3, "0") + ".json";
  }

  function toArabicDigits(n) {
    return String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[Number(d)]);
  }

  function revelationLabel(t) {
    if (t === "Meccan") return "مكية";
    if (t === "Medinan") return "مدنية";
    return t || "";
  }

  function displaySurahName(raw) {
    return String(raw || "")
      .replace(/^سُورَةُ\s*/u, "")
      .replace(/^سورة\s*/u, "")
      .trim();
  }

  function stripBom(text) {
    return String(text || "").replace(/^\uFEFF/, "");
  }

  function ayahNode(ayah, forMeasure) {
    const node = document.createElement("span");
    node.className = "ayah";
    const num = document.createElement("span");
    num.className = "ayah-num";
    if (!forMeasure) num.setAttribute("aria-label", "آية " + ayah.numberInSurah);
    num.textContent = toArabicDigits(ayah.numberInSurah);
    node.appendChild(document.createTextNode(stripBom(ayah.text) + " "));
    node.appendChild(num);
    return node;
  }

  function plaqueNode(surah) {
    const wrap = document.createElement("div");
    wrap.className = "surah-plaque";
    const name = document.createElement("div");
    name.className = "surah-plaque__name";
    name.textContent = "سورة " + displaySurahName(surah.name);
    const type = document.createElement("div");
    type.className = "surah-plaque__type";
    type.textContent = revelationLabel(surah.revelationType);
    wrap.appendChild(name);
    wrap.appendChild(type);
    return wrap;
  }

  function paperAvailHeight() {
    const inner = document.querySelector("#paper .paper-inner");
    if (!inner) return 400;
    const cs = getComputedStyle(inner);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    return Math.max(120, inner.clientHeight - padY);
  }

  function buildPages() {
    const measure = $("measure-page");
    measure.innerHTML = "";
    const pages = [];
    let current = document.createElement("div");
    measure.appendChild(current);

    const limit = paperAvailHeight();

    function pushPage() {
      if (!current.childNodes.length) return;
      pages.push(Array.from(current.childNodes).map((n) => n.cloneNode(true)));
      current.innerHTML = "";
    }

    function fits() {
      return current.scrollHeight <= limit + 1;
    }

    state.surahs.forEach((surah) => {
      const plaque = plaqueNode(surah);
      current.appendChild(plaque);
      if (!fits()) {
        current.removeChild(plaque);
        pushPage();
        current.appendChild(plaque);
      }

      surah.ayahs.forEach((ayah) => {
        const node = ayahNode(ayah, true);
        current.appendChild(node);
        if (!fits()) {
          current.removeChild(node);
          pushPage();
          current.appendChild(node);
        }
      });
    });

    pushPage();
    state.pages = pages;
  }

  function renderPage() {
    const page = $("quran-page");
    page.innerHTML = "";
    const nodes = state.pages[state.pageIndex] || [];
    nodes.forEach((n) => page.appendChild(n.cloneNode(true)));

    const total = Math.max(1, state.pages.length);
    const idx = Math.min(state.pageIndex + 1, total);
    $("page-label").textContent = toArabicDigits(idx) + " / " + toArabicDigits(total);
    $("btn-prev").disabled = state.pageIndex <= 0;
    $("btn-next").disabled = state.pageIndex >= state.pages.length - 1;

    const firstPlaque = page.querySelector(".surah-plaque__name");
    if (firstPlaque) $("surah-name").textContent = firstPlaque.textContent;

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ pageIndex: state.pageIndex }));
    } catch (_) {}
  }

  function restoreProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (typeof parsed.pageIndex === "number") {
        state.pageIndex = Math.min(
          Math.max(0, parsed.pageIndex),
          Math.max(0, state.pages.length - 1)
        );
      }
    } catch (_) {}
  }

  function go(delta) {
    const next = state.pageIndex + delta;
    if (next < 0 || next >= state.pages.length) return;
    state.pageIndex = next;
    renderPage();
  }

  function bindSwipe(target) {
    let x0 = 0, y0 = 0, tracking = false;
    target.addEventListener("touchstart", (e) => {
      if (!e.changedTouches[0]) return;
      tracking = true;
      x0 = e.changedTouches[0].clientX;
      y0 = e.changedTouches[0].clientY;
    }, { passive: true });
    target.addEventListener("touchend", (e) => {
      if (!tracking || !e.changedTouches[0]) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
      if (dx < 0) go(1);
      else go(-1);
    }, { passive: true });
  }

  function reflow() {
    if (!state.ready) return;
    const keep = state.pageIndex;
    buildPages();
    state.pageIndex = Math.min(keep, Math.max(0, state.pages.length - 1));
    renderPage();
  }

  async function loadSurahs() {
    const status = $("load-status");
    const results = await Promise.all(
      SURAH_IDS.map(async (id) => {
        const res = await fetch(dataUrl(id), { credentials: "same-origin" });
        if (!res.ok) throw new Error("فشل تحميل السورة " + id + " (" + res.status + ")");
        return res.json();
      })
    );
    state.surahs = results.map((d) => ({
      number: d.number,
      name: d.name,
      revelationType: d.revelationType,
      ayahs: (d.ayahs || []).map((a) => ({
        numberInSurah: a.numberInSurah,
        text: a.text,
      })),
    }));
    if (status) status.remove();
  }

  async function init() {
    try {
      await loadSurahs();
      const start = () => {
        buildPages();
        restoreProgress();
        state.ready = true;
        renderPage();
      };
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(start).catch(start);
      } else {
        start();
      }
    } catch (err) {
      const page = $("quran-page");
      page.innerHTML = "";
      const p = document.createElement("p");
      p.className = "status status--err";
      p.textContent = "تعذّر تحميل النص. افتح المصحف الكامل من الرابط أعلاه.";
      page.appendChild(p);
      $("surah-name").textContent = "نموذج ورقي";
      console.error(err);
      return;
    }

    $("btn-prev").addEventListener("click", () => go(-1));
    $("btn-next").addEventListener("click", () => go(1));
    bindSwipe($("stage"));

    let t = 0;
    window.addEventListener("resize", () => {
      clearTimeout(t);
      t = setTimeout(reflow, 160);
    });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
