<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <title>جاري التجهيز — سُنّة</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: #f2f4f3;
        color: #14241c;
        font-family: "Noto Naskh Arabic", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      .spin {
        width: 2.25rem;
        height: 2.25rem;
        margin: 0 auto 1rem;
        border-radius: 50%;
        border: 3px solid color-mix(in srgb, #1f7a5a 25%, transparent);
        border-top-color: #1f7a5a;
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
        font-weight: 600;
        line-height: 1.4;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.95rem;
        line-height: 1.65;
        color: #4a6b5f;
      }
      .actions {
        display: grid;
        gap: 0.55rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        font: inherit;
        font-size: 1rem;
        cursor: pointer;
        background: #1f7a5a;
        color: #fff;
      }
      button.secondary {
        background: transparent;
        color: #1f7a5a;
        border: 1px solid color-mix(in srgb, #1f7a5a 35%, transparent);
      }
      button:active {
        opacity: 0.92;
      }
      .is-loading .actions {
        display: none;
      }
      .is-final .spin {
        display: none;
        animation: none;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #101614;
          color: #e8efea;
        }
        p {
          color: #9bb5a8;
        }
        button.secondary {
          color: #9fcabb;
          border-color: color-mix(in srgb, #5a9e88 40%, transparent);
        }
      }
    </style>
  </head>
  <body>
    <main id="root" class="is-loading">
      <div class="spin" aria-hidden="true"></div>
      <h1 id="title">جاري تجهيز الصفحة…</h1>
      <p id="msg">نحمّل المحتوى. لا تغلق التطبيق.</p>
      <div class="actions">
        <button type="button" id="retry">إعادة المحاولة</button>
        <button type="button" id="home" class="secondary">الصفحة الرئيسية</button>
      </div>
    </main>
    <script>
      (function () {
        var LIVE = "https://www.ssunnah.com/";
        var RETRY_KEY = "mj.native-load-retry";
        var root = document.getElementById("root");
        var title = document.getElementById("title");
        var msg = document.getElementById("msg");
        var online = typeof navigator !== "undefined" ? navigator.onLine !== false : true;

        function paintLoading(text, detail) {
          root.className = "is-loading";
          title.textContent = text || "جاري تجهيز الصفحة…";
          msg.textContent = detail || "نحمّل المحتوى. لا تغلق التطبيق.";
          document.title = "جاري التجهيز — سُنّة";
        }

        function paintFinal() {
          root.className = "is-final";
          if (!online) {
            title.textContent = "أنت غير متصل بالإنترنت";
            msg.textContent = "تحقق من الاتصال ثم اضغط إعادة المحاولة.";
          } else {
            title.textContent = "تعذّر تحميل المحتوى مؤقتًا";
            msg.textContent = "أعد المحاولة. إن استمر الأمر افتح الصفحة الرئيسية.";
          }
          document.title = "تعذّر التحميل — سُنّة";
        }

        function resolveTarget(forceHome) {
          if (forceHome) return LIVE;
          var path = "/";
          try {
            path = sessionStorage.getItem("mj.last-path") || "/";
          } catch (e0) {}
          if (!path || path.charAt(0) !== "/") path = "/";
          if (path.indexOf("native-load-error") !== -1) path = "/";
          var ref = "";
          try {
            ref = document.referrer || "";
          } catch (e1) {}
          if (ref && ref.indexOf("ssunnah.com") !== -1 && ref.indexOf("native-load-error") === -1) {
            return ref.split("#")[0];
          }
          return LIVE.replace(/\/$/, "") + path;
        }

        function go(forceHome) {
          var target = resolveTarget(!!forceHome);
          var sep = target.indexOf("?") >= 0 ? "&" : "?";
          try {
            location.replace(target + sep + "_r=" + Date.now());
          } catch (e2) {
            location.href = target;
          }
        }

        function readAttempts() {
          try {
            return parseInt(sessionStorage.getItem(RETRY_KEY) || "0", 10) || 0;
          } catch (e3) {
            return 0;
          }
        }

        function writeAttempts(n) {
          try {
            sessionStorage.setItem(RETRY_KEY, String(n));
          } catch (e4) {}
        }

        document.getElementById("retry").addEventListener("click", function () {
          writeAttempts(0);
          paintLoading("جاري إعادة التحميل…", "نحاول فتح الصفحة من جديد.");
          setTimeout(function () {
            go(false);
          }, 400);
        });
        document.getElementById("home").addEventListener("click", function () {
          writeAttempts(0);
          paintLoading("فتح الصفحة الرئيسية…", "ننقلك إلى سُنّة.");
          setTimeout(function () {
            go(true);
          }, 300);
        });

        // مسار صامت: لا خطأ فوري — محاولتان قبل عرض السبب
        if (!online) {
          paintFinal();
        } else {
          var attempts = readAttempts();
          if (attempts < 1) {
            writeAttempts(1);
            paintLoading("جاري تجهيز الصفحة…", "نحمّل المحتوى. لا تغلق التطبيق.");
            setTimeout(function () {
              go(false);
            }, 900);
          } else if (attempts < 2) {
            writeAttempts(2);
            paintLoading("ما زلنا نجهّز الصفحة…", "محاولة إضافية بهدوء قبل أي رسالة خطأ.");
            setTimeout(function () {
              go(true);
            }, 1600);
          } else {
            paintFinal();
          }
        }

        try {
          window.addEventListener("online", function () {
            online = true;
            writeAttempts(0);
            paintLoading("عادت الشبكة…", "نعيد فتح الصفحة.");
            setTimeout(function () {
              go(false);
            }, 500);
          });
        } catch (e5) {}
      })();
    </script>
  </body>
</html>
