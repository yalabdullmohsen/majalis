<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F3EB" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <title>سُنّة</title>
    <style>
      :root {
        --mj-splash-bg-light: #f7f3eb;
        --mj-splash-bg-dark: #101614;
        --mj-splash-bg: var(--mj-splash-bg-light);
        --mj-splash-ink: #123f2e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --mj-splash-bg: var(--mj-splash-bg-dark);
          --mj-splash-ink: #a8d5c0;
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--mj-splash-bg);
        color: var(--mj-splash-ink);
        font-family: "Amiri", "Noto Naskh Arabic", system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 0.55rem;
        max-width: 18rem;
        text-align: center;
      }
      .mark {
        padding: 0.4rem 0.9rem;
        border-radius: 0.9rem;
        border: 1px solid color-mix(in srgb, var(--mj-splash-ink) 22%, transparent);
        background: color-mix(in srgb, var(--mj-splash-ink) 10%, transparent);
      }
      .brand {
        margin: 0;
        font-size: clamp(1.4rem, 5.5vw, 1.7rem);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.01em;
        color: var(--mj-splash-ink);
      }
      .tagline {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 500;
        line-height: 1.45;
        color: color-mix(in srgb, var(--mj-splash-ink) 78%, transparent);
        max-width: 16rem;
      }
      .pulse {
        width: 2.4rem;
        height: 0.18rem;
        border-radius: 999px;
        background: color-mix(in srgb, var(--mj-splash-ink) 22%, transparent);
        overflow: hidden;
        position: relative;
        margin-block-start: 0.15rem;
      }
      .pulse::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--mj-splash-ink);
        animation: mj-sp 0.9s ease-in-out infinite;
      }
      @keyframes mj-sp {
        from {
          transform: translateX(150%);
        }
        to {
          transform: translateX(-250%);
        }
      }

      .mushaf-skel {
        width: min(100%, 17rem);
        margin: 0.35rem 0 0.15rem;
        padding: 0.7rem 0.75rem;
        border-radius: 0.85rem;
        background: #fbf4e8;
        border: 1px solid color-mix(in srgb, var(--mj-splash-ink) 12%, transparent);
        display: grid;
        gap: 0.55rem;
        box-sizing: border-box;
      }
      @media (prefers-color-scheme: dark) {
        .mushaf-skel { background: #1a221c; }
      }
      .mushaf-skel__bar {
        height: 0.42rem;
        border-radius: 6px;
        background: color-mix(in srgb, var(--mj-splash-ink) 14%, transparent);
      }
      .mushaf-skel__bar:nth-child(1) { width: 38%; margin-inline: auto; }
      .mushaf-skel__bar:nth-child(3n) { width: 90%; }
      .mushaf-skel__bar:nth-child(3n+1) { width: 100%; }
      .mushaf-skel__bar:nth-child(3n+2) { width: 84%; }
      .is-final .mushaf-skel { display: none; }
      .soft-status {
        margin: 0.2rem 0 0;
        font-size: 0.72rem;
        line-height: 1.45;
        color: color-mix(in srgb, var(--mj-splash-ink) 52%, transparent);
        max-width: 16rem;
      }
      .soft-status[hidden],
      .diag[hidden] {
        display: none !important;
      }
      .diag {
        margin: 0.35rem 0 0;
        font-size: 0.72rem;
        line-height: 1.45;
        color: color-mix(in srgb, var(--mj-splash-ink) 55%, transparent);
        word-break: break-word;
      }
      .actions {
        display: grid;
        gap: 0.55rem;
        width: 100%;
        margin-top: 0.75rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        font: inherit;
        font-size: 1rem;
        cursor: pointer;
        background: #1f7a5a;
        color: #fff;
      }
      button.secondary {
        background: transparent;
        color: var(--mj-splash-ink);
        border: 1px solid color-mix(in srgb, var(--mj-splash-ink) 35%, transparent);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button:active {
        opacity: 0.92;
      }

      /* مسار الاستعادة الصامت: نفس سطح الدخولية بلا نسخة تحميل ثانية ظاهرة */
      .is-loading .soft-status {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      .is-loading .mushaf-skel {
        display: none !important;
      }

      /* مسار الاستعادة الناعم: نفس سطح الدخولية — بلا شاشة رمادية ثانية */
      .is-loading .actions {
        display: none;
      }
      .is-loading .fail-title {
        display: none;
      }
      .is-final .pulse {
        display: none;
        animation: none;
      }
      .is-final .soft-status {
        display: none;
      }
      .fail-title {
        margin: 0.35rem 0 0;
        font-size: 1.15rem;
        font-weight: 650;
        line-height: 1.4;
      }
      .fail-msg {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.6;
        color: color-mix(in srgb, var(--mj-splash-ink) 78%, transparent);
      }
      .is-loading .fail-msg {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse::after {
          animation: none;
          width: 100%;
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <main id="root" class="is-loading" data-startup-surface="sunnah">
      <div class="mark" aria-hidden="true">
        <p class="brand">سُنّة</p>
      </div>
      <p class="tagline">معك في العلم والعمل</p>
      <div class="pulse" aria-hidden="true"></div>
      <div class="mushaf-skel" aria-hidden="true">
        <div class="mushaf-skel__bar"></div>
        <div class="mushaf-skel__bar"></div>
        <div class="mushaf-skel__bar"></div>
        <div class="mushaf-skel__bar"></div>
        <div class="mushaf-skel__bar"></div>
        <div class="mushaf-skel__bar"></div>
        <div class="mushaf-skel__bar"></div>
        <div class="mushaf-skel__bar"></div>
      </div>
      <p id="title" class="soft-status">جاري تجهيز الصفحة…</p>
      <p id="msg" class="fail-msg">نحمّل المحتوى. لا تغلق التطبيق.</p>
      <h1 id="fail-title" class="fail-title" hidden>تعذّر التحميل</h1>
      <p id="diag" class="diag" hidden></p>
      <div class="actions">
        <button type="button" id="retry">إعادة المحاولة</button>
        <button type="button" id="home" class="secondary">الصفحة الرئيسية</button>
      </div>
    </main>
    <script>
      (function () {
        var LIVE = "https://www.ssunnah.com/";
        var HEALTH = "https://www.ssunnah.com/version.json";
        var RETRY_KEY = "mj.native-load-retry";
        var CRASH_KEY = "mj.startup-fail-count";
        var LAST_PATH_KEY = "mj.last-path";
        var root = document.getElementById("root");
        var title = document.getElementById("title");
        var msg = document.getElementById("msg");
        var failTitle = document.getElementById("fail-title");
        var diag = document.getElementById("diag");
        var retryBtn = document.getElementById("retry");
        var homeBtn = document.getElementById("home");
        var online = typeof navigator !== "undefined" ? navigator.onLine !== false : true;
        var navigating = false;
        // إن وصلنا من إعادة محاولة سابقة لصفحة الخطأ — امسخ المسار فورًا لمنع الحلقة
        try {
          if (/[?&]src=native-load-error(?:&|$)/.test(location.search || "")) {
            sessionStorage.removeItem(LAST_PATH_KEY);
          }
        } catch (eBoot) {}

        function setThemeColor(hex) {
          try {
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.setAttribute("content", hex);
            });
          } catch (eTheme) {}
        }

        function paintLoading(text, detail) {
          root.className = "is-loading";
          title.hidden = false;
          title.textContent = text || "جاري تجهيز الصفحة…";
          msg.textContent = detail || "نحمّل المحتوى. لا تغلق التطبيق.";
          if (failTitle) {
            failTitle.hidden = true;
            failTitle.textContent = "";
          }
          if (diag) {
            diag.hidden = true;
            diag.textContent = "";
          }
          document.title = "سُنّة";
          setThemeColor(
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "#101614"
              : "#F7F3EB",
          );
        }

        function paintFinal(code) {
          root.className = "is-final";
          title.hidden = true;
          if (failTitle) failTitle.hidden = false;
          if (!online) {
            if (failTitle) failTitle.textContent = "أنت غير متصل بالإنترنت";
            msg.textContent = "تحقق من الاتصال ثم اضغط إعادة المحاولة.";
          } else {
            if (failTitle) failTitle.textContent = "تعذّر تحميل المحتوى مؤقتًا";
            msg.textContent = "أعد المحاولة. إن استمر الأمر افتح الصفحة الرئيسية.";
          }
          document.title = "تعذّر التحميل — سُنّة";
          if (diag && code) {
            diag.hidden = false;
            diag.textContent = "رمز الدعم: " + code;
          }
        }

        function readAttempts() {
          try {
            return parseInt(sessionStorage.getItem(RETRY_KEY) || "0", 10) || 0;
          } catch (e3) {
            return 0;
          }
        }

        function writeAttempts(n) {
          try {
            sessionStorage.setItem(RETRY_KEY, String(n));
          } catch (e4) {}
        }

        function bumpCrashCount() {
          try {
            var n = parseInt(sessionStorage.getItem(CRASH_KEY) || "0", 10) || 0;
            sessionStorage.setItem(CRASH_KEY, String(n + 1));
            return n + 1;
          } catch (e6) {
            return 1;
          }
        }

        function clearLastPath() {
          try {
            sessionStorage.removeItem(LAST_PATH_KEY);
          } catch (e7) {}
        }

        function sanitizePath(path) {
          if (!path || path.charAt(0) !== "/") return "/";
          if (path.indexOf("native-load-error") !== -1) return "/";
          if (path.indexOf("//") === 0) return "/";
          if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(path)) return "/";
          return path.split("#")[0].split("?")[0] || "/";
        }

        function resolveTarget(forceHome) {
          if (forceHome) return LIVE;
          var path = "/";
          try {
            path = sanitizePath(sessionStorage.getItem(LAST_PATH_KEY) || "/");
          } catch (e0) {
            path = "/";
          }
          // بعد أول فشل: لا تُعد مسارًا قديمًا قد يكون سبب الدائرة
          if (readAttempts() >= 1) path = "/";
          return LIVE.replace(/\/$/, "") + path;
        }

        function go(forceHome) {
          if (navigating) return;
          navigating = true;
          retryBtn.disabled = true;
          homeBtn.disabled = true;
          var target = resolveTarget(!!forceHome);
          var sep = target.indexOf("?") >= 0 ? "&" : "?";
          try {
            location.replace(target + sep + "_r=" + Date.now() + "&src=native-load-error");
          } catch (e2) {
            location.href = target;
          }
        }

        function probeThenGo(forceHome) {
          paintLoading(
            forceHome ? "فتح الصفحة الرئيسية…" : "جاري إعادة التحميل…",
            "نتحقق من الاتصال ثم نفتح سُنّة.",
          );
          var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
          var timer =
            ctrl &&
            setTimeout(function () {
              try {
                ctrl.abort();
              } catch (e8) {}
            }, 4000);
          var done = function (ok) {
            if (timer) clearTimeout(timer);
            if (!ok) {
              online = typeof navigator !== "undefined" ? navigator.onLine !== false : online;
              navigating = false;
              retryBtn.disabled = false;
              homeBtn.disabled = false;
              paintFinal("NL-" + readAttempts() + (online ? "-NET" : "-OFF"));
              return;
            }
            go(!!forceHome);
          };
          try {
            fetch(HEALTH + "?t=" + Date.now(), {
              cache: "no-store",
              signal: ctrl ? ctrl.signal : undefined,
            })
              .then(function (r) {
                done(!!r && r.ok);
              })
              .catch(function () {
                done(false);
              });
          } catch (e9) {
            done(true);
          }
        }

        retryBtn.addEventListener("click", function () {
          if (navigating) return;
          writeAttempts(0);
          clearLastPath();
          probeThenGo(true);
        });
        homeBtn.addEventListener("click", function () {
          if (navigating) return;
          writeAttempts(0);
          clearLastPath();
          probeThenGo(true);
        });

        // مسار صامت: لا خطأ فوري — محاولتان قبل عرض السبب
        // المحاولة الأولى: آخر مسار آمن. الثانية: الرئيسية فقط (تفادي حلقة المسار التالف).
        if (!online) {
          bumpCrashCount();
          paintFinal("NL-OFF");
        } else {
          var attempts = readAttempts();
          if (attempts < 1) {
            writeAttempts(1);
            paintLoading("جاري تجهيز الصفحة…", "نحمّل المحتوى. لا تغلق التطبيق.");
            setTimeout(function () {
              go(false);
            }, 900);
          } else if (attempts < 2) {
            writeAttempts(2);
            clearLastPath();
            paintLoading("ما زلنا نجهّز الصفحة…", "محاولة إضافية على الصفحة الرئيسية.");
            setTimeout(function () {
              go(true);
            }, 1600);
          } else {
            bumpCrashCount();
            clearLastPath();
            paintFinal("NL-" + attempts);
          }
        }

        try {
          window.addEventListener("online", function () {
            online = true;
            writeAttempts(0);
            clearLastPath();
            paintLoading("عادت الشبكة…", "نعيد فتح الصفحة الرئيسية.");
            setTimeout(function () {
              probeThenGo(true);
            }, 500);
          });
        } catch (e5) {}
      })();
    </script>
  </body>
</html>
