<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>تعذّر التحميل — سُنّة</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: #f2f4f3;
        color: #14241c;
        font-family: "Noto Naskh Arabic", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
        font-weight: 600;
        line-height: 1.4;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.95rem;
        line-height: 1.65;
        color: #4a6b5f;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        font: inherit;
        font-size: 1rem;
        cursor: pointer;
        background: #1f7a5a;
        color: #fff;
      }
      button:active {
        opacity: 0.92;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #101614;
          color: #e8efea;
        }
        p {
          color: #9bb5a8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">جاري إعادة التحميل…</h1>
      <p id="msg">نجهّز الصفحة. إن استمر التأخير سنساعدك بإعادة المحاولة.</p>
      <button type="button" id="retry">إعادة المحاولة</button>
    </main>
    <script>
      (function () {
        var LIVE = "https://www.ssunnah.com/";
        var title = document.getElementById("title");
        var msg = document.getElementById("msg");
        var online = typeof navigator !== "undefined" ? navigator.onLine !== false : true;

        function resolveTarget() {
          var path = "/";
          try {
            path = sessionStorage.getItem("mj.last-path") || "/";
          } catch (e0) {}
          if (!path || path.charAt(0) !== "/") path = "/";
          // لا تُعد إلى صفحة الخطأ نفسها
          if (path.indexOf("native-load-error") !== -1) path = "/";
          var ref = "";
          try {
            ref = document.referrer || "";
          } catch (e1) {}
          if (ref && ref.indexOf("ssunnah.com") !== -1 && ref.indexOf("native-load-error") === -1) {
            return ref.split("#")[0];
          }
          var base = LIVE.replace(/\/$/, "");
          return base + path;
        }

        function paintSoft() {
          title.textContent = "جاري إعادة التحميل…";
          msg.textContent = "نجهّز الصفحة. إن استمر التأخير سنساعدك بإعادة المحاولة.";
        }

        function paintFinal() {
          if (!online) {
            title.textContent = "أنت غير متصل بالإنترنت";
            msg.textContent = "تحقق من الاتصال ثم اضغط إعادة المحاولة.";
            return;
          }
          title.textContent = "تعذّر تحميل المحتوى مؤقتًا";
          msg.textContent = "أعد المحاولة. إن استمر الأمر فجرّب لاحقًا.";
        }

        function go() {
          var target = resolveTarget();
          try {
            location.replace(target + (target.indexOf("?") >= 0 ? "&" : "?") + "_r=" + Date.now());
          } catch (e2) {
            location.href = target;
          }
        }

        document.getElementById("retry").addEventListener("click", go);

        // لا تعرض خطأ فوريًا — أعِد التحميل بهدوء مرة، ثم أوضح السبب إن لزم
        if (!online) {
          paintFinal();
        } else {
          paintSoft();
          try {
            if (sessionStorage.getItem("mj.native-load-retry") !== "1") {
              sessionStorage.setItem("mj.native-load-retry", "1");
              setTimeout(go, 1200);
            } else {
              setTimeout(paintFinal, 400);
            }
          } catch (e3) {
            setTimeout(paintFinal, 400);
          }
        }

        try {
          window.addEventListener("online", function () {
            online = true;
            paintSoft();
            go();
          });
        } catch (e4) {}
      })();
    </script>
  </body>
</html>
