    <style id="mj-splash-critical">
      :root{
        --mj-splash-bg-dark:#0E1A15;
        --mj-splash-bg-light:#F2F4F3;
        --mj-splash-fg-dark:#F2F4F3;
        --mj-splash-fg-light:#0E1A15;
        --mj-splash-accent:#C9A227;
        --mj-splash-fg:var(--mj-splash-fg-dark);
        --mj-splash-bg:var(--mj-splash-bg-dark);
        --mj-splash-muted:rgba(242,244,243,.78);
      }
      html[data-theme="light"]{
        --mj-splash-fg:var(--mj-splash-fg-light);
        --mj-splash-bg:var(--mj-splash-bg-light);
        --mj-splash-muted:rgba(14,26,21,.72);
      }
      html.capacitor-native, html.capacitor-native body, html.capacitor-native #root { background-color: var(--mj-splash-bg); }

      #mj-silent-splash{
        position:fixed;
        inset:0;
        z-index:2147483000;
        background:radial-gradient(circle at 50% 46%, rgba(20,51,42,1) 0%, var(--mj-splash-bg) 72%);
        color:var(--mj-splash-fg);
        pointer-events:none;
        overflow:hidden;
      }
      #mj-silent-splash::before{
        content:"";
        position:absolute;
        inset:0;
        background-image:url("/star-pattern.svg");
        background-size:320px 320px;
        background-repeat:repeat;
        opacity:.10;
        pointer-events:none;
      }
      #mj-silent-splash__content{
        position:absolute;
        inset:0;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        padding:calc(2.25rem + var(--inset-top, 0px)) 1rem calc(2.75rem + var(--inset-bottom, 0px)) 1rem;
        text-align:center;
      }
      #mj-silent-splash__logo{
        width:18vmin;
        height:18vmin;
        max-width:130px;
        max-height:130px;
        display:flex;
        align-items:center;
        justify-content:center;
        transform:translateZ(0);
      }
      .mj-silent-splash__glow{
        fill:var(--mj-splash-accent);
        fill-opacity:.12;
        opacity:1;
      }
      #mj-silent-splash__title{
        margin-top:1.2rem;
        font-size:1.55rem;
        font-weight:700;
        letter-spacing:.01em;
        line-height:1.1;
      }
      #mj-silent-splash__subtitle{
        margin-top:.65rem;
        font-size:1rem;
        font-weight:400;
        color:var(--mj-splash-muted);
        line-height:1.35;
        max-width:22rem;
      }
      #mj-silent-splash__progress{
        position:absolute;
        left:max(16px, var(--inset-left, 0px));
        right:max(16px, var(--inset-right, 0px));
        bottom:calc(18px + var(--inset-bottom, 0px));
        height:4px;
        border-radius:999px;
        background:rgba(201,162,39,.14);
        overflow:hidden;
      }
      #mj-silent-splash__progress::after{
        content:"";
        position:absolute;
        inset:0;
        background:rgba(201,162,39,.70);
        transform:scaleX(0);
        transform-origin:left;
        animation:mj-splash-progress-fill 1500ms linear forwards;
      }
      @keyframes mj-splash-progress-fill{
        to{ transform:scaleX(1); }
      }

      #mj-silent-splash.mj-silent-splash--out{
        opacity:0;
        transform:translateY(8px);
        transition:opacity 250ms cubic-bezier(.22, 1, .36, 1), transform 250ms cubic-bezier(.22, 1, .36, 1);
      }
      @media (prefers-reduced-motion: reduce){
        #mj-silent-splash__progress::after{ animation:none; transform:scaleX(1); }
        #mj-silent-splash.mj-silent-splash--out{ transition:none; transform:none; }
      }
    </style>

    <script>
      (function () {
        var el = document.getElementById("mj-silent-splash");
        if (!el) return;
        var KEY = "mj.silent-splash.session";
        var done = false;
        var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var MIN_MS = 900;
        var MAX_MS = 1500;
        var EXIT_MS = 250;

        var start = (window.performance && performance.now) ? performance.now() : Date.now();
        try { window.__mjSplashStart = start; } catch (e) {}

        var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

        function dismiss(immediate) {
          if (done) return;
          done = true;
          try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
          if (!el.parentNode) return;
          el.classList.add("mj-silent-splash--out");
          if (immediate) {
            try { el.remove(); } catch (e) {}
            return;
          }
          window.setTimeout(function () { if (el.parentNode) el.remove(); }, EXIT_MS);
        }
        try { window.__mjDismissSplash = dismiss; } catch (e) {}

        try {
          if (sessionStorage.getItem(KEY) === "1") {
            dismiss(true);
            return;
          }
        } catch (e) {}

        if (!native) {
          dismiss(true);
          return;
        }

        // Hard fallback (React will coordinate hide after mj:app-painted).
        // Start exit a bit earlier to absorb event-loop jitter and guarantee
        // "removed" <= MAX_MS (keep a larger buffer for CI).
        window.setTimeout(function () { dismiss(reduced); }, Math.max(0, MAX_MS - EXIT_MS - 60));
      })();
    </script>
    <script>
      try {
        /* مِشكاة: تطبيق الوضع (ليل/نهار) فوراً لمنع الوميض */
        /* ترحيل v4-light-2026: إعادة تعيين التفضيل عند أول تشغيل بعد تغيير الهوية */
        var _dsv = "v4-light-2026-naskh";
        if (localStorage.getItem("majalis-design-v") !== _dsv) {
          localStorage.setItem("majalis-design-v", _dsv);
          localStorage.removeItem("majalis-theme");
          localStorage.removeItem("majalis-font-preference");
          localStorage.removeItem("majalis-font-preference-v2");
        }
        /* المفتاح الحقيقي المستخدَم في theme-preference.ts هو "majalis-theme" —
           كان هذا المِشكاة يقرأ مفتاحًا مختلفًا ("majalis-theme-preference") لا
           يكتب إليه أي جزء آخر من التطبيق، فكان يُنتج وميض الوضع النهاري دومًا
           قبل أن يُصحِّحه React بعد الترطيب (2026-07-16). */
        var storedTheme = localStorage.getItem("majalis-theme");
        var resolved = storedTheme === "light" ? "light"
          : storedTheme === "dark" ? "dark"
          : storedTheme === "auto"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = resolved;
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.style.colorScheme = resolved === "light" ? "light" : "dark";
        /* theme-color أثناء الإقلاع = خلفية الدخول (يمنع وميض الشريط الأبيض) */
        var splashNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (splashNative) {
          var splashBg = "#0E1A15";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute("content", splashBg);
          });
        }

        var storedFont = localStorage.getItem("majalis-font-preference-v2");
        document.documentElement.dataset.font =
          storedFont === "naskh" || storedFont === "default"
            ? storedFont
            : "naskh";
        document.body.classList.remove("side-nav-open", "navbar-more-open", "mobile-nav-body-lock");
        document.body.style.removeProperty("overflow");
        document.body.style.removeProperty("touch-action");
        document.querySelectorAll(".mobile-nav-layer").forEach(function (el) {
          el.remove();
        });
      } catch (error) {}
    </script>
