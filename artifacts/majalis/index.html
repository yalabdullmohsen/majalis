    <!-- Startup Stabilizer: ثيم + RTL + مقياس خط قبل CSS مرئي -->
    <script id="mj-startup-stabilizer">
      (function () {
        try {
          var html = document.documentElement;
          html.setAttribute("lang", "ar");
          html.setAttribute("dir", "rtl");
          html.classList.add("startup-lock");
          var _dsv = "v10-pwa-single-paint-2026-08";
          if (localStorage.getItem("majalis-design-v") !== _dsv) {
            localStorage.setItem("majalis-design-v", _dsv);
            localStorage.removeItem("majalis-font-preference");
            try {
              localStorage.removeItem("majalis_app_version");
              localStorage.setItem("majalis_force_cache_purge", "1");
            } catch (_) {}
          }
          /* أولوية: اختيار المستخدم (light|dark|auto) → الافتراضي نهاري.
             light لا يتأثر بوضع الجهاز. auto فقط يتبع النظام. */
          var storedTheme = localStorage.getItem("majalis-theme");
          var resolved = "light";
          if (storedTheme === "dark") {
            resolved = "dark";
          } else if (storedTheme === "auto") {
            resolved =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          } else {
            /* light أو قيمة فارغة/غير معروفة → نهاري دائمًا */
            resolved = "light";
          }
          html.dataset.theme = resolved;
          if (resolved === "dark") {
            html.classList.add("dark", "theme-dark");
            html.classList.remove("light", "theme-light");
          } else {
            html.classList.add("light", "theme-light");
            html.classList.remove("dark", "theme-dark");
          }
          html.style.colorScheme = resolved === "dark" ? "dark" : "light";
          var splashBg = resolved === "dark" ? "#101614" : "#F2F4F3";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute("content", splashBg);
            m.removeAttribute("media");
          });
          var csMeta = document.querySelector('meta[name="color-scheme"]');
          if (csMeta) {
            csMeta.setAttribute("content", resolved === "dark" ? "dark light" : "light");
          }
          var storedFont = localStorage.getItem("majalis-font-preference-v2");
          html.dataset.font =
            storedFont === "naskh" || storedFont === "default" ? storedFont : "naskh";
          try {
            var prefs = JSON.parse(localStorage.getItem("majalis-user-settings-v1") || "{}");
            var scale = prefs.seniorMode
              ? "1.16"
              : prefs.fontSize === "صغير"
                ? "0.92"
                : prefs.fontSize === "كبير"
                  ? "1.08"
                  : "1";
            html.style.setProperty("--ui-font-scale", scale);
            html.style.setProperty(
              "--ui-density-scale",
              prefs.seniorMode ? "1" : prefs.uiDensity === "compact" ? "0.92" : "1",
            );
            if (scale !== "1") {
              html.style.fontSize = "calc(1rem * var(--ui-font-scale))";
            }
          } catch (e) {}
          window.addEventListener(
            "mj:app-painted",
            function () {
              html.classList.remove("startup-lock");
            },
            { once: true },
          );
        } catch (e) {}
      })();
    </script>

    <script id="mj-version-boot">
      (function () {
        var FLAG = "majlisilm-refreshing-version";
        if (navigator.webdriver) return;
        if (location.hostname === "127.0.0.1" || location.hostname === "localhost") return;
        try {
          if (sessionStorage.getItem(FLAG) === "1") {
            sessionStorage.removeItem(FLAG);
            return;
          }
        } catch (_) {}
        var prev = null;
        try {
          prev = localStorage.getItem("majalis_app_version");
        } catch (_) {}
        if (!prev) return;
        var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
        var timer =
          ctrl &&
          setTimeout(function () {
            try {
              ctrl.abort();
            } catch (_) {}
          }, 2500);
        fetch("/version.json?t=" + Date.now(), {
          cache: "no-store",
          signal: ctrl ? ctrl.signal : undefined,
        })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(function (j) {
            if (timer) clearTimeout(timer);
            if (!j) return;
            var live = String(j.shortCommit || j.commit || "").slice(0, 12);
            if (!live) return;
            var same =
              live === prev ||
              prev.indexOf(live) === 0 ||
              live.indexOf(prev) === 0;
            if (same) return;
            try {
              sessionStorage.setItem(FLAG, "1");
              localStorage.setItem("majalis_force_cache_purge", "1");
            } catch (_) {}
            var finish = function () {
              location.reload();
            };
            if (!window.caches || !caches.keys) {
              finish();
              return;
            }
            caches
              .keys()
              .then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k);
                  }),
                );
              })
              .catch(function () {})
              .then(finish);
          })
          .catch(function () {
            if (timer) clearTimeout(timer);
          });
      })();
    </script>

      :root{
        --mj-splash-bg-dark:#101614;
        --mj-splash-bg-light:#F2F4F3;
        --mj-splash-bg:var(--mj-splash-bg-light);

      }
      html[data-theme="dark"]{
        --mj-splash-bg:var(--mj-splash-bg-dark);
        --mj-splash-ink:#a8d5c0;
        --mj-splash-ink-muted:#7a9a8c;
        --mj-splash-ornament:rgba(168,213,192,0.12);

      html, body, #root { background-color: var(--mj-splash-bg); }
      html.capacitor-native, html.capacitor-native body, html.capacitor-native #root { background-color: var(--mj-splash-bg); }

      #mj-launch-splash{
        position:fixed;
        inset:0;
        z-index:2147483000;
        display:flex;
        align-items:center;
        justify-content:center;
        background:var(--mj-splash-bg);
        color:var(--mj-splash-ink);
        pointer-events:none;
        opacity:1;
        transition:opacity 90ms ease;
      }
      #mj-launch-splash.mj-launch-splash--out{
        opacity:0;
      }
      .mj-launch-splash__inner{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:0.85rem;
        width:min(88vw,22rem);
        text-align:center;
        animation:mj-launch-enter 220ms cubic-bezier(0.22,1,0.36,1) both;
      }
      .mj-launch-splash__ornament{
        position:absolute;
        width:min(72vw,18rem);
        height:min(72vw,18rem);
        color:var(--mj-splash-ornament);
        opacity:1;
        pointer-events:none;
      }
      .mj-launch-splash__title{
        position:relative;
        z-index:1;
        margin:0;
        min-height:2.85rem;
        font-family:"Amiri","Noto Naskh Arabic",serif;
        font-size:clamp(1.85rem,8.5vw,2.35rem);
        font-weight:400;
        line-height:1.2;
        color:var(--mj-splash-ink);
      }
      .mj-launch-splash__tagline{
        position:relative;
        z-index:1;
        margin:0;
        font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
        font-size:0.82rem;
        font-weight:500;
        letter-spacing:0.01em;
        color:var(--mj-splash-ink-muted);
      }
      @keyframes mj-launch-enter{
        from{ opacity:0; transform:scale(0.97); }
        to{ opacity:1; transform:scale(1); }
      }
      @media (prefers-reduced-motion: reduce){
        .mj-launch-splash__inner{ animation:none; }
        #mj-launch-splash.mj-launch-splash--out{ transition:none; }
      }
    </style>

    <script>
      (function () {
        var el = document.getElementById("mj-launch-splash");
        if (!el) return;
        var KEY = "mj.launch-splash.session.v2";
        var done = false;
        var appReady = false;
        var MIN_MS = 120;
        var SOFT_MAX_MS = 420;
        var MAX_MS = 1400;
        var EXIT_MS = 90;
        var bootReady = false;
        var start = (window.performance && performance.now) ? performance.now() : Date.now();
        try { window.__mjSplashStart = start; } catch (e) {}
        function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
        function fontsLikelyReady() {
          try {
            if (!document.fonts || !document.fonts.check) return true;
            var preferNaskh = document.documentElement.dataset.font !== "default";
            return preferNaskh
              ? document.fonts.check('16px "Noto Naskh Arabic"')
              : document.fonts.check('16px "Amiri"');
          } catch (e) { return true; }
        }
        function dismiss(immediate) {
          if (done) return;
          done = true;
          try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
          if (!el.parentNode) return;
          if (immediate) {
            try { el.remove(); } catch (e) {}
            return;
          }
          el.classList.add("mj-launch-splash--out");
          window.setTimeout(function () { if (el.parentNode) el.remove(); }, EXIT_MS);
        }
        function tryDismiss() {
          if (done) return;
          var elapsed = now() - start;
          if (elapsed < MIN_MS) return;
          var fontsOk = bootReady || fontsLikelyReady();
          /* لا تكشف الواجهة قبل الخطوط إلا عند السقف الصلب */
          if (!fontsOk && elapsed < MAX_MS) return;
          if (!appReady && !bootReady && elapsed < MAX_MS) return;
          /* خطوط جاهزة: أخفِ بعد الحد الأدنى (هدف LCP الليّن SOFT_MAX عند البطء فقط كمرجع) */
          if (fontsOk && (bootReady || appReady)) {
            dismiss(false);
            return;
          }
          if (elapsed >= MAX_MS) dismiss(false);
        }
        try { window.__mjDismissSplash = dismiss; } catch (e) {}
        try {
          var forceBench = /[?&]splash_timing=1(?:&|$)/.test(location.search);
          if (!forceBench && (navigator.webdriver || location.hostname === "127.0.0.1" || location.hostname === "localhost")) {
            dismiss(true);
            return;
          }
          if (!forceBench && sessionStorage.getItem(KEY) === "1") {
            dismiss(true);
            return;
          }
        } catch (e) {}
        window.addEventListener("mj:app-painted", function () {
          appReady = true;
          tryDismiss();
        }, { once: true });
        window.addEventListener("mj:boot-ready", function () {
          bootReady = true;
          appReady = true;
          tryDismiss();
        }, { once: true });
        window.setTimeout(function () {
          appReady = true;
          bootReady = true;
          tryDismiss();
        }, MAX_MS);
        window.setTimeout(tryDismiss, MIN_MS);
      })();
    </script>
