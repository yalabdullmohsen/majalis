      :root {

        --mj-boot-fg: var(--mj-boot-fg-dark);
        --mj-boot-bg: var(--mj-boot-bg-dark);
        --mj-boot-muted: rgba(242, 244, 243, 0.78);

      html[data-theme="light"] {
        --mj-boot-fg: var(--mj-boot-fg-light);

      html, body, #root { background-color: #F2F4F3; margin: 0; min-height: 100dvh; }

      .mj-boot-sk-header { box-sizing: border-box; min-height: calc(56px + var(--inset-top, 0px)); background: rgba(20, 63, 53, 0.05); }

      .mj-boot-sk-start { min-height: 37.8rem; margin: 0.75rem 1rem 0; background: rgba(20, 63, 53, 0.04); border-radius: 1rem; }
      .mj-boot-sk-nav { position: absolute; left: 0; right: 0; bottom: 0; min-height: calc(3.25rem + var(--inset-bottom, 0px)); background: rgba(20, 63, 53, 0.06); }
      @media (min-width: 720px) { .mj-boot-sk-search, .mj-boot-sk-ticker { display: none; } .mj-boot-sk-start { min-height: 24rem; } }
      @media (min-width: 880px) { .mj-boot-sk-nav, .mj-boot-sk-sections { display: none; } }
      .mj-boot-native { position: absolute; inset: 0; display: none; background: radial-gradient(circle at 50% 46%, rgba(20, 51, 42, 1) 0%, var(--mj-boot-bg) 72%); color: var(--mj-boot-fg); }
      .mj-boot-native::before { content: ""; position: absolute; inset: 0; background-image: url("/star-pattern.svg"); background-size: 320px 320px; background-repeat: repeat; opacity: .10; pointer-events: none; }
      .mj-boot-native__content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(2.25rem + var(--inset-top, 0px)) 1rem calc(2.75rem + var(--inset-bottom, 0px)) 1rem; text-align: center; }
      .mj-boot-native__logo { width: 18vmin; height: 18vmin; max-width: 130px; max-height: 130px; display: flex; align-items: center; justify-content: center; transform: translateZ(0); }
      .mj-boot-native__glow { fill: var(--mj-boot-accent); fill-opacity: .12; }
      .mj-boot-native__title { margin-top: 1.2rem; font-size: 1.55rem; font-weight: 700; letter-spacing: .01em; line-height: 1.1; }
      .mj-boot-native__subtitle { margin-top: .65rem; font-size: 1rem; font-weight: 400; color: var(--mj-boot-muted); line-height: 1.35; max-width: 22rem; }
      .mj-boot-native__progress { position: absolute; left: max(16px, var(--inset-left, 0px)); right: max(16px, var(--inset-right, 0px)); bottom: calc(18px + var(--inset-bottom, 0px)); height: 4px; border-radius: 999px; background: rgba(201, 162, 39, .14); overflow: hidden; }
      .mj-boot-native__progress::after { content: ""; position: absolute; inset: 0; background: rgba(201, 162, 39, .70); transform: scaleX(0); transform-origin: left; animation: mj-boot-progress-fill 1500ms linear forwards; }
      @keyframes mj-boot-progress-fill { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { #mj-boot-layer.mj-boot-layer--out { transition: none; transform: none; } .mj-boot-native__progress::after { animation: none; transform: scaleX(1); } }
      html.capacitor-native .mj-boot-native { display: block; }
      html.capacitor-native .mj-boot-web { display: none; }

    <script>
      (function () {
        var el = document.getElementById("mj-boot-layer");
        if (!el) return;
        var KEY = "mj.boot.session.v1";
        var done = false;
        var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var MIN_MS = 900;
        var MAX_MS = 1500;
        var EXIT_MS = 250;
        var start = (window.performance && performance.now) ? performance.now() : Date.now();
        try { window.__mjBootStart = start; } catch (e) {}
        var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (native) document.documentElement.classList.add("capacitor-native");
        function dismiss(immediate) {
          if (done) return;
          done = true;
          try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
          if (!el.parentNode) return;
          el.classList.add("mj-boot-layer--out");
          if (immediate) {
            try { el.remove(); } catch (e) {}
            return;
          }
          window.setTimeout(function () { if (el.parentNode) el.remove(); }, EXIT_MS);
        }
        try { window.__mjBootDismiss = dismiss; } catch (e) {}
        try {
          if (sessionStorage.getItem(KEY) === "1") {
            dismiss(true);
            return;
          }
        } catch (e) {}
        if (!native) return;
        window.setTimeout(function () { dismiss(reduced); }, Math.max(0, MAX_MS - EXIT_MS - 60));
      })();
    </script>
    <script>
      try {
        /* مِشكاة: تطبيق الوضع (ليل/نهار) فوراً لمنع الوميض */
        /* ترحيل v4-light-2026: إعادة تعيين التفضيل عند أول تشغيل بعد تغيير الهوية */
        var _dsv = "v4-light-2026-naskh";
        if (localStorage.getItem("majalis-design-v") !== _dsv) {
          localStorage.setItem("majalis-design-v", _dsv);
          localStorage.removeItem("majalis-theme");
          localStorage.removeItem("majalis-font-preference");
          localStorage.removeItem("majalis-font-preference-v2");
        }
        /* المفتاح الحقيقي المستخدَم في theme-preference.ts هو "majalis-theme" —
           كان هذا المِشكاة يقرأ مفتاحًا مختلفًا ("majalis-theme-preference") لا
           يكتب إليه أي جزء آخر من التطبيق، فكان يُنتج وميض الوضع النهاري دومًا
           قبل أن يُصحِّحه React بعد الترطيب (2026-07-16). */
        var storedTheme = localStorage.getItem("majalis-theme");
        var resolved = storedTheme === "light" ? "light"
          : storedTheme === "dark" ? "dark"
          : storedTheme === "auto"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = resolved;
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.style.colorScheme = resolved === "light" ? "light" : "dark";
        /* theme-color أثناء الإقلاع = خلفية الدخول (يمنع وميض الشريط الأبيض) */
        var splashNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (splashNative) {
          var splashBg = "#0E1A15";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute("content", splashBg);
          });
        }

        var storedFont = localStorage.getItem("majalis-font-preference-v2");
        document.documentElement.dataset.font =
          storedFont === "naskh" || storedFont === "default"
            ? storedFont
            : "naskh";
        document.body.classList.remove("side-nav-open", "navbar-more-open", "mobile-nav-body-lock");
        document.body.style.removeProperty("overflow");
        document.body.style.removeProperty("touch-action");
        document.querySelectorAll(".mobile-nav-layer").forEach(function (el) {
          el.remove();
        });
      } catch (error) {}
    </script>
