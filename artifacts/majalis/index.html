    <style id="mj-splash-critical">
      :root{
        --mj-splash-bg-dark:#101614;
        --mj-splash-bg-light:#F2F4F3;
        --mj-splash-bg:var(--mj-splash-bg-light);
        --mj-splash-ink:#123f2e;
        --mj-splash-ink-muted:#4a6b5f;
        --mj-splash-ornament:rgba(18,63,46,0.1);
      }
      html[data-theme="dark"]{
        --mj-splash-bg:var(--mj-splash-bg-dark);
        --mj-splash-ink:#a8d5c0;
        --mj-splash-ink-muted:#7a9a8c;
        --mj-splash-ornament:rgba(168,213,192,0.12);
      }
      html, body, #root { background-color: var(--mj-splash-bg); }
      html.capacitor-native, html.capacitor-native body, html.capacitor-native #root { background-color: var(--mj-splash-bg); }

      #mj-launch-splash{
        position:fixed;
        inset:0;
        z-index:2147483000;
        display:flex;
        align-items:center;
        justify-content:center;
        background:var(--mj-splash-bg);
        color:var(--mj-splash-ink);
        pointer-events:none;
        opacity:1;
        transition:opacity 280ms ease;
      }
      #mj-launch-splash.mj-launch-splash--out{
        opacity:0;
      }
      .mj-launch-splash__inner{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:0.85rem;
        width:min(88vw,22rem);
        text-align:center;
        animation:mj-launch-enter 520ms cubic-bezier(0.22,1,0.36,1) both;
      }
      .mj-launch-splash__ornament{
        position:absolute;
        width:min(72vw,18rem);
        height:min(72vw,18rem);
        color:var(--mj-splash-ornament);
        opacity:1;
        pointer-events:none;
      }
      .mj-launch-splash__wordmark{
        position:relative;
        z-index:1;
        width:min(78vw,19rem);
        height:auto;
        color:var(--mj-splash-ink);
      }
      .mj-launch-splash__tagline{
        position:relative;
        z-index:1;
        margin:0;
        font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
        font-size:0.82rem;
        font-weight:500;
        letter-spacing:0.01em;
        color:var(--mj-splash-ink-muted);
      }
      @keyframes mj-launch-enter{
        from{ opacity:0; transform:scale(0.97); }
        to{ opacity:1; transform:scale(1); }
      }
      @media (prefers-reduced-motion: reduce){
        .mj-launch-splash__inner{ animation:none; }
        #mj-launch-splash.mj-launch-splash--out{ transition:none; }
      }
    </style>

    <script>
      (function () {
        var el = document.getElementById("mj-launch-splash");
        if (!el) return;
        var KEY = "mj.launch-splash.session.v2";
        var done = false;
        var appReady = false;
        var MIN_MS = 700;
        var MAX_MS = 1000;
        var EXIT_MS = 280;
        var start = (window.performance && performance.now) ? performance.now() : Date.now();
        try { window.__mjSplashStart = start; } catch (e) {}
        function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
        function dismiss(immediate) {
          if (done) return;
          done = true;
          try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
          if (!el.parentNode) return;
          if (immediate) {
            try { el.remove(); } catch (e) {}
            return;
          }
          el.classList.add("mj-launch-splash--out");
          window.setTimeout(function () { if (el.parentNode) el.remove(); }, EXIT_MS);
        }
        function tryDismiss() {
          if (done) return;
          var elapsed = now() - start;
          if (elapsed < MIN_MS) return;
          if (!appReady && elapsed < MAX_MS) return;
          dismiss(false);
        }
        try { window.__mjDismissSplash = dismiss; } catch (e) {}
        window.addEventListener("mj:app-painted", function () {
          appReady = true;
          tryDismiss();
        }, { once: true });
        window.setTimeout(function () {
          appReady = true;
          tryDismiss();
        }, MAX_MS);
        var tick = window.setInterval(function () {
          tryDismiss();
          if (done) window.clearInterval(tick);
        }, 48);
      })();
    </script>
