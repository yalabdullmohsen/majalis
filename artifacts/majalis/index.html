    <!-- ثيم+RTL+حجم خط قبل أي CSS/JS — أول إطار ثابت (v11-startup-stable-2026-08) -->
    <script id="mj-theme-boot">
      (function () {
        try {
          var html = document.documentElement;
          html.setAttribute("lang", "ar");
          html.setAttribute("dir", "rtl");
          html.classList.add("app-booting");
          html.dataset.appBooting = "1";
          var _dsv = "v12-startup-stable-first-frame-2026-08";
          if (localStorage.getItem("majalis-design-v") !== _dsv) {
            localStorage.setItem("majalis-design-v", _dsv);
            /* لا تمسح تفضيل الخط — مسحه يسبب قفزة خط بعد أول إطار */
            try {
              localStorage.setItem("majalis_force_cache_purge", "1");
              localStorage.removeItem("majlis_intro_seen");
              localStorage.removeItem("majalis-intro-seen");
              localStorage.removeItem("majlis-home-welcomed-v1");
            } catch (_) {}
          }
          /* أولوية: اختيار المستخدم (light|dark|auto) → الافتراضي نهاري.
             light لا يتأثر بوضع الجهاز. auto فقط يتبع النظام. */
          var storedTheme = localStorage.getItem("majalis-theme");
          var resolved = "light";
          if (storedTheme === "dark") {
            resolved = "dark";
          } else if (storedTheme === "auto") {
            resolved =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          } else {
            /* light أو قيمة فارغة/غير معروفة → نهاري دائمًا */
            resolved = "light";
          }
          html.dataset.theme = resolved;
          if (resolved === "dark") {
            html.classList.add("dark", "theme-dark");
            html.classList.remove("light", "theme-light");
          } else {
            html.classList.add("light", "theme-light");
            html.classList.remove("dark", "theme-dark");
          }
          html.style.colorScheme = resolved === "dark" ? "dark" : "light";
          var splashBg = resolved === "dark" ? "#101614" : "#F2F4F3";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute("content", splashBg);
            m.removeAttribute("media");
          });
          var csMeta = document.querySelector('meta[name="color-scheme"]');
          if (csMeta) {
            csMeta.setAttribute("content", resolved === "dark" ? "dark light" : "light");
          }
          var storedFont = localStorage.getItem("majalis-font-preference-v2");
          html.dataset.font =
            storedFont === "naskh" || storedFont === "default" ? storedFont : "naskh";

          /* حجم الخط/الكثافة من الإعدادات قبل React — لا قفزة بعد أول رسم */
          var fontScale = 1;
          var densityScale = 1;
          var readingPx = 17;
          var quranPx = 22;
          var lineH = "1.85";
          var maxW = "68ch";
          var density = "comfortable";
          var contrast = "normal";
          var senior = false;
          try {
            var raw = JSON.parse(localStorage.getItem("majalis-user-settings-v1") || "{}") || {};
            senior = raw.seniorMode === true;
            var fs = raw.fontSize;
            fontScale = senior ? 1.16 : fs === "صغير" ? 0.92 : fs === "كبير" ? 1.08 : 1;
            if (fontScale < 0.85) fontScale = 0.85;
            if (fontScale > 1.35) fontScale = 1.35;
            density = senior ? "comfortable" : raw.uiDensity === "compact" ? "compact" : "comfortable";
            densityScale = density === "compact" && !senior ? 0.92 : 1;
            var baseReading = Number(raw.readingTextSize) || 17;
            readingPx = senior ? Math.max(baseReading, 22) : baseReading;
            if (readingPx < 14) readingPx = 14;
            if (readingPx > 32) readingPx = 32;
            quranPx = Number(raw.quranFontScale) || 22;
            var spacing = raw.readingSpacing;
            lineH =
              senior || spacing === "واسع" ? "2.1" : spacing === "ضيق" ? "1.6" : "1.85";
            var rw = raw.readingWidth;
            maxW = rw === "ضيق" ? "52ch" : rw === "واسع" ? "78ch" : "68ch";
            contrast = senior || raw.highContrast === true ? "high" : "normal";
            if (raw.direction === "ltr" || raw.direction === "rtl") {
              html.setAttribute("dir", raw.direction);
            }
            html.dataset.readingTheme = raw.readingTheme || "default";
            html.dataset.readingMode = raw.readingMode ? "quiet" : "normal";
            html.dataset.readingWidth = rw === "ضيق" || rw === "واسع" ? rw : "متوسط";
          } catch (_) {}
          html.style.setProperty("--ui-font-scale", String(fontScale));
          html.style.setProperty("--ui-density-scale", String(densityScale));
          html.style.setProperty("--reading-font-size", readingPx + "px");
          html.style.setProperty("--quran-font-size", quranPx + "px");
          html.style.setProperty("--reading-line-height", lineH);
          html.style.setProperty("--reading-max-width", maxW);
          html.dataset.uiDensity = density;
          html.dataset.contrast = contrast;
          html.dataset.seniorMode = senior ? "1" : "0";

          function clearBooting() {
            if (html.dataset.appBooting === "0") return;
            html.classList.remove("app-booting");
            html.dataset.appBooting = "0";
            try {
              window.dispatchEvent(new Event("mj:shell-stable"));
            } catch (_) {}
          }
          window.addEventListener(
            "mj:boot-ready",
            function () {
              /* إطاران مستقران بعد جاهزية الخطوط/الثيم — بلا تأخير ثابت اصطناعي */
              requestAnimationFrame(function () {
                requestAnimationFrame(clearBooting);
              });
            },
            { once: true },
          );
          window.setTimeout(clearBooting, 900);
        } catch (e) {}
      })();
    </script>
    <!-- فحص نسخة مبكر: يجهّز المسح بهدوء — بلا reload أثناء أول إطار -->
    <script id="mj-version-boot">
      (function () {
        var FLAG = "majlisilm-refreshing-version";
        if (navigator.webdriver) return;
        if (location.hostname === "127.0.0.1" || location.hostname === "localhost") return;
        try {
          if (sessionStorage.getItem(FLAG) === "1") {
            sessionStorage.removeItem(FLAG);
            return;
          }
        } catch (_) {}
        var prev = null;
        try {
          prev = localStorage.getItem("majalis_app_version");
        } catch (_) {}
        if (!prev) return;
        var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
        var timer =
          ctrl &&
          setTimeout(function () {
            try {
              ctrl.abort();
            } catch (_) {}
          }, 2500);
        fetch("/version.json?t=" + Date.now(), {
          cache: "no-store",
          signal: ctrl ? ctrl.signal : undefined,
        })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(function (j) {
            if (timer) clearTimeout(timer);
            if (!j) return;
            var live = String(j.shortCommit || j.commit || "").slice(0, 12);
            if (!live) return;
            var same =
              live === prev ||
              prev.indexOf(live) === 0 ||
              live.indexOf(prev) === 0;
            if (same) return;
            try {
              localStorage.setItem("majalis_force_cache_purge", "1");
              localStorage.setItem("majalis_app_version", live);
            } catch (_) {}
            /* مسح كاش قديم في الخلفية — لا reload مفاجئ أثناء أول فتح */
            if (!window.caches || !caches.keys) return;
            caches
              .keys()
              .then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    if (
                      /intro|onboard|welcome|splash|boot-guide|first-?launch|first-?run/i.test(k) ||
                      (k.indexOf("majlisilm-v") === 0 && k.indexOf(live) < 0)
                    ) {
                      return caches.delete(k);
                    }
                    return Promise.resolve(false);
                  }),
                );
              })
              .catch(function () {});
          })
          .catch(function () {
            if (timer) clearTimeout(timer);
          });
      })();
    </script>
    <style id="mj-lcp-critical">
      /* سطح نهائي فورًا — بلا أبيض افتراضي وبلا انتظار خط ثلث/رقعة */

        font-weight: 400;
      }
      /* أثناء app-booting: بلا انتقالات مقاسات؛ الطبقة الثابتة هي #mj-launch-splash */
      html.app-booting,
      html.app-booting *,
      html.app-booting *::before,
      html.app-booting *::after {
        transition-property: opacity, color, background-color, border-color, box-shadow, transform, filter;
        animation-duration: 0.001ms;

      }
      html.theme-dark, html[data-theme="dark"],
      html.theme-dark body, html[data-theme="dark"] body,
      html.theme-dark #root, html[data-theme="dark"] #root {
        background-color: #101614;
        color: #e8efea;
      }
      :root {
        --inset-top: env(safe-area-inset-top, 0px);
        --inset-bottom: env(safe-area-inset-bottom, 0px);
        --inset-right: env(safe-area-inset-right, 0px);
        --inset-left: env(safe-area-inset-left, 0px);
        --ticker-h: 2.65rem;
        --header-chrome: 56px;
        --header-ad-h: 48px;
        --ad-row-h: 0px;
        /* الإعلان مدمج داخل صف الأزرار — بلا ارتفاع صف منفصل */
        --ad-banner-height: 0px;
        --search-height: 0px;
        --ticker-row-h: 0px;
        --header-h: calc(var(--header-chrome) + var(--inset-top, 0px) + var(--ad-banner-height, 0px));
        --app-top-chrome-h: calc(var(--header-h) + var(--search-height) + var(--ticker-row-h));
        --bottom-nav-h: 64px;
        --bottom-nav-height: 64px;
        --nav-h: calc(var(--bottom-nav-height) + var(--inset-bottom, 0px));
        --content-pb: calc(var(--bottom-nav-height) + var(--inset-bottom, 0px) + 24px);
        --mm-paper: #f7f1e3;
      }
      @media (max-width: 879px) {
        :root {
          --header-chrome: 48px;
          --search-height: 3.25rem;
          --ticker-row-h: calc(var(--ticker-h) + 0.65rem);
          --app-top-chrome-h: calc(
            var(--header-chrome) + var(--inset-top, 0px) + var(--ad-banner-height) +
              var(--search-height) + var(--ticker-row-h)
          );
        }
      }
      html.theme-dark, html[data-theme="dark"] {
        --mm-paper: #1a221c;
      }
      /* PWA / standalone: املأ الشاشة؛ Safe Area عبر --inset-* في الهيكل */
      @media (display-mode: standalone), (display-mode: fullscreen) {
        html, body {
          min-height: 100dvh;
          min-height: -webkit-fill-available;
        }
      }
      .app-top-chrome {
        min-height: var(--app-top-chrome-h);
        box-sizing: border-box;
      }
      .navbar-v3 { min-height: 0; box-sizing: border-box; }
      .navbar-v3__ad-row {
        display: none !important;
        min-height: 0 !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .navbar-v3__search-row {
        height: var(--search-height);
        min-height: var(--search-height);
        max-height: var(--search-height);
        box-sizing: border-box;
      }
      .navbar-ticker-row {
        min-height: var(--ticker-row-h, var(--ticker-h, 2.25rem));
        height: var(--ticker-row-h, var(--ticker-h, 2.25rem));
        box-sizing: border-box;
      }
      .header-ticker {
        height: var(--ticker-h, 2.25rem);
        min-height: var(--ticker-h, 2.25rem);
        max-height: var(--ticker-h, 2.25rem);

      }
      .bottom-nav, [data-bottom-nav] {
        min-height: var(--nav-h);

      }
      html.theme-dark .bottom-nav,

      html.theme-dark [data-bottom-nav],
      html[data-theme="dark"] [data-bottom-nav] {
        background-color: #101614;
      }
