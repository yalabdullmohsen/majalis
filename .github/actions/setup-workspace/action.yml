name: Setup workspace
description: >
  تهيئة موحّدة لكل وظائف CI — Node + pnpm + كاش دائم للمخزن وnode_modules
  وvite وخطوط/بيانات المصحف ومتصفحات Playwright. مصدر واحد يمنع تكرار
  ٤٠ سطرًا في كل وظيفة ويمنع `pnpm install` كاملًا في كل مرة.

inputs:
  node-version:
    description: إصدار Node
    required: false
    default: "24"
  playwright:
    description: ثبّت متصفح Chromium لـPlaywright (كاش دائم)
    required: false
    default: "false"
  install:
    description: نفّذ pnpm install (اجعلها false للوظائف التي لا تحتاج تبعيات)
    required: false
    default: "true"

outputs:
  node-modules-cache-hit:
    description: هل أُصيب كاش node_modules إصابة تامة
    value: ${{ steps.nm.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Preflight (paths + lockfile)
      shell: bash
      run: bash "${{ github.action_path }}/preflight.sh"

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    # Corepack على Node 24 يفشل أحيانًا عند جلب pnpm من registry.npmjs.org
    # (AssertionError undici أو فشل الشبكة). نعيد المحاولة ثم npm fallback.
    - name: Enable pnpm (corepack retry + npm fallback)
      shell: bash
      run: bash "${{ github.action_path }}/activate-pnpm.sh"

    - name: Setup workspace smoke
      shell: bash
      run: |
        set -euo pipefail
        command -v pnpm >/dev/null
        pnpm --version
        test -f pnpm-lock.yaml
        test -f package.json
        echo "[setup-workspace] smoke ok"

    - name: Cache pnpm store
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    # كاش node_modules نفسه: يحوّل `pnpm install` من ٦٠–٩٠ث إلى ~٥ث
    # في كل وظيفة بعد الأولى. المفتاح lockfile فقط — أي تغيير تبعية يبطله.
    - name: Cache node_modules
      id: nm
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          node_modules
          artifacts/majalis/node_modules
          artifacts/api-server/node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Cache hit/miss log
      shell: bash
      run: |
        set -euo pipefail
        HIT="${{ steps.nm.outputs.cache-hit }}"
        KEY="node-modules-${{ runner.os }}-node${{ inputs.node-version }}-<pnpm-lock-hash>"
        if [ "$HIT" = "true" ]; then
          echo "::notice::cache HIT node_modules key≈$KEY"
        else
          echo "::notice::cache MISS node_modules key≈$KEY (lockfile/OS/node change)"
        fi

    - name: Install (offline-first عند إصابة الكاش)
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.nm.outputs.cache-hit }}" = "true" ]; then
          echo "::notice::node_modules من الكاش — install مختصر"
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
        else
          pnpm install --frozen-lockfile --prefer-offline
        fi

    # كاش vite: يقصّر transform الأولي في build وvite preview.
    - name: Cache Vite
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: artifacts/majalis/node_modules/.vite
        key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'artifacts/majalis/vite.config.ts') }}
        restore-keys: vite-${{ runner.os }}-

    # كاش tsbuildinfo + مخرجات composite: بلا dist يظهر TS6305 عند استعادة الكاش الجزئي.
    - name: Cache tsbuildinfo
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          **/*.tsbuildinfo
          artifacts/majalis/.tsbuildinfo
          lib/api-zod/dist
          lib/db/dist
          lib/api-client-react/dist
          artifacts/api-server/dist-types
        key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json') }}-${{ github.sha }}
        restore-keys: |
          tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json') }}-
          tsbuildinfo-${{ runner.os }}-

    # خطوط QPC وبيانات المصحف: ضخمة وثابتة — كاش دائم مفتاحه المحتوى.
    - name: Cache mushaf fonts + data
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          artifacts/majalis/public/fonts/qpc-v2
          artifacts/majalis/public/data/quran
          ~/.cache/majalis-quran
        key: mushaf-assets-${{ runner.os }}-${{ hashFiles('artifacts/majalis/scripts/quran-import/**/*.mjs') }}
        restore-keys: mushaf-assets-${{ runner.os }}-

    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: playwright-${{ runner.os }}-

    - name: Install Playwright Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm --filter @workspace/majalis exec playwright install --with-deps chromium
