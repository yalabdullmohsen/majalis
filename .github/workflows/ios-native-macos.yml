name: iOS native (macOS)

# Real Xcode build/test when iOS/Capacitor paths change.
# Does NOT upload to TestFlight. Does NOT change signing settings.
on:
  pull_request:
    paths:
      - "artifacts/majalis/ios/**"
      - "artifacts/majalis/capacitor.config.ts"
      - "artifacts/majalis/src/lib/native-*.ts"
      - "artifacts/majalis/src/lib/prayer-ticker.ts"
      - ".github/workflows/ios-native-macos.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/majalis/ios/**"
      - "artifacts/majalis/capacitor.config.ts"

concurrency:
  group: ios-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  xcode:
    name: xcodebuild-simulator
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install + web build + cap sync
        working-directory: artifacts/majalis
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: |
          cd ../..
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/majalis exec playwright install --with-deps chromium
          pnpm --filter @workspace/majalis run build
          cd artifacts/majalis
          pnpm exec cap sync ios

      - name: List schemes / simulators
        working-directory: artifacts/majalis/ios/App
        run: |
          xcodebuild -version
          xcodebuild -list -project App.xcodeproj
          xcrun simctl list devices available

      - name: Debug simulator build
        working-directory: artifacts/majalis/ios/App
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          for runtime, devices in d.get("devices", {}).items():
            if "iOS" not in runtime: continue
            for dev in devices:
              if dev.get("isAvailable") and "iPhone" in dev.get("name",""):
                print(dev["udid"]); sys.exit(0)
          sys.exit(1)
          ')
          echo "UDID=$UDID"
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            clean build | xcpretty || xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            clean build

      - name: Release build (no code signing)
        working-directory: artifacts/majalis/ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Simulator test (best-effort XCTest)
        working-directory: artifacts/majalis/ios/App
        continue-on-error: false
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          for runtime, devices in d.get("devices", {}).items():
            if "iOS" not in runtime: continue
            for dev in devices:
              if dev.get("isAvailable") and "iPhone" in dev.get("name",""):
                print(dev["udid"]); sys.exit(0)
          sys.exit(1)
          ')
          # If the scheme has no test targets, xcodebuild test fails — treat as soft gate via scheme inspection.
          if xcodebuild -list -project App.xcodeproj 2>/dev/null | grep -qi 'Tests'; then
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -destination "platform=iOS Simulator,id=$UDID" \
              test \
              -resultBundlePath build/TestResults.xcresult
          else
            echo "No XCTest target listed — skip test; Debug+Release builds remain required."
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-xcode-logs
          path: |
            artifacts/majalis/ios/App/build
            ~/Library/Logs/gym
          if-no-files-found: ignore
