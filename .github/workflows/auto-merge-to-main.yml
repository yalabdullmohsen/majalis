name: Auto-ready and merge PRs to main

# دورة تلقائية بلا تدخل يدوي (طلب المالك 2026-07-26، مُحدَّث 2026-07-27):
# أي PR من فروع العمل المعتمدة يستهدف main → Ready → Auto-merge (squash)
# → حذف الفرع بعد الدمج. عند فشل CI يُلغى Auto-merge. عند التعارض يحاول
# rebase/merge من main تلقائيًا (workflow منفصل). النشر عبر Vercel من main
# + بوابة auto-deploy.yml.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "رقم PR محدد (فارغ = كل المؤهلة)"
        required: false
        type: string

concurrency:
  group: auto-merge-pr-${{ github.event.pull_request.number || github.event.workflow_run.id || github.event.inputs.pr_number || 'batch' }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

env:
  GH_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  cancel-on-ci-failure:
    if: github.repository == 'yalabdullmohsen/majalis' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: إلغاء Auto-merge عند فشل CI
        env:
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          nums=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${WORKFLOW_HEAD_SHA}/pulls" \
            --jq '[.[] | select(.base.ref=="main") | .number] | join(" ")' || true)
          if [ -z "${nums}" ]; then
            nums=$(gh -R "$GITHUB_REPOSITORY" pr list --base main --state open \
              --head "${GITHUB_REPOSITORY_OWNER}:${WORKFLOW_HEAD_BRANCH}" \
              --json number --jq '.[].number' | tr '\n' ' ' || true)
          fi
          for n in $nums; do
            echo "إلغاء Auto-merge لـ #$n بسبب فشل CI"
            gh -R "$GITHUB_REPOSITORY" pr merge "$n" --disable-auto || true
            gh -R "$GITHUB_REPOSITORY" pr comment "$n" --body "⛔ أُلغي Auto-merge لأن فحص CI فشل. أصلِح الفشل وسيُعاد تفعيل الدمج تلقائيًا بعد نجاح الفحوصات." || true
          done

  auto-merge:
    if: github.repository == 'yalabdullmohsen/majalis' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: تحديد قائمة الـ PRs المستهدفة
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          ALLOW='^(cursor|session|claude|automation|fix|feature)/'
          EXCLUDE_DUAL='^(automation/content|automation/tasks)$'
          nums=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_BASE_REF" != "main" ]; then
              echo "تخطي: القاعدة ليست main ($PR_BASE_REF)"
              echo "nums=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
              echo "تخطي: PR من مستودع خارجي"
              echo "nums=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            nums="$PR_NUMBER"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            nums=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${WORKFLOW_HEAD_SHA}/pulls" \
              --jq '[.[] | select(.base.ref=="main" and .head.repo.full_name=="'"${GITHUB_REPOSITORY}"'") | .number] | join(" ")' || true)
            if [ -z "${nums}" ]; then
              nums=$(gh -R "$GITHUB_REPOSITORY" pr list --base main --state open \
                --head "${GITHUB_REPOSITORY_OWNER}:${WORKFLOW_HEAD_BRANCH}" \
                --json number --jq '.[].number' | tr '\n' ' ' || true)
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${DISPATCH_PR}" ]; then
              nums="${DISPATCH_PR}"
            else
              nums=$(gh -R "$GITHUB_REPOSITORY" pr list --base main --state open --limit 50 \
                --json number --jq '.[].number' | tr '\n' ' ' || true)
            fi
          fi
          echo "مرشّحون: ${nums:-∅}"
          echo "nums=${nums}" >> "$GITHUB_OUTPUT"
          echo "allow=${ALLOW}" >> "$GITHUB_OUTPUT"
          echo "exclude_dual=${EXCLUDE_DUAL}" >> "$GITHUB_OUTPUT"

      - name: Ready + Auto-merge (squash) لكل PR مؤهّل
        if: steps.targets.outputs.nums != ''
        env:
          ALLOW: ${{ steps.targets.outputs.allow }}
          EXCLUDE_DUAL: ${{ steps.targets.outputs.exclude_dual }}
          NUMS: ${{ steps.targets.outputs.nums }}
        continue-on-error: true
        run: |
          set -u
          REPO_FLAG=(-R "$GITHUB_REPOSITORY")
          for n in $NUMS; do
            echo "::group::PR #$n"
            if ! meta=$(gh "${REPO_FLAG[@]}" pr view "$n" --json number,state,isDraft,baseRefName,headRefName,isCrossRepository,mergeable,mergeStateStatus,url \
              --jq '{state,isDraft,base:.baseRefName,head:.headRefName,cross:.isCrossRepository,mergeable,mergeStateStatus,url}'); then
              echo "::warning::تعذّر قراءة PR #$n"
              echo "::endgroup::"
              continue
            fi
            echo "$meta"
            state=$(echo "$meta" | jq -r .state)
            base=$(echo "$meta" | jq -r .base)
            head=$(echo "$meta" | jq -r .head)
            cross=$(echo "$meta" | jq -r .cross)
            mergeable=$(echo "$meta" | jq -r .mergeable)
            draft=$(echo "$meta" | jq -r .isDraft)

            if [ "$state" != "OPEN" ] || [ "$base" != "main" ] || [ "$cross" = "true" ]; then
              echo "تخطي: غير مؤهّل"
              echo "::endgroup::"
              continue
            fi
            if ! echo "$head" | grep -Eq "$ALLOW"; then
              echo "تخطي: الفرع $head خارج الأنماط"
              echo "::endgroup::"
              continue
            fi
            if echo "$head" | grep -Eq "$EXCLUDE_DUAL"; then
              echo "تخطي: $head عبر release-majlisilm.yml"
              echo "::endgroup::"
              continue
            fi
            if [ "$mergeable" = "CONFLICTING" ]; then
              echo "::warning::تعارضات — يُعالَج عبر resolve-pr-conflicts.yml"
              echo "::endgroup::"
              continue
            fi
            if [ "$draft" = "true" ]; then
              echo "Draft → Ready…"
              gh "${REPO_FLAG[@]}" pr ready "$n" || echo "::warning::تعذّر undraft"
            fi
            echo "تفعيل Auto-merge (squash) + حذف الفرع…"
            if gh "${REPO_FLAG[@]}" pr merge "$n" --auto --squash --delete-branch; then
              echo "✓ Auto-merge مفعّل/تم لـ #$n"
              echo "::endgroup::"
              continue
            fi
            verify=$(gh "${REPO_FLAG[@]}" pr checks "$n" 2>&1 || true)
            echo "$verify"
            if ! echo "$verify" | grep -i 'Verify build' | grep -qiE 'pass|success'; then
              echo "::warning::Verify build لم ينجح — لا دمج مباشر"
              echo "::endgroup::"
              continue
            fi
            if echo "$verify" | grep -i 'Verify build' | grep -qiE 'fail|pending'; then
              echo "::warning::Verify build معلّق/فاشل"
              echo "::endgroup::"
              continue
            fi
            if gh "${REPO_FLAG[@]}" pr merge "$n" --squash --delete-branch; then
              echo "✓ دُمج مباشرة بعد نجاح الفحوصات"
            else
              echo "::warning::تعذّر دمج #$n"
            fi
            echo "::endgroup::"
          done
          exit 0
