name: Auto-ready and merge PRs to main

# Safe auto-merge (squash) — Auto-merge يبقى مفعّلًا.
# لا يحول Draft→Ready تلقائيًا.
# لا يدمج عند: CI فاشل/Pending، تعارض، Changes Requested، تغيّر head SHA،
# تغييرات iOS بلا xcodebuild أخضر، تغييرات SQL بلا postgres-integration أخضر.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "رقم PR محدد (فارغ = المؤهلة فقط)"
        required: false
        type: string

# Concurrency منفصل لكل PR؛ الدفعات المجدولة لا تلغي تشغيل PR محدد.
concurrency:
  group: >-
    auto-merge-${{
      github.event.pull_request.number
      || github.event.inputs.pr_number
      || (github.event_name == 'workflow_run' && format('wr-{0}', github.event.workflow_run.id))
      || 'schedule-batch'
    }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

# GITHUB_TOKEN يكفي لتفعيل --auto squash؛ لا نستخدم PAT واسعًا هنا.
# (release-majlisilm.yml ما زال يحتاج PROD_DEPLOY_TOKEN لإطلاق workflows بعد الدفع.)
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  cancel-on-ci-failure:
    if: github.repository == 'yalabdullmohsen/majalis' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable auto-merge on CI failure
        env:
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          nums=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${WORKFLOW_HEAD_SHA}/pulls" \
            --jq '[.[] | select(.base.ref=="main") | .number] | join(" ")' || true)
          if [ -z "${nums}" ]; then
            nums=$(gh -R "$GITHUB_REPOSITORY" pr list --base main --state open \
              --head "${GITHUB_REPOSITORY_OWNER}:${WORKFLOW_HEAD_BRANCH}" \
              --json number --jq '.[].number' | tr '\n' ' ' || true)
          fi
          for n in $nums; do
            gh -R "$GITHUB_REPOSITORY" pr merge "$n" --disable-auto || true
            gh -R "$GITHUB_REPOSITORY" pr comment "$n" --body "⛔ أُلغي Auto-merge لأن CI فشل." || true
          done

  auto-merge:
    if: github.repository == 'yalabdullmohsen/majalis' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (read-only metadata; no branch rewrite)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Select eligible PRs
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          ALLOW='^((cursor|session|claude|automation|fix|feature|security|docs|chore)/|majalis-content-fill$)'
          EXCLUDE_DUAL='^(automation/content|automation/tasks)$'
          nums=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ "$PR_BASE_REF" = "main" ] || { echo "nums=" >> "$GITHUB_OUTPUT"; exit 0; }
            [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ] || { echo "nums=" >> "$GITHUB_OUTPUT"; exit 0; }
            nums="$PR_NUMBER"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            nums=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${WORKFLOW_HEAD_SHA}/pulls" \
              --jq '[.[] | select(.base.ref=="main" and .head.repo.full_name=="'"${GITHUB_REPOSITORY}"'") | .number] | join(" ")' || true)
          else
            nums="${DISPATCH_PR:-}"
            if [ -z "$nums" ]; then
              nums=$(gh -R "$GITHUB_REPOSITORY" pr list --base main --state open --limit 30 \
                --json number,isDraft --jq '.[] | select(.isDraft==false) | .number' | tr '\n' ' ' || true)
            fi
          fi
          echo "nums=${nums}" >> "$GITHUB_OUTPUT"
          echo "allow=${ALLOW}" >> "$GITHUB_OUTPUT"
          echo "exclude_dual=${EXCLUDE_DUAL}" >> "$GITHUB_OUTPUT"

      - name: Enable squash auto-merge for eligible Ready PRs
        if: steps.targets.outputs.nums != ''
        env:
          ALLOW: ${{ steps.targets.outputs.allow }}
          EXCLUDE_DUAL: ${{ steps.targets.outputs.exclude_dual }}
          NUMS: ${{ steps.targets.outputs.nums }}
        run: |
          set -u
          REPO_FLAG=(-R "$GITHUB_REPOSITORY")

          check_line_status() {
            # gh pr checks is TSV: name\tstatus\tduration\turl\tdescription
            # Default awk FS splits on spaces, so "Verify build" never matches — use tab FS.
            local name_re="$1"
            echo "$CHECKS" | awk -F'\t' -v re="$name_re" 'BEGIN{IGNORECASE=1} $1 ~ re {print $2; found=1} END{if(!found) print "missing"}' | head -1
          }

          quality_ok() {
            local n="$1" files has_ios has_sql st
            CHECKS=$(gh "${REPO_FLAG[@]}" pr checks "$n" 2>&1 || true)
            echo "$CHECKS"

            # Verify build / quality must be success (not pending/fail)
            st=$(check_line_status '^(Verify build|quality)$')
            if [ "$st" = "fail" ] || [ "$st" = "pending" ] || [ "$st" = "cancel" ] || [ "$st" = "cancelled" ]; then
              echo "block: Verify build status=$st"
              return 1
            fi
            if [ "$st" != "pass" ] && [ "$st" != "success" ]; then
              echo "block: Verify build missing/not green ($st)"
              return 1
            fi

            files=$(gh "${REPO_FLAG[@]}" pr view "$n" --json files --jq '.files[].path' || true)
            has_ios=0
            has_sql=0
            if echo "$files" | grep -Eq '^artifacts/majalis/(ios/|capacitor\.config\.ts)'; then
              has_ios=1
            fi
            if echo "$files" | grep -Eqi '(^artifacts/majalis/supabase/|/migration|db-migrate|migration-runner|enterprise_reliability|qa_phase|\.sql$)'; then
              has_sql=1
            fi

            # postgres-integration: always required when check exists; mandatory on SQL paths
            st=$(check_line_status '^postgres-integration$')
            if [ "$has_sql" = "1" ]; then
              if [ "$st" != "pass" ] && [ "$st" != "success" ]; then
                echo "block: SQL paths require postgres-integration green (got $st)"
                return 1
              fi
            elif [ "$st" = "fail" ] || [ "$st" = "pending" ] || [ "$st" = "cancel" ] || [ "$st" = "cancelled" ]; then
              echo "block: postgres-integration not green ($st)"
              return 1
            fi

            if [ "$has_ios" = "1" ]; then
              st=$(check_line_status '^xcodebuild-simulator$')
              if [ "$st" != "pass" ] && [ "$st" != "success" ]; then
                echo "block: iOS paths require xcodebuild-simulator green (got $st)"
                return 1
              fi
            fi

            # preview-smoke: if reported, must not be fail/pending
            st=$(check_line_status '^preview-smoke$')
            if [ "$st" = "fail" ] || [ "$st" = "pending" ] || [ "$st" = "cancel" ] || [ "$st" = "cancelled" ]; then
              echo "block: preview-smoke not green ($st)"
              return 1
            fi

            # Any other fail/pending check blocks (status is column 2 with tab FS)
            if echo "$CHECKS" | awk -F'\t' 'BEGIN{IGNORECASE=1} $2 ~ /^(fail|pending|cancel|cancelled)$/ {print; bad=1} END{exit bad?0:1}'; then
              echo "block: non-green checks present"
              return 1
            fi
            return 0
          }

          for n in $NUMS; do
            echo "::group::PR #$n"
            meta=$(gh "${REPO_FLAG[@]}" pr view "$n" --json state,isDraft,baseRefName,headRefName,isCrossRepository,mergeable,mergeStateStatus,title,reviewDecision,headRefOid \
              --jq '{state,isDraft,base:.baseRefName,branch:.headRefName,cross:.isCrossRepository,mergeable,mergeStateStatus,title,reviewDecision,sha:.headRefOid}')
            state=$(echo "$meta" | jq -r .state)
            draft=$(echo "$meta" | jq -r .isDraft)
            base=$(echo "$meta" | jq -r .base)
            head=$(echo "$meta" | jq -r .branch)
            cross=$(echo "$meta" | jq -r .cross)
            mergeable=$(echo "$meta" | jq -r .mergeable)
            mstatus=$(echo "$meta" | jq -r .mergeStateStatus)
            title=$(echo "$meta" | jq -r .title)
            review=$(echo "$meta" | jq -r .reviewDecision)
            head_sha_before=$(echo "$meta" | jq -r .sha)

            if [ "$state" != "OPEN" ] || [ "$base" != "main" ] || [ "$cross" = "true" ]; then
              echo "skip: not eligible"; echo "::endgroup::"; continue
            fi
            if [ "$draft" = "true" ]; then
              echo "skip: Draft (never undraft)"; echo "::endgroup::"; continue
            fi
            if [ "$review" = "CHANGES_REQUESTED" ]; then
              echo "skip: changes requested"
              gh "${REPO_FLAG[@]}" pr merge "$n" --disable-auto || true
              echo "::endgroup::"; continue
            fi
            if ! echo "$head" | grep -Eq "$ALLOW"; then
              echo "skip: branch pattern"; echo "::endgroup::"; continue
            fi
            if echo "$head" | grep -Eq "$EXCLUDE_DUAL"; then
              echo "skip: dual automation"; echo "::endgroup::"; continue
            fi
            if echo "$title" | grep -Eqi 'NO-AUTO-MERGE|دون دمج|do-not-merge'; then
              echo "skip: title forbids auto-merge"
              gh "${REPO_FLAG[@]}" pr merge "$n" --disable-auto || true
              echo "::endgroup::"; continue
            fi

            # قطار الإصدار المجدول يملك دمج هذه الـPRs — لا تُفعَّل هنا.
            labels=$(gh "${REPO_FLAG[@]}" pr view "$n" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || true)
            if echo "$labels" | grep -Fqi 'release-train-ready'; then
              echo "skip: release-train-ready (owned by scheduled-release-train.yml)"
              gh "${REPO_FLAG[@]}" pr merge "$n" --disable-auto || true
              echo "::endgroup::"; continue
            fi

            # Auth / SQL / iOS / Cron → مراجعة بشرية إلزامية (لا auto-merge)
            files=$(gh "${REPO_FLAG[@]}" pr view "$n" --json files --jq '.files[].path' || true)
            if echo "$files" | grep -Eqi '(^|/)(supabase/|migrations?/)|\\.sql$|\\.migration-backup/|db-migrate|migration-runner|enterprise_reliability|qa_phase'; then
              echo "skip: SQL/migration paths require human review"
              gh "${REPO_FLAG[@]}" pr merge "$n" --disable-auto || true
              gh "${REPO_FLAG[@]}" pr comment "$n" --body "🛑 Auto-merge متوقف: تغييرات SQL/migrations تحتاج مراجعة بشرية." || true
              echo "::endgroup::"; continue
            fi
            if echo "$files" | grep -Eqi '(^|/)ios/|\\.swift$|capacitor\\.config\\.(ts|json)$|Info\\.plist$'; then
              echo "skip: iOS/Capacitor paths require human review"
              gh "${REPO_FLAG[@]}" pr merge "$n" --disable-auto || true
              gh "${REPO_FLAG[@]}" pr comment "$n" --body "🛑 Auto-merge متوقف: تغييرات iOS/Capacitor تحتاج مراجعة بشرية." || true
              echo "::endgroup::"; continue
            fi
            if echo "$files" | grep -Eqi 'auth-redirect|AuthContext|LoginPage|RegisterPage|(^|/)auth/|api-handlers/cron/|cron-enqueue|vercel\\.json$'; then
              echo "skip: Auth/Cron paths require human review"
              gh "${REPO_FLAG[@]}" pr merge "$n" --disable-auto || true
              gh "${REPO_FLAG[@]}" pr comment "$n" --body "🛑 Auto-merge متوقف: تغييرات Auth/Cron تحتاج مراجعة بشرية." || true
              echo "::endgroup::"; continue
            fi

            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "skip: mergeable=$mergeable (require MERGEABLE)"
              gh "${REPO_FLAG[@]}" pr merge "$n" --disable-auto || true
              echo "::endgroup::"; continue
            fi
            if [ "$mstatus" = "CONFLICTING" ] || [ "$mstatus" = "DIRTY" ]; then
              echo "skip: conflicting"
              gh "${REPO_FLAG[@]}" pr merge "$n" --disable-auto || true
              echo "::endgroup::"; continue
            fi
            if [ "$mstatus" = "BEHIND" ]; then
              echo "skip: behind main — update required (no force-merge)"
              echo "::endgroup::"; continue
            fi

            if ! quality_ok "$n"; then
              echo "skip: required checks not green"
              gh "${REPO_FLAG[@]}" pr merge "$n" --disable-auto || true
              echo "::endgroup::"; continue
            fi

            head_sha_after=$(gh "${REPO_FLAG[@]}" pr view "$n" --json headRefOid --jq .headRefOid)
            if [ "$head_sha_before" != "$head_sha_after" ]; then
              echo "skip: head SHA changed during checks ($head_sha_before -> $head_sha_after)"
              gh "${REPO_FLAG[@]}" pr merge "$n" --disable-auto || true
              echo "::endgroup::"; continue
            fi

            echo "enable auto-merge squash for #$n (head=$head_sha_after)"
            gh "${REPO_FLAG[@]}" pr merge "$n" --auto --squash --delete-branch || true
            echo "::endgroup::"
          done
