name: Resolve PR conflicts from main

# معطّل (2026-08-05): checkout بـ PROD_DEPLOY_TOKEN يفشل بـ
#   fatal: could not read Username for 'https://github.com': terminal prompts disabled
# حتى مع persist-credentials وGITHUB_TOKEN كاحتياطي — غالبًا لأن السر الباطل
# يُفضَّل على GITHUB_TOKEN. الضوضاء الحمراء كانت تُبقي mergeStateStatus=UNSTABLE.
# التحديث من main عند الحاجة يبقى يدويًا أو عبر workflow_dispatch بعد إصلاح PAT.
# لإعادة التفعيل: احذف if: false وأصلِح PROD_DEPLOY_TOKEN أو اقتصر على GITHUB_TOKEN.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "رقم PR محدد (فارغ = كل المتعارضة/المتأخرة عن main)"
        required: false
        type: string
  pull_request:
    types: [synchronize, opened, reopened]
    branches: [main]

concurrency:
  group: resolve-conflicts-${{ github.event.pull_request.number || github.event.inputs.pr_number || 'batch' }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  # GITHUB_TOKEN فقط — لا تستخدم PAT باطل هنا
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  resolve:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: معطّل
        run: echo "Resolve PR conflicts معطّل حتى يُصلَح PROD_DEPLOY_TOKEN"
