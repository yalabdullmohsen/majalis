name: PR Safe Auto-Merge Report

# تقرير تلقائي على كل PR يوضح الأهلية للدمج التلقائي الآمن.
# لا يدمج ولا يفعّل auto-merge — ذلك في auto-merge-to-main.yml فقط.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
        type: string

concurrency:
  group: safe-merge-report-pr-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  report:
    if: github.repository == 'yalabdullmohsen/majalis'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Ensure policy labels exist
        continue-on-error: true
        run: node .github/scripts/safe-auto-merge/cli.mjs ensure-labels

      - name: Post / update eligibility report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          node .github/scripts/safe-auto-merge/cli.mjs report --pr "$PR_NUMBER" --post
