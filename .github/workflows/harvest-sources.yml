name: Harvest sources

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: artifacts/majalis

      - name: Dry-run harvest gate
        working-directory: artifacts/majalis
        env:
          INSTAGRAM_INGEST_MODE: oembed
        run: pnpm run harvest:dry

      - name: Test harvest gates
        working-directory: artifacts/majalis
        run: pnpm run test:harvest

      - name: Resolve Instagram ingest mode
        id: ig
        env:
          INSTAGRAM_PROVIDER_KEY: ${{ secrets.INSTAGRAM_PROVIDER_KEY }}
          INSTAGRAM_PROVIDER_ENDPOINT: ${{ secrets.INSTAGRAM_PROVIDER_ENDPOINT }}
        run: |
          if [ -n "$INSTAGRAM_PROVIDER_KEY" ] && [ -n "$INSTAGRAM_PROVIDER_ENDPOINT" ]; then
            echo "mode=provider" >> "$GITHUB_OUTPUT"
            echo "Instagram: provider (secrets present)"
          else
            echo "mode=oembed" >> "$GITHUB_OUTPUT"
            echo "Instagram: oembed (no provider secrets — will skip empty inbox)"
          fi

      - name: Run harvest (live)
        working-directory: artifacts/majalis
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INSTAGRAM_INGEST_MODE: ${{ steps.ig.outputs.mode }}
          INSTAGRAM_PROVIDER_KEY: ${{ secrets.INSTAGRAM_PROVIDER_KEY }}
          INSTAGRAM_PROVIDER_ENDPOINT: ${{ secrets.INSTAGRAM_PROVIDER_ENDPOINT }}
        run: pnpm run harvest

      - name: Check for content changes
        id: diff
        run: |
          REPORT="artifacts/majalis/public/data/sources/harvest-report.json"
          CONTENT_CHANGED=false
          if [ -f "$REPORT" ]; then
            CONTENT_CHANGED=$(node -e "const r=require('./$REPORT'); process.stdout.write(String(r.content_changed===true))")
          fi

          # احتياط: أي تغيير على feed يُعد محتوى
          if ! git diff --quiet -- artifacts/majalis/public/data/lessons/feed.json 2>/dev/null; then
            CONTENT_CHANGED=true
          fi

          if [ "$CONTENT_CHANGED" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Content change detected (new posts / last_seen)"
          else
            # unchanged بالكامل أو تقرير فقط — لا PR محتوى
            git checkout -- artifacts/majalis/public/data 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All Instagram unchanged or report-only — skip PR"
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/harvest-${{ github.run_id }}
          title: "chore(harvest): تحديث feed المصادر"
          labels: safe:content
          commit-message: "chore(harvest): تحديث feed المصادر"
          body: |
            تشغيلة حصاد تلقائية — تحديث `feed.json` و/أو `accounts.json` (تتبع last_seen) تحت `public/data`.
            لا تُفتح PR عند تقرير فقط أو عندما تكون كل حسابات Instagram unchanged.
          add-paths: |
            artifacts/majalis/public/data/**
