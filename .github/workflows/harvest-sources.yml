name: Harvest sources

on:
  schedule:
    # مرتان يومياً بتوقيت الكويت ≈ 06:00 و18:00 (03:00 و15:00 UTC)
    - cron: "0 3,15 * * *"
  workflow_dispatch:

concurrency:
  group: harvest-sources
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: artifacts/majalis
        run: pnpm install --frozen-lockfile

      - name: Dry-run harvest gate
        working-directory: artifacts/majalis
        env:
          INSTAGRAM_INGEST_MODE: oembed
        run: pnpm run harvest:dry

      - name: Test harvest gates
        working-directory: artifacts/majalis
        run: pnpm run test:harvest

      - name: Resolve Instagram ingest mode
        id: ig
        env:
          INSTAGRAM_PROVIDER_KEY: ${{ secrets.INSTAGRAM_PROVIDER_KEY }}
          INSTAGRAM_PROVIDER_ENDPOINT: ${{ secrets.INSTAGRAM_PROVIDER_ENDPOINT }}
        run: |
          set -euo pipefail
          # لا تطبع القيم — تحقق شكل فقط
          if [ -z "${INSTAGRAM_PROVIDER_KEY:-}" ] || [ -z "${INSTAGRAM_PROVIDER_ENDPOINT:-}" ]; then
            echo "mode=oembed" >> "$GITHUB_OUTPUT"
            echo "Instagram: oembed (secrets missing)"
            exit 0
          fi
          # رفض curl/أوامر؛ قبول URL Bright Data فقط
          case "$INSTAGRAM_PROVIDER_ENDPOINT" in
            curl\ *|*\ -H\ *|*\ -X\ *)
              echo "mode=oembed" >> "$GITHUB_OUTPUT"
              echo "Instagram: endpoint looks like curl — refusing (use https://api.brightdata.com/... only)"
              exit 0
              ;;
          esac
          if [[ "$INSTAGRAM_PROVIDER_ENDPOINT" != https://api.brightdata.com/* ]]; then
            echo "mode=oembed" >> "$GITHUB_OUTPUT"
            echo "Instagram: endpoint host not api.brightdata.com — refusing provider mode"
            exit 0
          fi
          # يُعاد بناء scrape لـ Posts discover_by=url داخل المحوّل؛ هنا تحقق الشكل فقط
          echo "mode=provider" >> "$GITHUB_OUTPUT"
          echo "Instagram: provider (Bright Data secrets present, shape OK — posts discover_by=url)"

      - name: Run harvest (probe latest only — twice daily)
        working-directory: artifacts/majalis
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INSTAGRAM_INGEST_MODE: ${{ steps.ig.outputs.mode }}
          INSTAGRAM_PROVIDER_KEY: ${{ secrets.INSTAGRAM_PROVIDER_KEY }}
          INSTAGRAM_PROVIDER_ENDPOINT: ${{ secrets.INSTAGRAM_PROVIDER_ENDPOINT }}
          HARVEST_LOOKBACK_DAYS: "7"
          INSTAGRAM_BACKFILL_ENABLED: "false"
        run: pnpm run harvest -- --days=7

      - name: Check for content changes
        id: diff
        run: |
          REPORT="artifacts/majalis/public/data/sources/harvest-report.json"
          CONTENT_CHANGED=false
          if [ -f "$REPORT" ]; then
            CONTENT_CHANGED=$(node -e "const r=require('./$REPORT'); process.stdout.write(String(r.content_changed===true))")
          fi

          if ! git diff --quiet -- artifacts/majalis/public/data/lessons/feed.json 2>/dev/null; then
            CONTENT_CHANGED=true
          fi

          if [ "$CONTENT_CHANGED" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Content change detected (new posts / last_seen)"
          else
            git checkout -- artifacts/majalis/public/data 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All Instagram unchanged or report-only — skip PR"
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # PROD_DEPLOY_TOKEN يطلق CI على PR الجديد؛ GITHUB_TOKEN وحده لا يفعل (GitHub policy).
          token: ${{ secrets.PROD_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/harvest-${{ github.run_id }}
          title: "chore(harvest): تحديث feed المصادر"
          labels: safe:content
          commit-message: "chore(harvest): تحديث feed المصادر"
          body: |
            تشغيلة حصاد تلقائية (مرتين يومياً — فحص آخر منشور فقط لكل حساب Instagram).
            تُفتح PR فقط عند منشور جديد أو تغيير feed حقيقي.
          add-paths: |
            artifacts/majalis/public/data/**
