name: Supabase Migrations

# Applies migrations under artifacts/majalis/supabase/migrations via Supabase CLI.
# Safety: actual `db push` requires repository variable ALLOW_SUPABASE_AUTO_MIGRATE=true
# OR workflow_dispatch with apply=true. Otherwise validates CLI + lists pending migrations only.

on:
  push:
    branches: [main]
    paths:
      - "artifacts/majalis/supabase/migrations/**"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply migrations with supabase db push"
        required: true
        type: boolean
        default: false

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: supabase-db-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: latest

      - name: Resolve migrations directory
        id: paths
        run: |
          set -euo pipefail
          if [ -d artifacts/majalis/supabase ]; then
            echo "workdir=artifacts/majalis" >> "$GITHUB_OUTPUT"
          elif [ -d supabase ]; then
            echo "workdir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supabase directory found"
            exit 1
          fi

      - name: Link project
        working-directory: ${{ steps.paths.outputs.workdir }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID secrets are required"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: List migration status
        working-directory: ${{ steps.paths.outputs.workdir }}
        run: |
          set -euo pipefail
          supabase migration list || true
          ls -la supabase/migrations | head -50

      - name: Decide apply
        id: gate
        env:
          DISPATCH_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
          ALLOW_VAR: ${{ vars.ALLOW_SUPABASE_AUTO_MIGRATE }}
        run: |
          set -euo pipefail
          apply=false
          if [ "${DISPATCH_APPLY}" = "true" ]; then
            apply=true
          elif [ "${ALLOW_VAR}" = "true" ] && [ "${{ github.event_name }}" = "push" ]; then
            apply=true
          fi
          echo "apply=${apply}" >> "$GITHUB_OUTPUT"
          echo "Apply migrations: ${apply}"

      - name: supabase db push
        if: steps.gate.outputs.apply == 'true'
        working-directory: ${{ steps.paths.outputs.workdir }}
        run: |
          set -euo pipefail
          supabase db push --include-all

      - name: Skip note
        if: steps.gate.outputs.apply != 'true'
        run: |
          echo "::notice::Migrations were NOT applied. Set workflow_dispatch apply=true or repository variable ALLOW_SUPABASE_AUTO_MIGRATE=true."
