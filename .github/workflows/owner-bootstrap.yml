name: Owner Bootstrap

# Manual only — never promote owners or apply owner SQL on push to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote-owner:
    runs-on: ubuntu-latest
    if: github.repository == 'yalabdullmohsen/majalis'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Apply owner SQL migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::database credentials required for Owner Bootstrap"
            exit 1
          fi
          cd artifacts/majalis
          pnpm run apply:owner-bootstrap

      - name: Promote bootstrap owners via service role
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY not configured"
            exit 1
          fi
          cd artifacts/majalis
          pnpm run promote:owner

      - name: Trigger owner bootstrap cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is required"
            exit 1
          fi
          curl -sf -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.majlisilm.com/api/cron/bootstrap-owner"
