name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security / reliability static gates
        run: |
          pnpm verify:no-unsafe-auto-merge
          pnpm verify:no-runtime-ddl
          pnpm verify:single-response
          pnpm db:migration:verify
      - name: Content guard
        run: pnpm --filter @workspace/majalis run test:content-guard
      - name: Typecheck
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/majalis run typecheck
      - name: Lint
        run: pnpm -r --if-present run lint
      - name: P0 reliability
        run: pnpm --filter @workspace/majalis run test:p0-reliability
      - name: Build
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/majalis run build
      - name: Content import + autonomous checks
        run: |
          cd artifacts/majalis
          pnpm run test:content-import
          pnpm run test:content-import-e2e
          pnpm run verify:autonomous-platform
          pnpm run verify:majlis-knowledge-engine
          pnpm run verify:import-jobs-integrity
      - name: Verify deploy output
        run: pnpm --filter @workspace/majalis run verify:deploy

  migration-check:
    name: migration-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: majalis_test
          POSTGRES_PASSWORD: majalis_test
          POSTGRES_DB: majalis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fresh + upgrade migration
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://majalis_test:majalis_test@127.0.0.1:5432/majalis_test
        run: |
          pnpm db:migration:test:fresh
          pnpm db:migration:test:upgrade

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: majalis_test
          POSTGRES_PASSWORD: majalis_test
          POSTGRES_DB: majalis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Queue concurrency integration
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://majalis_test:majalis_test@127.0.0.1:5432/majalis_test
          REQUIRE_POSTGRES_INTEGRATION: "1"
        run: pnpm test:postgres-integration
