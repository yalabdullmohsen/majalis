name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Governance / auto-merge safety gate
        run: node scripts/verify-no-unsafe-auto-merge.mjs

      - name: Typecheck (project references via tsc -b)
        run: |
          pnpm exec tsc -b --clean
          pnpm exec tsc -b
          pnpm -r --filter "./artifacts/**" --filter "./scripts" --filter "!@workspace/api-server" --if-present run typecheck

      - name: Lint (zero warnings)
        run: pnpm --filter @workspace/majalis exec eslint src lib --max-warnings=0

      - name: Generated artifacts --check
        run: |
          pnpm --filter @workspace/majalis exec tsx scripts/generate-content-counts.ts --check
          pnpm --filter @workspace/majalis exec node scripts/generate-quran-pages-manifest.mjs --check

      - name: Full package test
        run: pnpm --filter @workspace/majalis run test

      - name: Build
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/majalis run build

      - name: Build must not dirty git
        run: git diff --exit-code

      - name: Deploy output verify
        run: pnpm --filter @workspace/majalis run verify:deploy
