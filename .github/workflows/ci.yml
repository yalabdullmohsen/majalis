name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

# إلغاء لنفس الـPR/المرجع فقط عند commit أحدث — لا تلغِ PR آخر ولا main بسبب PR.
# merge_group: كل دفعة merge queue تكمل (group فريد بـ run_id).
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'merge_group' && github.run_id
      || github.event.pull_request.number
      || github.ref
    }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  actions: write

# Pin trusted action SHAs (tag comments for humans).
# content-audit-fill re-trigger: ensure CI schedules on latest head

env:
  PORT: "24216"
  BASE_PATH: "/"
  # مسار PR السريع: صفحات مرجعية فقط على مقاس واحد 390×844.
  # المسح الكامل ٦٠٤ × ٤ مقاسات في mushaf-gates-nightly.yml.
  PR_MUSHAF_PAGES: "1,2,3,4,283,600"

jobs:
  # ---------------------------------------------------------------------------
  # ١) تصنيف المسارات + بصمة المصدر (مفتاح الكاش المركّب)
  # ---------------------------------------------------------------------------
  classify:
    name: classify-path-lane
    runs-on: ubuntu-latest
    # fetch الكامل قد يتجاوز 5 دقائق على مستودع كبير — لا تُلغَ التصنيف قبل اكتمال checkout
    timeout-minutes: 20
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      lane_reason: ${{ steps.lane.outputs.lane_reason }}
      need_build: ${{ steps.lane.outputs.need_build }}
      need_fast_lane: ${{ steps.lane.outputs.need_fast_lane }}
      need_mushaf: ${{ steps.lane.outputs.need_mushaf }}
      need_postgres: ${{ steps.lane.outputs.need_postgres }}
      need_native: ${{ steps.lane.outputs.need_native }}
      need_visual: ${{ steps.lane.outputs.need_visual }}
      need_color_contrast: ${{ steps.lane.outputs.need_color_contrast }}
      need_preview_smoke: ${{ steps.lane.outputs.need_preview_smoke }}
      need_policy_tests: ${{ steps.lane.outputs.need_policy_tests }}
      manual_review: ${{ steps.lane.outputs.manual_review }}
      src_fingerprint: ${{ steps.fp.outputs.fingerprint }}
      # Canonical source identity = SHA of the tree actually checked out (never mix PR head + merge).
      source_sha: ${{ steps.identity.outputs.source_sha }}
      head_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # تسريع الجلب: بدون blobs غير مستخدمة في تصنيف المسارات
          filter: blob:none

      - name: Canonical source identity (checkout HEAD)
        id: identity
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test -n "$SOURCE_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "canonical source_sha=$SOURCE_SHA event=${{ github.event_name }} github.sha=${{ github.sha }} pr.head=${{ github.event.pull_request.head.sha || '' }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Classify changed paths
        id: lane
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            # RC / release/*: مسار كامل إلزاميًا (لا تخطّي mushaf على PRs التجميد)
            case "${{ github.head_ref }}" in
              release/*)
                export CI_FORCE_FULL=1
                node .github/scripts/ci/emit-path-lane.mjs --full --base "$BASE" --head "$HEAD"
                ;;
              *)
                node .github/scripts/ci/emit-path-lane.mjs --base "$BASE" --head "$HEAD"
                ;;
            esac
            node scripts/ci/changed-scope.mjs --base "$BASE" --head "$HEAD"
          else
            # push to main / merge_group → full suite (no dangerous skip)
            node .github/scripts/ci/emit-path-lane.mjs --full
            echo "scopes=full" >> "$GITHUB_OUTPUT"
            echo "scope_need_data_audit=true" >> "$GITHUB_OUTPUT"
          fi

      # مفتاح الكاش المركّب: hash(lockfile) + hash(src) + hash(public/data) +
      # hash(scripts/config). إن لم يتغيّر المصدر تُعاد نتيجة البناء من الكاش
      # بلا تشغيل أي بوابة من جديد. لا يشمل dist/cache/logs.
      - name: Compute source fingerprint
        id: fp
        run: |
          set -euo pipefail
          FP="${{ hashFiles('pnpm-lock.yaml', 'artifacts/majalis/package.json', 'artifacts/majalis/vite.config.ts', 'artifacts/majalis/tsconfig*.json', 'artifacts/majalis/src/**', 'artifacts/majalis/lib/**', 'artifacts/majalis/public/**', 'artifacts/majalis/index.html', 'artifacts/majalis/scripts/**') }}"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "بصمة المصدر: $FP"

  # ---------------------------------------------------------------------------
  # ٢) بوابة الحكامة السريعة (بلا بناء)
  # ---------------------------------------------------------------------------
  fast-lane:
    name: fast-lane
    needs: [classify]
    if: needs.classify.outputs.need_fast_lane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      - name: Governance / auto-merge safety gate
        run: pnpm run verify:no-unsafe-auto-merge

      - name: Safe auto-merge policy unit tests
        if: needs.classify.outputs.need_policy_tests == 'true'
        run: pnpm run test:safe-auto-merge

      - name: Release Train unit tests (policy-adjacent)
        if: needs.classify.outputs.need_policy_tests == 'true'
        run: pnpm run test:release-train

  # ---------------------------------------------------------------------------
  # ٣) فحوص ثابتة — تتوازى مع البناء ولا تحجزه
  #    (كانت داخل build فتؤخّر كل بوابات المصحف بلا سبب)
  # ---------------------------------------------------------------------------
  static-checks:
    name: static-checks
    needs: [classify]
    if: needs.classify.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      # تزايدي: كان `tsc -b --clean && tsc -b` يهدم الكاش في كل تشغيل.
      # إن وُجد tsbuildinfo بلا dist (كاش قديم قبل تضمين المخرجات) أعد البناء قسرًا.
      - name: tsc -b (incremental)
        run: |
          set -euo pipefail
          if [ ! -f lib/api-zod/dist/index.d.ts ] || [ ! -f lib/db/dist/index.d.ts ]; then
            echo "composite dist missing — tsc -b --force"
            pnpm exec tsc -b --force
          else
            pnpm exec tsc -b
          fi

      - name: typecheck (workspace)
        run: pnpm run typecheck

      - name: Lint (zero warnings)
        run: pnpm --filter @workspace/majalis exec eslint src lib --max-warnings=0

      - name: Generated artifacts --check
        run: |
          pnpm --filter @workspace/majalis exec node --import tsx scripts/generate-content-counts.ts --check
          pnpm --filter @workspace/majalis exec node scripts/generate-quran-pages-manifest.mjs --check
          pnpm --filter @workspace/majalis exec node scripts/generate-seo-nav-labels.mjs --check

  # ---------------------------------------------------------------------------
  # ٤) البناء — الوظيفة الوحيدة المسموح لها بالبناء في كل الـworkflow.
  #    ترفع dist كـartifact؛ كل بوابة أخرى تنزّله ولا تبني.
  # ---------------------------------------------------------------------------
  build:
    name: build
    needs: [classify]
    if: needs.classify.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      # كاش نتيجة البناء بمفتاح بصمة المصدر: إعادة تشغيل، rebase بلا تغيير
      # مصدر، أو دفعة merge queue لنفس الشجرة ← لا بناء إطلاقًا.
      - name: Restore dist by source fingerprint
        id: dist-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: artifacts/majalis/dist
          key: dist-${{ runner.os }}-${{ needs.classify.outputs.src_fingerprint }}

      - name: Build (تخطّي عند إصابة الكاش)
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @workspace/majalis run build

      # version.json يحمل الـcommit — يُعاد بصمه دائمًا حتى مع dist من الكاش
      # وإلا نشرنا/فحصنا sha قديمًا. رخيص (~1ث) ويحفظ صحة فحص الإصدار.
      - name: Re-stamp version.json for this commit
        working-directory: artifacts/majalis
        run: node scripts/generate-version.mjs

      - name: Stamp dist artifact identity (build-once contract)
        run: |
          set -euo pipefail
          node .github/scripts/ci/dist-artifact-identity.mjs write \
            --dist artifacts/majalis/dist \
            --source-sha "${{ needs.classify.outputs.source_sha }}" \
            --source-fingerprint "${{ needs.classify.outputs.src_fingerprint }}" \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --producer-job build

      - name: Upload majalis dist (المصدر الوحيد لكل البوابات)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: majalis-dist
          path: artifacts/majalis/dist
          # ci-artifact.json غير مخفي؛ الإبقاء على true دفاعًا لأي ختم legacy مخفي.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Bundle budget / no mega-seeds in entry
        run: pnpm --filter @workspace/majalis run test:bundle-budget

      - name: git diff --exit-code (build must not dirty tree)
        run: git diff --exit-code

      - name: Deploy output verify
        run: pnpm --filter @workspace/majalis run verify:deploy


  # ---------------------------------------------------------------------------
  # ٥) بوابات المستودع (وحدات + SQL + سياسات) — تتوازى مع البناء
  # ---------------------------------------------------------------------------
  repo-gates:
    name: repo-gates
    needs: [classify]
    if: needs.classify.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      - name: Governance / auto-merge safety gate
        run: pnpm run verify:no-unsafe-auto-merge

      - name: ECC / agent bundles must stay untracked
        run: pnpm run verify:no-tracked-ecc-bundles

      - name: Release Train + safe auto-merge unit tests
        run: |
          pnpm run test:release-train
          pnpm run test:safe-auto-merge

      - name: Head / PageShell / body-meta / orphan / autofocus / methodology / related
        run: |
          pnpm --filter @workspace/majalis run verify:head-shell-gate
          pnpm --filter @workspace/majalis run verify:pageshell-gate
          pnpm --filter @workspace/majalis run verify:body-meta-gate
          pnpm --filter @workspace/majalis run verify:orphan-discovery
          pnpm --filter @workspace/majalis run verify:no-autofocus
          pnpm --filter @workspace/majalis run verify:methodology-prerender
          pnpm --filter @workspace/majalis run verify:related-dedupe
          pnpm --filter @workspace/majalis run test:navigation-intent
          pnpm --filter @workspace/majalis run verify:content-affinity

      - name: Cron single-response gate
        run: pnpm run verify:single-response

      - name: Unit / package tests (بدون بوابات مصحف Playwright)
        run: pnpm --filter @workspace/majalis run test:ci-unit


      - name: Verify no runtime DDL
        run: pnpm verify:no-runtime-ddl

      - name: Platform hardening SQL static gate
        run: pnpm run verify:platform-hardening-sql

      - name: Schema drift expectations
        run: node scripts/verify-schema-drift-expectations.mjs

      - name: DB migration verify (static + live when URL set)
        env:
          MIGRATION_TEST_DATABASE_URL: ${{ secrets.MIGRATION_TEST_DATABASE_URL }}
        run: pnpm run db:migration:verify

      - name: Ops backlog report (read-only counts)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm run ops:backlog-report

      - name: api-server typecheck/build (required when package present)
        run: |
          set -euo pipefail
          if [ -d artifacts/api-server ]; then
            if [ ! -f lib/api-zod/dist/index.d.ts ]; then
              pnpm exec tsc -b lib/api-zod --force
            fi
            pnpm --filter @workspace/api-server run typecheck
            pnpm --filter @workspace/api-server run build
          else
            echo "api-server package absent — skip"
          fi

  # ---------------------------------------------------------------------------
  # ٦) قياس المصحف — PR: ٦ صفحات مرجعية × مقاس واحد على ٤ shards
  #    main/nightly: ٦٠٤ صفحة على ٨ shards
  # ---------------------------------------------------------------------------
  mushaf-measure:
    name: mushaf-measure
    needs: [classify, build]
    if: |
      always() &&
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.need_mushaf == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        # release/* PRs تأخذ المسار الكامل (8 shards) مثل main — لا تخطّي قياس المصحف في RC
        shard: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')) && fromJSON('[1,2,3,4,5,6,7,8]') || fromJSON('[1,2,3,4]') }}
    env:
      MUSHAF_GATE_FULL: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')) && '1' || '0' }}
      MUSHAF_GATE_PAGES: ${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')) && '1,2,3,4,283,600' || '' }}
      MUSHAF_GATE_VIEWPORT: ${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')) && '390x844' || '' }}
      MUSHAF_GATE_SHARD: ${{ matrix.shard }}
      MUSHAF_GATE_SHARDS: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')) && '8' || '4' }}
      MUSHAF_GATE_USE_PREVIEW: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Download majalis dist (بلا إعادة بناء)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: majalis-dist
          path: artifacts/majalis/dist

      - name: Single-pass measure
        working-directory: artifacts/majalis
        env:
          MUSHAF_SINGLE_PASS_OUT: artifacts/mushaf-single-pass/measurements-shard-${{ matrix.shard }}.json
        run: pnpm run test:mushaf-single-pass:measure

      - name: Upload measurements shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mushaf-measurements-${{ matrix.shard }}
          path: |
            artifacts/majalis/artifacts/mushaf-single-pass/measurements-shard-${{ matrix.shard }}.json
            artifacts/majalis/artifacts/mushaf-single-pass/screenshots/
          retention-days: 1
          if-no-files-found: warn


  mushaf-gates:
    name: mushaf-gates
    needs: [classify, build, mushaf-measure]
    if: |
      always() &&
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.need_mushaf == 'true' &&
      needs.build.result == 'success' &&
      needs.mushaf-measure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Download majalis dist (بلا إعادة بناء)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: majalis-dist
          path: artifacts/majalis/dist

      - name: Download measurement shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mushaf-measurements-*
          path: /tmp/mushaf-measurements
          merge-multiple: true

      - name: Assert all gates on single-pass JSON
        env:
          MUSHAF_SINGLE_PASS_IN_DIR: /tmp/mushaf-measurements
        run: pnpm --filter @workspace/majalis run test:mushaf-single-pass:assert

      - name: Start preview (وحدات Playwright المتبقية)
        working-directory: artifacts/majalis
        run: |
          set -euo pipefail
          pnpm exec vite preview --config vite.config.ts --host 127.0.0.1 --port 24216 > /tmp/mushaf-vite.log 2>&1 &
          echo $! > /tmp/mushaf-vite.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:24216/"; then
              echo "preview جاهز"
              exit 0
            fi
            sleep 1
          done
          echo "preview لم يبدأ"; tail -50 /tmp/mushaf-vite.log; exit 1

      - name: Unit + active-page-lines + flip-perf
        env:
          MUSHAF_GATE_BASE_URL: http://127.0.0.1:24216
        run: |
          pnpm --filter @workspace/majalis run test:mushaf-gates:unit
          pnpm --filter @workspace/majalis run test:mushaf-active-page-lines
          pnpm --filter @workspace/majalis run test:mushaf-flip-perf

      - name: Stop preview
        if: always()
        run: kill "$(cat /tmp/mushaf-vite.pid)" 2>/dev/null || true


  layout-bands:
    name: layout-bands
    needs: [classify, mushaf-measure]
    if: |
      always() &&
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.need_mushaf == 'true' &&
      needs.mushaf-measure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      - name: Download measurement shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mushaf-measurements-*
          path: /tmp/mushaf-measurements
          merge-multiple: true

      - name: Layout bands من JSON التمريرة الواحدة (نفس الصرامة، بلا إعادة رسم)
        env:
          MUSHAF_SINGLE_PASS_IN_DIR: /tmp/mushaf-measurements
        run: pnpm --filter @workspace/majalis run test:mushaf-single-pass:assert


  # لقطات بصرية — واجهة/مصحف/risky فقط.
  # Path-lane: تُتخطّى بالكامل عند need_visual=false (المجمّع يقبل skipped).
  visual-snapshot:
    name: visual-snapshot
    needs: [classify, build]
    if: >-
      always() && !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.need_visual == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Download majalis dist (بلا إعادة بناء)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: majalis-dist
          path: artifacts/majalis/dist

      - name: Assert dist artifact matches this source
        run: |
          set -euo pipefail
          # Same-run reuse: stamped attempt may be older than github.run_attempt when
          # `rerun --failed` skips a successful build producer (see isCompatibleWorkflowRunAttempt).
          node .github/scripts/ci/dist-artifact-identity.mjs assert \
            --dist artifacts/majalis/dist \
            --source-sha "${{ needs.classify.outputs.source_sha }}" \
            --source-fingerprint "${{ needs.classify.outputs.src_fingerprint }}" \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --producer-job build

      - name: UI layout gates (calendar + lessons above-fold)
        run: pnpm --filter @workspace/majalis run test:ui-layout-gates

      - name: Start preview
        working-directory: artifacts/majalis
        run: |
          set -euo pipefail
          pnpm exec vite preview --config vite.config.ts --host 127.0.0.1 --port 24216 > /tmp/mushaf-vite.log 2>&1 &
          echo $! > /tmp/mushaf-vite.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:24216/"; then
              echo "preview جاهز"
              exit 0
            fi
            sleep 1
          done
          echo "preview لم يبدأ"; tail -50 /tmp/mushaf-vite.log; exit 1

      - name: Visual snapshot gates (عيّنة قابلة لإعادة الإنتاج)
        id: snapshot
        env:
          MUSHAF_GATE_BASE_URL: http://127.0.0.1:24216
        run: pnpm --filter @workspace/majalis run test:visual

      - name: visual-snapshot must not skip when required
        if: always() && !cancelled()
        env:
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
        run: |
          set -euo pipefail
          if [ "$SNAPSHOT_OUTCOME" != "success" ]; then
            echo "visual-snapshot outcome=$SNAPSHOT_OUTCOME (failure = fail)"
            exit 1
          fi

      - name: Stop preview
        if: always()
        run: kill "$(cat /tmp/mushaf-vite.pid)" 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # ٧) تباين الألوان — ينزّل dist ولا يبني
  # Path-lane: تُتخطّى عند need_color=false (المجمّع يقبل skipped).
  # ---------------------------------------------------------------------------
  color-contrast:
    name: Color contrast (Playwright)
    needs: [classify, build]
    if: >-
      always() && !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.need_color_contrast == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Download majalis dist (بلا إعادة بناء)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: majalis-dist
          path: artifacts/majalis/dist

      - name: Assert dist artifact matches this source
        run: |
          set -euo pipefail
          # Same-run reuse: stamped attempt may be older than github.run_attempt when
          # `rerun --failed` skips a successful build producer (see isCompatibleWorkflowRunAttempt).
          node .github/scripts/ci/dist-artifact-identity.mjs assert \
            --dist artifacts/majalis/dist \
            --source-sha "${{ needs.classify.outputs.source_sha }}" \
            --source-fingerprint "${{ needs.classify.outputs.src_fingerprint }}" \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --producer-job build

      - name: Color contrast gate
        id: contrast
        run: pnpm --filter @workspace/majalis run test:color-contrast-gate

      - name: On-brand contrast gate (لا أسود على الأخضر)
        id: onbrand
        if: always() && !cancelled()
        run: pnpm --filter @workspace/majalis run test:on-brand-contrast

      - name: Contrast gates must not skip when required
        if: always() && !cancelled()
        env:
          CONTRAST_OUTCOME: ${{ steps.contrast.outcome }}
          ONBRAND_OUTCOME: ${{ steps.onbrand.outcome }}
        run: |
          set -euo pipefail
          if [ "$CONTRAST_OUTCOME" != "success" ]; then
            echo "Color contrast gate outcome=$CONTRAST_OUTCOME (failure = fail)"
            exit 1
          fi
          if [ "$ONBRAND_OUTCOME" != "success" ]; then
            echo "On-brand contrast gate outcome=$ONBRAND_OUTCOME (failure = fail)"
            exit 1
          fi

      - name: Upload contrast failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: color-contrast-failures
          path: artifacts/majalis/test-results/contrast-gate/
          if-no-files-found: ignore
          retention-days: 14

  # بوابة انحدار Lighthouse على بناء الإنتاج (dist).
  # Path-lane: تُتخطّى عند need_visual=false.
  lhci-home:
    name: LHCI home (mobile)
    needs: [classify, build]
    if: >-
      always() && !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.need_visual == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Download majalis dist (بلا إعادة بناء)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: majalis-dist
          path: artifacts/majalis/dist

      - name: Assert dist artifact matches this source
        run: |
          set -euo pipefail
          # Same-run reuse: stamped attempt may be older than github.run_attempt when
          # `rerun --failed` skips a successful build producer (see isCompatibleWorkflowRunAttempt).
          node .github/scripts/ci/dist-artifact-identity.mjs assert \
            --dist artifacts/majalis/dist \
            --source-sha "${{ needs.classify.outputs.source_sha }}" \
            --source-fingerprint "${{ needs.classify.outputs.src_fingerprint }}" \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --producer-job build

      - name: Start preview
        working-directory: artifacts/majalis
        run: |
          set -euo pipefail
          pnpm exec vite preview --config vite.config.ts --host 127.0.0.1 --port 24216 > /tmp/lhci-vite.log 2>&1 &
          echo $! > /tmp/lhci-vite.pid
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null "http://127.0.0.1:24216/" \
              && curl -sf -o /dev/null "http://127.0.0.1:24216/version.json"; then
              body="$(curl -sf "http://127.0.0.1:24216/" | head -c 800 || true)"
              if printf '%s' "$body" | grep -Eqi '<div id="root"|<div id="app"|ssunnah|سُنّة|majalis'; then
                echo "preview جاهز ومستقر (محاولة $i)"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "preview لم يصبح جاهزًا"; tail -80 /tmp/lhci-vite.log; exit 1

      - name: LHCI home mobile (3 runs, regression thresholds)
        id: lhci
        working-directory: artifacts/majalis
        env:
          LHCI_URL: http://127.0.0.1:24216/
        run: |
          set -euo pipefail
          export CHROME_PATH
          CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          test -x "$CHROME_PATH"
          set +e
          out="$(pnpm run lighthouse:ci 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            if printf '%s' "$out" | grep -Eqi 'FAILED_DOCUMENT_REQUEST|Unable to load|net::ERR_|Chrome did not launch|No such file|ECONNREFUSED|Navigation timeout|Page crashed'; then
              echo "LHCI page-load failure — retry once after preview re-check"
              for i in $(seq 1 30); do
                curl -sf -o /dev/null "http://127.0.0.1:24216/" && break
                sleep 1
              done
              sleep 2
              pnpm run lighthouse:ci
              code=$?
            fi
          fi
          set -e
          exit "$code"

      - name: Upload LHCI reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lhci-home-reports
          path: artifacts/majalis/lhci-reports
          retention-days: 14
          if-no-files-found: warn

      - name: LHCI must not skip when required
        if: always() && !cancelled()
        env:
          LHCI_OUTCOME: ${{ steps.lhci.outcome }}
        run: |
          set -euo pipefail
          if [ "$LHCI_OUTCOME" != "success" ]; then
            echo "LHCI home outcome=$LHCI_OUTCOME (failure = fail)"
            exit 1
          fi

      - name: Stop preview
        if: always()
        run: kill "$(cat /tmp/lhci-vite.pid)" 2>/dev/null || true

  postgres-integration:
    name: postgres-integration
    needs: [classify]
    if: needs.classify.outputs.need_postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: majalis_test
          POSTGRES_PASSWORD: majalis_test
          POSTGRES_DB: majalis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U majalis_test -d majalis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      - name: Queue integration (REQUIRED)
        env:
          REQUIRE_POSTGRES_INTEGRATION: "1"
          MIGRATION_TEST_DATABASE_URL: postgresql://majalis_test:majalis_test@localhost:5432/majalis_test
          DATABASE_URL: postgresql://majalis_test:majalis_test@localhost:5432/majalis_test
          NODE_ENV: test
        run: pnpm run test:postgres-integration

      - name: Migration verify + upgrade idempotency
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://majalis_test:majalis_test@localhost:5432/majalis_test
        run: |
          pnpm run db:migration:verify
          pnpm run db:migration:verify:upgrade

  # ---------------------------------------------------------------------------
  # ٨) البوابة المطلوبة الوحيدة لحماية الفرع — الاسم "Verify build" ثابت.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify build
    needs:
      - classify
      - fast-lane
      - static-checks
      - build
      - repo-gates
      - mushaf-measure
      - mushaf-gates
      - layout-bands
      - visual-snapshot
      - color-contrast
      - lhci-home
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate required jobs (path-lane aware)
        env:
          LANE: ${{ needs.classify.outputs.lane }}
          NEED_BUILD: ${{ needs.classify.outputs.need_build }}
          NEED_FAST: ${{ needs.classify.outputs.need_fast_lane }}
          NEED_MUSHAF: ${{ needs.classify.outputs.need_mushaf }}
          NEED_VISUAL: ${{ needs.classify.outputs.need_visual }}
          NEED_COLOR: ${{ needs.classify.outputs.need_color_contrast }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FAST_RESULT: ${{ needs.fast-lane.result }}
          STATIC_RESULT: ${{ needs.static-checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          REPO_GATES_RESULT: ${{ needs.repo-gates.result }}
          MEASURE_RESULT: ${{ needs.mushaf-measure.result }}
          GATES_RESULT: ${{ needs.mushaf-gates.result }}
          BANDS_RESULT: ${{ needs.layout-bands.result }}
          VISUAL_RESULT: ${{ needs.visual-snapshot.result }}
          COLOR_RESULT: ${{ needs.color-contrast.result }}
          LHCI_RESULT: ${{ needs.lhci-home.result }}
        run: |
          set -euo pipefail
          {
            echo "## CI path-lane / results"
            echo "| Job | Required | Result | Reason |"
            echo "|-----|----------|--------|--------|"
            echo "| lane | — | \`$LANE\` | path-lane |"
            echo "| classify | true | $CLASSIFY_RESULT | always |"
            echo "| fast-lane | $NEED_FAST | $FAST_RESULT | need_fast_lane |"
            echo "| static-checks | $NEED_BUILD | $STATIC_RESULT | need_build |"
            echo "| build | $NEED_BUILD | $BUILD_RESULT | need_build |"
            echo "| repo-gates | $NEED_BUILD | $REPO_GATES_RESULT | need_build |"
            echo "| mushaf-measure | $NEED_MUSHAF | $MEASURE_RESULT | need_mushaf |"
            echo "| mushaf-gates | $NEED_MUSHAF | $GATES_RESULT | need_mushaf |"
            echo "| layout-bands | $NEED_MUSHAF | $BANDS_RESULT | need_mushaf |"
            echo "| visual-snapshot | $NEED_VISUAL | $VISUAL_RESULT | need_visual |"
            echo "| color-contrast | $NEED_COLOR | $COLOR_RESULT | need_color |"
            echo "| lhci-home | $NEED_VISUAL | $LHCI_RESULT | need_visual |"
            echo ""
            echo "بناء واحد فقط (وظيفة \`build\`) — كل البوابات تنزّل dist."
            echo "مسار PR: ٦ صفحات مرجعية × 390×844 على ٤ shards. الكامل ليلاً."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "classify failed: $CLASSIFY_RESULT"
            exit 1
          fi

          check_req() {
            local name="$1" need="$2" result="$3"
            if [ "$need" = "true" ]; then
              if [ "$result" = "success" ]; then
                echo "OK required $name=$result"
                return 0
              fi
              BLOCKERS+=("$name=$result")
              if [ "$result" = "cancelled" ]; then
                echo "required job '$name' cancelled — غالبًا استبدال بنفس الـPR أو إلغاء التشغيل؛ ليس نجاحًا"
                return 1
              fi
              echo "required job '$name' not success: $result"
              return 1
            else
              if [ "$result" = "failure" ]; then
                echo "optional job '$name' failed unexpectedly: $result"
                BLOCKERS+=("$name=$result(optional)")
                return 1
              fi
              # skipped / cancelled / success مسموح عندما need=false (path-lane حيادي)
              echo "OK optional $name=$result (path-lane skip/neutral allowed when not required)"
              return 0
            fi
          }

          # دفاع: لا تُلزم تباين/لقطات بلا مسار بناء — يحوّل التناقض إلى حيادي لا فشل زائف
          EFFECTIVE_NEED_COLOR="$NEED_COLOR"
          EFFECTIVE_NEED_VISUAL="$NEED_VISUAL"
          if [ "$NEED_COLOR" = "true" ] && [ "$NEED_BUILD" != "true" ]; then
            echo "WARN: need_color without need_build — treating color as optional (path-lane consistency)"
            EFFECTIVE_NEED_COLOR="false"
          fi
          if [ "$NEED_VISUAL" = "true" ] && [ "$NEED_BUILD" != "true" ]; then
            echo "WARN: need_visual without need_build — treating visual/lhci as optional"
            EFFECTIVE_NEED_VISUAL="false"
          fi

          BLOCKERS=()
          FAIL=0
          check_req "fast-lane" "$NEED_FAST" "$FAST_RESULT" || FAIL=1
          check_req "static-checks" "$NEED_BUILD" "$STATIC_RESULT" || FAIL=1
          check_req "build" "$NEED_BUILD" "$BUILD_RESULT" || FAIL=1
          check_req "repo-gates" "$NEED_BUILD" "$REPO_GATES_RESULT" || FAIL=1
          check_req "mushaf-measure" "$NEED_MUSHAF" "$MEASURE_RESULT" || FAIL=1
          check_req "mushaf-gates" "$NEED_MUSHAF" "$GATES_RESULT" || FAIL=1
          check_req "layout-bands" "$NEED_MUSHAF" "$BANDS_RESULT" || FAIL=1
          check_req "visual-snapshot" "$EFFECTIVE_NEED_VISUAL" "$VISUAL_RESULT" || FAIL=1
          check_req "color-contrast" "$EFFECTIVE_NEED_COLOR" "$COLOR_RESULT" || FAIL=1
          check_req "lhci-home" "$EFFECTIVE_NEED_VISUAL" "$LHCI_RESULT" || FAIL=1

          if [ "$FAIL" -ne 0 ]; then
            if [ "${#BLOCKERS[@]}" -eq 1 ] && [[ "${BLOCKERS[0]}" == color-contrast=* ]]; then
              echo "Blocked by Color contrast only"
              echo "### Root cause" >> "$GITHUB_STEP_SUMMARY"
              echo "**Blocked by Color contrast only** (\`${BLOCKERS[0]}\`)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Blocked by: ${BLOCKERS[*]}"
              echo "### Root cause" >> "$GITHUB_STEP_SUMMARY"
              echo "Blocked by: \`${BLOCKERS[*]}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          echo "Verify build OK (lane=$LANE)"

  # ---------------------------------------------------------------------------
  # ٩) المجمّع المطلوب لحماية الفرع.
  #    Path-lane: الوظائف الاختيارية تنجح حياديًا (لا skipped) أو تُقبل skipped
  #    عندما need=false. المطلوب فعليًا يجب أن يكون success.
  # ---------------------------------------------------------------------------
  ci-required:
    name: ci-required
    needs:
      - classify
      - verify
      - color-contrast
      - visual-snapshot
      - lhci-home
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Required gates — path-lane aware
        env:
          NEED_BUILD: ${{ needs.classify.outputs.need_build }}
          NEED_VISUAL: ${{ needs.classify.outputs.need_visual }}
          NEED_COLOR: ${{ needs.classify.outputs.need_color_contrast }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          COLOR_RESULT: ${{ needs.color-contrast.result }}
          VISUAL_RESULT: ${{ needs.visual-snapshot.result }}
          LHCI_RESULT: ${{ needs.lhci-home.result }}
        run: |
          set -euo pipefail
          {
            echo "## ci-required"
            echo "| Job | Result | Required when |"
            echo "|-----|--------|----------------|"
            echo "| classify | $CLASSIFY_RESULT | always |"
            echo "| Verify build | $VERIFY_RESULT | always |"
            echo "| color-contrast | $COLOR_RESULT | need_color=$NEED_COLOR |"
            echo "| visual-snapshot | $VISUAL_RESULT | need_visual=$NEED_VISUAL |"
            echo "| lhci-home | $LHCI_RESULT | need_visual=$NEED_VISUAL |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "classify not success: $CLASSIFY_RESULT"
            exit 1
          fi

          EFFECTIVE_NEED_COLOR="$NEED_COLOR"
          EFFECTIVE_NEED_VISUAL="$NEED_VISUAL"
          if [ "$NEED_COLOR" = "true" ] && [ "$NEED_BUILD" != "true" ]; then
            EFFECTIVE_NEED_COLOR="false"
          fi
          if [ "$NEED_VISUAL" = "true" ] && [ "$NEED_BUILD" != "true" ]; then
            EFFECTIVE_NEED_VISUAL="false"
          fi

          BLOCKERS=()
          if [ "$VERIFY_RESULT" != "success" ]; then
            # انسب السبب الحقيقي من نتائج الوظائف التابعة — لا تُبلّغ فشلًا مبهمًا
            if [ "$EFFECTIVE_NEED_COLOR" = "true" ] && [ "$COLOR_RESULT" != "success" ] \
              && { [ "$EFFECTIVE_NEED_VISUAL" != "true" ] || { [ "$VISUAL_RESULT" = "success" ] && [ "$LHCI_RESULT" = "success" ]; }; }; then
              echo "Blocked by Color contrast only (Verify build failed because color-contrast=$COLOR_RESULT)"
              echo "### Root cause" >> "$GITHUB_STEP_SUMMARY"
              echo "**Blocked by Color contrast only**" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ "$EFFECTIVE_NEED_VISUAL" = "true" ] && [ "$LHCI_RESULT" != "success" ] \
              && [ "$COLOR_RESULT" = "success" ] && [ "$VISUAL_RESULT" = "success" ]; then
              echo "Blocked by LHCI home (mobile) only (Verify build failed because lhci-home=$LHCI_RESULT)"
              echo "### Root cause" >> "$GITHUB_STEP_SUMMARY"
              echo "**Blocked by LHCI home (mobile)** (\`lhci-home=$LHCI_RESULT\`)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Verify build not success: $VERIFY_RESULT (classify deps: color=$COLOR_RESULT visual=$VISUAL_RESULT lhci=$LHCI_RESULT)"
            echo "### Root cause" >> "$GITHUB_STEP_SUMMARY"
            echo "Verify build=\`$VERIFY_RESULT\` · color=\`$COLOR_RESULT\` · visual=\`$VISUAL_RESULT\` · lhci=\`$LHCI_RESULT\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          check_req() {
            local name="$1" need="$2" result="$3"
            if [ "$need" = "true" ]; then
              if [ "$result" = "success" ]; then
                echo "OK required $name=$result"
                return 0
              fi
              BLOCKERS+=("$name=$result")
              echo "required job '$name' not success: $result"
              return 1
            fi
            if [ "$result" = "failure" ]; then
              BLOCKERS+=("$name=$result(optional)")
              echo "optional job '$name' failed unexpectedly: $result"
              return 1
            fi
            echo "OK optional $name=$result (path-lane skip/neutral OK)"
            return 0
          }

          FAIL=0
          check_req "color-contrast" "$EFFECTIVE_NEED_COLOR" "$COLOR_RESULT" || FAIL=1
          check_req "visual-snapshot" "$EFFECTIVE_NEED_VISUAL" "$VISUAL_RESULT" || FAIL=1
          check_req "lhci-home" "$EFFECTIVE_NEED_VISUAL" "$LHCI_RESULT" || FAIL=1

          if [ "$FAIL" -ne 0 ]; then
            if [ "${#BLOCKERS[@]}" -eq 1 ] && [[ "${BLOCKERS[0]}" == color-contrast=* ]]; then
              echo "Blocked by Color contrast only"
              echo "### Root cause" >> "$GITHUB_STEP_SUMMARY"
              echo "**Blocked by Color contrast only**" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Blocked by: ${BLOCKERS[*]}"
            fi
            exit 1
          fi
          echo "ci-required OK"