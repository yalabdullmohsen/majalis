name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

# إلغاء التشغيلات المتجاوَزة لنفس المرجع — مُعطَّل على PRs لتجنب «خضرة/حمرة كاذبة».
# merge_group لا يُلغى — كل دفعة merge queue يجب أن تكمل.
concurrency:
  group: ci-${{ github.event_name == 'merge_group' && github.run_id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

# Pin trusted action SHAs (tag comments for humans).

env:
  PORT: "24216"
  BASE_PATH: "/"
  # مسار PR السريع: صفحات مرجعية فقط على مقاس واحد 390×844.
  # المسح الكامل ٦٠٤ × ٤ مقاسات في mushaf-gates-nightly.yml.
  PR_MUSHAF_PAGES: "1,2,3,4,283,600"

jobs:
  # ---------------------------------------------------------------------------
  # ١) تصنيف المسارات + بصمة المصدر (مفتاح الكاش المركّب)
  # ---------------------------------------------------------------------------
  classify:
    name: classify-path-lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      need_build: ${{ steps.lane.outputs.need_build }}
      need_fast_lane: ${{ steps.lane.outputs.need_fast_lane }}
      need_mushaf: ${{ steps.lane.outputs.need_mushaf }}
      need_postgres: ${{ steps.lane.outputs.need_postgres }}
      need_color_contrast: ${{ steps.lane.outputs.need_color_contrast }}
      need_preview_smoke: ${{ steps.lane.outputs.need_preview_smoke }}
      need_policy_tests: ${{ steps.lane.outputs.need_policy_tests }}
      manual_review: ${{ steps.lane.outputs.manual_review }}
      src_fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Classify changed paths
        id: lane
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            node .github/scripts/ci/emit-path-lane.mjs --base "$BASE" --head "$HEAD"
            node scripts/ci/changed-scope.mjs --base "$BASE" --head "$HEAD"
          else
            # push to main / merge_group → full suite (no dangerous skip)
            node .github/scripts/ci/emit-path-lane.mjs --full
            echo "scopes=full" >> "$GITHUB_OUTPUT"
            echo "scope_need_data_audit=true" >> "$GITHUB_OUTPUT"
          fi

      # مفتاح الكاش المركّب: hash(lockfile) + hash(src) + hash(public/data) +
      # hash(scripts/config). إن لم يتغيّر المصدر تُعاد نتيجة البناء من الكاش
      # بلا تشغيل أي بوابة من جديد.
      - name: Compute source fingerprint
        id: fp
        run: |
          set -euo pipefail
          FP="${{ hashFiles('pnpm-lock.yaml', 'artifacts/majalis/package.json', 'artifacts/majalis/vite.config.ts', 'artifacts/majalis/tsconfig*.json', 'artifacts/majalis/src/**', 'artifacts/majalis/lib/**', 'artifacts/majalis/public/**', 'artifacts/majalis/index.html', 'artifacts/majalis/scripts/**') }}"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "بصمة المصدر: $FP"

  # ---------------------------------------------------------------------------
  # ٢) بوابة الحكامة السريعة (بلا بناء)
  # ---------------------------------------------------------------------------
  fast-lane:
    name: fast-lane
    needs: [classify]
    if: needs.classify.outputs.need_fast_lane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      - name: Governance / auto-merge safety gate
        run: pnpm run verify:no-unsafe-auto-merge

      - name: Safe auto-merge policy unit tests
        if: needs.classify.outputs.need_policy_tests == 'true'
        run: pnpm run test:safe-auto-merge

      - name: Release Train unit tests (policy-adjacent)
        if: needs.classify.outputs.need_policy_tests == 'true'
        run: pnpm run test:release-train

  # ---------------------------------------------------------------------------
  # ٣) فحوص ثابتة — تتوازى مع البناء ولا تحجزه
  #    (كانت داخل build فتؤخّر كل بوابات المصحف بلا سبب)
  # ---------------------------------------------------------------------------
  static-checks:
    name: static-checks
    needs: [classify]
    if: needs.classify.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      # تزايدي: كان `tsc -b --clean && tsc -b` يهدم الكاش في كل تشغيل.
      # إن وُجد tsbuildinfo بلا dist (كاش قديم قبل تضمين المخرجات) أعد البناء قسرًا.
      - name: tsc -b (incremental)
        run: |
          set -euo pipefail
          if [ ! -f lib/api-zod/dist/index.d.ts ] || [ ! -f lib/db/dist/index.d.ts ]; then
            echo "composite dist missing — tsc -b --force"
            pnpm exec tsc -b --force
          else
            pnpm exec tsc -b
          fi

      - name: typecheck (workspace)
        run: pnpm run typecheck

      - name: Lint (zero warnings)
        run: pnpm --filter @workspace/majalis exec eslint src lib --max-warnings=0

      - name: Generated artifacts --check
        run: |
          pnpm --filter @workspace/majalis exec node --import tsx scripts/generate-content-counts.ts --check
          pnpm --filter @workspace/majalis exec node scripts/generate-quran-pages-manifest.mjs --check

  # ---------------------------------------------------------------------------
  # ٤) البناء — الوظيفة الوحيدة المسموح لها بالبناء في كل الـworkflow.
  #    ترفع dist كـartifact؛ كل بوابة أخرى تنزّله ولا تبني.
  # ---------------------------------------------------------------------------
  build:
    name: build
    needs: [classify]
    if: needs.classify.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      # كاش نتيجة البناء بمفتاح بصمة المصدر: إعادة تشغيل، rebase بلا تغيير
      # مصدر، أو دفعة merge queue لنفس الشجرة ← لا بناء إطلاقًا.
      - name: Restore dist by source fingerprint
        id: dist-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: artifacts/majalis/dist
          key: dist-${{ runner.os }}-${{ needs.classify.outputs.src_fingerprint }}

      - name: Build (تخطّي عند إصابة الكاش)
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @workspace/majalis run build

      # version.json يحمل الـcommit — يُعاد بصمه دائمًا حتى مع dist من الكاش
      # وإلا نشرنا/فحصنا sha قديمًا. رخيص (~1ث) ويحفظ صحة فحص الإصدار.
      - name: Re-stamp version.json for this commit
        working-directory: artifacts/majalis
        run: node scripts/generate-version.mjs

      - name: Upload majalis dist (المصدر الوحيد لكل البوابات)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: majalis-dist
          path: artifacts/majalis/dist
          retention-days: 1
          if-no-files-found: error

      - name: Bundle budget / no mega-seeds in entry
        run: pnpm --filter @workspace/majalis run test:bundle-budget

      - name: git diff --exit-code (build must not dirty tree)
        run: git diff --exit-code

      - name: Deploy output verify
        run: pnpm --filter @workspace/majalis run verify:deploy

      - name: fail-fast — إلغاء بقية الوظائف عند فشل حقيقي
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" || true

  # ---------------------------------------------------------------------------
  # ٥) بوابات المستودع (وحدات + SQL + سياسات) — تتوازى مع البناء
  # ---------------------------------------------------------------------------
  repo-gates:
    name: repo-gates
    needs: [classify]
    if: needs.classify.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      - name: Governance / auto-merge safety gate
        run: pnpm run verify:no-unsafe-auto-merge

      - name: Release Train + safe auto-merge unit tests
        run: |
          pnpm run test:release-train
          pnpm run test:safe-auto-merge

      - name: Head / PageShell / body-meta / orphan / autofocus / methodology / related
        run: |
          pnpm --filter @workspace/majalis run verify:head-shell-gate
          pnpm --filter @workspace/majalis run verify:pageshell-gate
          pnpm --filter @workspace/majalis run verify:body-meta-gate
          pnpm --filter @workspace/majalis run verify:orphan-discovery
          pnpm --filter @workspace/majalis run verify:no-autofocus
          pnpm --filter @workspace/majalis run verify:methodology-prerender
          pnpm --filter @workspace/majalis run verify:related-dedupe
          pnpm --filter @workspace/majalis run test:navigation-intent
          pnpm --filter @workspace/majalis run verify:content-affinity

      - name: Cron single-response gate
        run: pnpm run verify:single-response

      - name: Unit / package tests (بدون بوابات مصحف Playwright)
        run: pnpm --filter @workspace/majalis run test:ci-unit

      - name: fail-fast — إلغاء بقية الوظائف عند فشل repo-gates
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" || true

      - name: Verify no runtime DDL
        run: pnpm verify:no-runtime-ddl

      - name: Platform hardening SQL static gate
        run: pnpm run verify:platform-hardening-sql

      - name: Schema drift expectations
        run: node scripts/verify-schema-drift-expectations.mjs

      - name: DB migration verify (static + live when URL set)
        env:
          MIGRATION_TEST_DATABASE_URL: ${{ secrets.MIGRATION_TEST_DATABASE_URL }}
        run: pnpm run db:migration:verify

      - name: Ops backlog report (read-only counts)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm run ops:backlog-report

      - name: api-server typecheck/build (required when package present)
        run: |
          set -euo pipefail
          if [ -d artifacts/api-server ]; then
            if [ ! -f lib/api-zod/dist/index.d.ts ]; then
              pnpm exec tsc -b lib/api-zod --force
            fi
            pnpm --filter @workspace/api-server run typecheck
            pnpm --filter @workspace/api-server run build
          else
            echo "api-server package absent — skip"
          fi

  # ---------------------------------------------------------------------------
  # ٦) قياس المصحف — PR: ٦ صفحات مرجعية × مقاس واحد على ٤ shards
  #    main/nightly: ٦٠٤ صفحة على ٨ shards
  # ---------------------------------------------------------------------------
  mushaf-measure:
    name: mushaf-measure
    needs: [classify, build]
    if: |
      always() &&
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.need_mushaf == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ github.event_name == 'pull_request' && fromJSON('[1,2,3,4]') || fromJSON('[1,2,3,4,5,6,7,8]') }}
    env:
      MUSHAF_GATE_FULL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      MUSHAF_GATE_PAGES: ${{ github.event_name == 'pull_request' && '1,2,3,4,283,600' || '' }}
      MUSHAF_GATE_VIEWPORT: ${{ github.event_name == 'pull_request' && '390x844' || '' }}
      MUSHAF_GATE_SHARD: ${{ matrix.shard }}
      MUSHAF_GATE_SHARDS: ${{ github.event_name == 'pull_request' && '4' || '8' }}
      MUSHAF_GATE_USE_PREVIEW: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Download majalis dist (بلا إعادة بناء)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: majalis-dist
          path: artifacts/majalis/dist

      - name: Single-pass measure
        working-directory: artifacts/majalis
        env:
          MUSHAF_SINGLE_PASS_OUT: artifacts/mushaf-single-pass/measurements-shard-${{ matrix.shard }}.json
        run: pnpm run test:mushaf-single-pass:measure

      - name: Upload measurements shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mushaf-measurements-${{ matrix.shard }}
          path: artifacts/majalis/artifacts/mushaf-single-pass/measurements-shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

      - name: fail-fast — إلغاء بقية الوظائف عند فشل حقيقي
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" || true

  mushaf-gates:
    name: mushaf-gates
    needs: [classify, build, mushaf-measure]
    if: |
      always() &&
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.need_mushaf == 'true' &&
      needs.build.result == 'success' &&
      needs.mushaf-measure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Download majalis dist (بلا إعادة بناء)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: majalis-dist
          path: artifacts/majalis/dist

      - name: Download measurement shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mushaf-measurements-*
          path: /tmp/mushaf-measurements
          merge-multiple: true

      - name: Assert all gates on single-pass JSON
        env:
          MUSHAF_SINGLE_PASS_IN_DIR: /tmp/mushaf-measurements
        run: pnpm --filter @workspace/majalis run test:mushaf-single-pass:assert

      - name: Start preview (وحدات Playwright المتبقية)
        working-directory: artifacts/majalis
        run: |
          set -euo pipefail
          pnpm exec vite preview --config vite.config.ts --host 127.0.0.1 --port 24216 > /tmp/mushaf-vite.log 2>&1 &
          echo $! > /tmp/mushaf-vite.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:24216/"; then
              echo "preview جاهز"
              exit 0
            fi
            sleep 1
          done
          echo "preview لم يبدأ"; tail -50 /tmp/mushaf-vite.log; exit 1

      - name: Unit + active-page-lines + flip-perf
        env:
          MUSHAF_GATE_BASE_URL: http://127.0.0.1:24216
        run: |
          pnpm --filter @workspace/majalis run test:mushaf-gates:unit
          pnpm --filter @workspace/majalis run test:mushaf-active-page-lines
          pnpm --filter @workspace/majalis run test:mushaf-flip-perf

      # المرجع الحقيقي لـ«صفر سطر مقتطع» — Chromium حقيقي على الـpreview
      # نفسه أعلاه، لا اعتماد على scrollWidth (لا يُسجَّل overflow تحت
      # overflow:clip). راجع feat/mushaf-round-2 وتعليق الرأس في
      # line-integrity-gate.mjs لتفصيل العطل الذي أفلت من test:mushaf-gates:unit.
      - name: Line integrity (604 صفحة — اقتطاع بصري حقيقي)
        env:
          MUSHAF_GATE_BASE_URL: http://127.0.0.1:24216
        run: pnpm --filter @workspace/majalis run test:mushaf-line-integrity

      - name: Stop preview
        if: always()
        run: kill "$(cat /tmp/mushaf-vite.pid)" 2>/dev/null || true

      - name: fail-fast — إلغاء بقية الوظائف عند فشل حقيقي
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" || true

  layout-bands:
    name: layout-bands
    needs: [classify, mushaf-measure]
    if: |
      always() &&
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.need_mushaf == 'true' &&
      needs.mushaf-measure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      - name: Download measurement shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mushaf-measurements-*
          path: /tmp/mushaf-measurements
          merge-multiple: true

      - name: Layout bands من JSON التمريرة الواحدة (نفس الصرامة، بلا إعادة رسم)
        env:
          MUSHAF_SINGLE_PASS_IN_DIR: /tmp/mushaf-measurements
        run: pnpm --filter @workspace/majalis run test:mushaf-single-pass:assert

      - name: fail-fast — إلغاء بقية الوظائف عند فشل حقيقي
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" || true

  # لقطات بصرية — مع كل بناء ناجح (لا تُتخطّى لأن المصحف لم يُلمس)
  visual-snapshot:
    name: visual-snapshot
    needs: [classify, build]
    if: |
      always() &&
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Download majalis dist (بلا إعادة بناء)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: majalis-dist
          path: artifacts/majalis/dist

      - name: UI layout gates (calendar + lessons above-fold)
        run: pnpm --filter @workspace/majalis run test:ui-layout-gates

      - name: Start preview
        working-directory: artifacts/majalis
        run: |
          set -euo pipefail
          pnpm exec vite preview --config vite.config.ts --host 127.0.0.1 --port 24216 > /tmp/mushaf-vite.log 2>&1 &
          echo $! > /tmp/mushaf-vite.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:24216/"; then
              echo "preview جاهز"
              exit 0
            fi
            sleep 1
          done
          echo "preview لم يبدأ"; tail -50 /tmp/mushaf-vite.log; exit 1

      - name: Visual snapshot gates (عيّنة قابلة لإعادة الإنتاج)
        id: snapshot
        env:
          MUSHAF_GATE_BASE_URL: http://127.0.0.1:24216
        run: pnpm --filter @workspace/majalis run test:visual

      - name: visual-snapshot must not skip
        if: always() && !cancelled()
        env:
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
        run: |
          set -euo pipefail
          if [ "$SNAPSHOT_OUTCOME" != "success" ]; then
            echo "visual-snapshot outcome=$SNAPSHOT_OUTCOME (Skipped/failure = fail)"
            exit 1
          fi

      - name: Stop preview
        if: always()
        run: kill "$(cat /tmp/mushaf-vite.pid)" 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # ٧) تباين الألوان — ينزّل dist ولا يبني (كان يعيد البناء كاملًا)
  # ---------------------------------------------------------------------------
  color-contrast:
    name: Color contrast (Playwright)
    needs: [classify, build]
    if: |
      always() &&
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Download majalis dist (بلا إعادة بناء)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: majalis-dist
          path: artifacts/majalis/dist

      - name: Color contrast gate
        id: contrast
        run: pnpm --filter @workspace/majalis run test:color-contrast-gate

      - name: On-brand contrast gate (لا أسود على الأخضر)
        id: onbrand
        if: always() && !cancelled()
        run: pnpm --filter @workspace/majalis run test:on-brand-contrast

      - name: Contrast gates must not skip
        if: always() && !cancelled()
        env:
          CONTRAST_OUTCOME: ${{ steps.contrast.outcome }}
          ONBRAND_OUTCOME: ${{ steps.onbrand.outcome }}
        run: |
          set -euo pipefail
          if [ "$CONTRAST_OUTCOME" != "success" ]; then
            echo "Color contrast gate outcome=$CONTRAST_OUTCOME (Skipped/failure = fail)"
            exit 1
          fi
          if [ "$ONBRAND_OUTCOME" != "success" ]; then
            echo "On-brand contrast gate outcome=$ONBRAND_OUTCOME (Skipped/failure = fail)"
            exit 1
          fi

  # بوابة انحدار Lighthouse على بناء الإنتاج (dist) — عتبات واقعية لا حلم 100.
  # إلزامية مع كل بناء: Verify build وci-required ينتظرانها.
  lhci-home:
    name: LHCI home (mobile)
    needs: [classify, build]
    if: |
      always() &&
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Download majalis dist (بلا إعادة بناء)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: majalis-dist
          path: artifacts/majalis/dist

      - name: Start preview
        working-directory: artifacts/majalis
        run: |
          set -euo pipefail
          pnpm exec vite preview --config vite.config.ts --host 127.0.0.1 --port 24216 > /tmp/lhci-vite.log 2>&1 &
          echo $! > /tmp/lhci-vite.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:24216/"; then
              echo "preview جاهز"
              exit 0
            fi
            sleep 1
          done
          echo "preview لم يبدأ"; tail -50 /tmp/lhci-vite.log; exit 1

      - name: LHCI home mobile (3 runs, regression thresholds)
        id: lhci
        working-directory: artifacts/majalis
        env:
          LHCI_URL: http://127.0.0.1:24216/
        run: |
          set -euo pipefail
          export CHROME_PATH
          CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          test -x "$CHROME_PATH"
          pnpm run lighthouse:ci

      - name: Upload LHCI reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lhci-home-reports
          path: artifacts/majalis/lhci-reports
          retention-days: 14
          if-no-files-found: warn

      - name: LHCI must not skip
        if: always() && !cancelled()
        env:
          LHCI_OUTCOME: ${{ steps.lhci.outcome }}
        run: |
          set -euo pipefail
          if [ "$LHCI_OUTCOME" != "success" ]; then
            echo "LHCI home outcome=$LHCI_OUTCOME (Skipped/failure = fail)"
            exit 1
          fi

      - name: Stop preview
        if: always()
        run: kill "$(cat /tmp/lhci-vite.pid)" 2>/dev/null || true

  postgres-integration:
    name: postgres-integration
    needs: [classify]
    if: needs.classify.outputs.need_postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: majalis_test
          POSTGRES_PASSWORD: majalis_test
          POSTGRES_DB: majalis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U majalis_test -d majalis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-workspace

      - name: Queue integration (REQUIRED)
        env:
          REQUIRE_POSTGRES_INTEGRATION: "1"
          MIGRATION_TEST_DATABASE_URL: postgresql://majalis_test:majalis_test@localhost:5432/majalis_test
          DATABASE_URL: postgresql://majalis_test:majalis_test@localhost:5432/majalis_test
          NODE_ENV: test
        run: pnpm run test:postgres-integration

      - name: Migration verify + upgrade idempotency
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://majalis_test:majalis_test@localhost:5432/majalis_test
        run: |
          pnpm run db:migration:verify
          pnpm run db:migration:verify:upgrade

  # ---------------------------------------------------------------------------
  # ٨) البوابة المطلوبة الوحيدة لحماية الفرع — الاسم "Verify build" ثابت.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify build
    needs:
      - classify
      - fast-lane
      - static-checks
      - build
      - repo-gates
      - mushaf-measure
      - mushaf-gates
      - layout-bands
      - visual-snapshot
      - color-contrast
      - lhci-home
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate required jobs (path-lane aware)
        env:
          LANE: ${{ needs.classify.outputs.lane }}
          NEED_BUILD: ${{ needs.classify.outputs.need_build }}
          NEED_FAST: ${{ needs.classify.outputs.need_fast_lane }}
          NEED_MUSHAF: ${{ needs.classify.outputs.need_mushaf }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FAST_RESULT: ${{ needs.fast-lane.result }}
          STATIC_RESULT: ${{ needs.static-checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          REPO_GATES_RESULT: ${{ needs.repo-gates.result }}
          MEASURE_RESULT: ${{ needs.mushaf-measure.result }}
          GATES_RESULT: ${{ needs.mushaf-gates.result }}
          BANDS_RESULT: ${{ needs.layout-bands.result }}
          VISUAL_RESULT: ${{ needs.visual-snapshot.result }}
          COLOR_RESULT: ${{ needs.color-contrast.result }}
          LHCI_RESULT: ${{ needs.lhci-home.result }}
        run: |
          set -euo pipefail
          {
            echo "## CI path-lane / results"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| lane | \`$LANE\` |"
            echo "| classify | $CLASSIFY_RESULT |"
            echo "| fast-lane | $FAST_RESULT |"
            echo "| static-checks | $STATIC_RESULT |"
            echo "| build | $BUILD_RESULT |"
            echo "| repo-gates | $REPO_GATES_RESULT |"
            echo "| mushaf-measure | $MEASURE_RESULT |"
            echo "| mushaf-gates | $GATES_RESULT |"
            echo "| layout-bands | $BANDS_RESULT |"
            echo "| visual-snapshot | $VISUAL_RESULT |"
            echo "| color-contrast | $COLOR_RESULT |"
            echo "| lhci-home | $LHCI_RESULT |"
            echo ""
            echo "بناء واحد فقط (وظيفة \`build\`) — كل البوابات تنزّل dist."
            echo "مسار PR: ٦ صفحات مرجعية × 390×844 على ٤ shards. الكامل ليلاً."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "classify failed: $CLASSIFY_RESULT"
            exit 1
          fi

          check_req() {
            local name="$1" need="$2" result="$3"
            if [ "$need" = "true" ]; then
              if [ "$result" = "success" ]; then
                echo "OK required $name=$result"
                return 0
              fi
              if [ "$result" = "cancelled" ]; then
                echo "required job '$name' was cancelled (غالبًا fail-fast من وظيفة أخرى) — ليس نجاحًا"
                exit 1
              fi
              echo "required job '$name' not success: $result"
              exit 1
            else
              if [ "$result" = "failure" ]; then
                echo "optional job '$name' failed unexpectedly: $result"
                exit 1
              fi
              # skipped / cancelled / success مسموح عندما need=false
              echo "OK optional $name=$result (skipped/cancelled allowed when not required)"
            fi
          }

          check_req "fast-lane" "$NEED_FAST" "$FAST_RESULT"
          check_req "static-checks" "$NEED_BUILD" "$STATIC_RESULT"
          check_req "build" "$NEED_BUILD" "$BUILD_RESULT"
          check_req "repo-gates" "$NEED_BUILD" "$REPO_GATES_RESULT"
          check_req "mushaf-measure" "$NEED_MUSHAF" "$MEASURE_RESULT"
          check_req "mushaf-gates" "$NEED_MUSHAF" "$GATES_RESULT"
          check_req "layout-bands" "$NEED_MUSHAF" "$BANDS_RESULT"
          check_req "visual-snapshot" "$NEED_BUILD" "$VISUAL_RESULT"
          check_req "color-contrast" "$NEED_BUILD" "$COLOR_RESULT"
          check_req "lhci-home" "$NEED_BUILD" "$LHCI_RESULT"

          echo "Verify build OK (lane=$LANE)"

  # ---------------------------------------------------------------------------
  # ٩) المجمّع المطلوب لحماية الفرع — Skipped في بوابة إلزامية = فشل.
  #    يبقى «Verify build» للتوافق؛ ci-required هو الفحص الإضافي الصريح.
  # ---------------------------------------------------------------------------
  ci-required:
    name: ci-required
    needs:
      - classify
      - verify
      - color-contrast
      - visual-snapshot
      - lhci-home
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Required gates — Skipped is failure
        env:
          NEED_BUILD: ${{ needs.classify.outputs.need_build }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          COLOR_RESULT: ${{ needs.color-contrast.result }}
          VISUAL_RESULT: ${{ needs.visual-snapshot.result }}
          LHCI_RESULT: ${{ needs.lhci-home.result }}
        run: |
          set -euo pipefail
          {
            echo "## ci-required"
            echo "| Job | Result | Required when |"
            echo "|-----|--------|----------------|"
            echo "| classify | $CLASSIFY_RESULT | always |"
            echo "| Verify build | $VERIFY_RESULT | always |"
            echo "| color-contrast | $COLOR_RESULT | need_build=$NEED_BUILD |"
            echo "| visual-snapshot | $VISUAL_RESULT | need_build=$NEED_BUILD |"
            echo "| lhci-home | $LHCI_RESULT | need_build=$NEED_BUILD |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "classify not success: $CLASSIFY_RESULT"
            exit 1
          fi
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "Verify build not success: $VERIFY_RESULT (skipped/cancelled/failure = fail)"
            exit 1
          fi

          check_req() {
            local name="$1" need="$2" result="$3"
            if [ "$need" = "true" ]; then
              if [ "$result" = "success" ]; then
                echo "OK required $name=$result"
                return 0
              fi
              echo "required job '$name' not success: $result (Skipped = fail)"
              exit 1
            fi
            if [ "$result" = "failure" ]; then
              echo "optional job '$name' failed unexpectedly: $result"
              exit 1
            fi
            echo "OK optional $name=$result"
          }

          check_req "color-contrast" "$NEED_BUILD" "$COLOR_RESULT"
          check_req "visual-snapshot" "$NEED_BUILD" "$VISUAL_RESULT"
          check_req "lhci-home" "$NEED_BUILD" "$LHCI_RESULT"
          echo "ci-required OK"
