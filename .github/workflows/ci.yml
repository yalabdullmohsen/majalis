name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs for the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Content guard (audit gates)
        run: pnpm --filter @workspace/majalis run test:content-guard

      - name: TypeScript check
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/majalis run typecheck

      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Build
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/majalis run build

      - name: Verify no runtime DDL
        run: pnpm verify:no-runtime-ddl

      - name: Content import tests
        run: |
          cd artifacts/majalis
          pnpm run test:content-import
          pnpm run test:content-import-e2e

      - name: Autonomous platform tests
        run: |
          cd artifacts/majalis
          pnpm run verify:autonomous-platform
          pnpm run verify:majlis-knowledge-engine
          pnpm run verify:import-jobs-integrity

      - name: Verify deploy output
        run: pnpm --filter @workspace/majalis run verify:deploy
