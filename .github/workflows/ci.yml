name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency منفصل لكل PR (ولكل push إلى main عبر run_id/sha).
concurrency:
  group: ci-${{ github.workflow }}-pr-${{ github.event.pull_request.number || format('push-{0}', github.sha) }}
  cancel-in-progress: true

permissions:
  contents: read

# Pin trusted action SHAs (tag comments for humans).

jobs:
  # الاسم "Verify build" يبقى لفحص حماية الفرع الحالي.
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Governance / auto-merge safety gate
        run: pnpm run verify:no-unsafe-auto-merge

      - name: Release Train unit tests
        run: pnpm run test:release-train

      - name: Safe auto-merge policy unit tests
        run: pnpm run test:safe-auto-merge

      - name: tsc -b (clean + build)
        run: |
          pnpm exec tsc -b --clean
          pnpm exec tsc -b

      - name: typecheck (workspace)
        run: pnpm run typecheck

      - name: Lint (zero warnings)
        run: pnpm --filter @workspace/majalis exec eslint src lib --max-warnings=0

      - name: Generated artifacts --check
        run: |
          pnpm --filter @workspace/majalis exec node --import tsx scripts/generate-content-counts.ts --check
          pnpm --filter @workspace/majalis exec node scripts/generate-quran-pages-manifest.mjs --check

      - name: Head shell gate (viewport / no keywords / zoom)
        run: pnpm --filter @workspace/majalis run verify:head-shell-gate

      - name: PageShell gate (unified layouts)
        run: pnpm --filter @workspace/majalis run verify:pageshell-gate

      - name: Cron single-response gate
        run: pnpm run verify:single-response

      - name: Full package tests
        run: pnpm --filter @workspace/majalis run test

      - name: Deterministic build
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/majalis run build

      - name: Bundle budget / no mega-seeds in entry
        run: pnpm --filter @workspace/majalis run test:bundle-budget

      - name: git diff --exit-code (build must not dirty tree)
        run: git diff --exit-code

      - name: Deploy output verify
        run: pnpm --filter @workspace/majalis run verify:deploy

      - name: Verify no runtime DDL
        run: pnpm verify:no-runtime-ddl

      - name: Platform hardening SQL static gate
        run: pnpm run verify:platform-hardening-sql

      - name: Schema drift expectations
        run: node scripts/verify-schema-drift-expectations.mjs

      - name: DB migration verify (static + live when URL set)
        env:
          MIGRATION_TEST_DATABASE_URL: ${{ secrets.MIGRATION_TEST_DATABASE_URL }}
        run: pnpm run db:migration:verify

      - name: Ops backlog report (read-only counts)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm run ops:backlog-report

      - name: api-server typecheck/build (required when package present)
        run: |
          set -euo pipefail
          if [ -d artifacts/api-server ]; then
            pnpm --filter @workspace/api-server run typecheck
            pnpm --filter @workspace/api-server run build
          else
            echo "api-server package absent — skip"
          fi

  # ---------------------------------------------------------------------------
  # Color contrast — Playwright Chromium (isolated job; fails loudly if missing)
  # ---------------------------------------------------------------------------
  color-contrast:
    name: Color contrast (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/majalis exec playwright install --with-deps chromium

      - name: Build majalis
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/majalis run build

      - name: Color contrast gate
        run: pnpm --filter @workspace/majalis run test:color-contrast-gate

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: majalis_test
          POSTGRES_PASSWORD: majalis_test
          POSTGRES_DB: majalis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U majalis_test -d majalis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Queue integration (REQUIRED)
        env:
          REQUIRE_POSTGRES_INTEGRATION: "1"
          MIGRATION_TEST_DATABASE_URL: postgresql://majalis_test:majalis_test@localhost:5432/majalis_test
          DATABASE_URL: postgresql://majalis_test:majalis_test@localhost:5432/majalis_test
          NODE_ENV: test
        run: pnpm run test:postgres-integration

      - name: Migration verify + upgrade idempotency
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://majalis_test:majalis_test@localhost:5432/majalis_test
        run: |
          pnpm run db:migration:verify
          pnpm run db:migration:verify:upgrade
