name: Auto Deploy main → production

# بوابة جودة + تحقق صحة بعد وصول main.
# النشر الفعلي يتم مباشرة من Vercel على فرع main
# (artifacts/majalis/vercel.json → git.deploymentEnabled.main = true).
# لا يوجد فرع Git باسم production — أُزيل الاعتماد عليه بعد اختفائه من remote
# (fatal: couldn't find remote ref production، 2026-07-26).

on:
  push:
    branches: [main]
  schedule:
    # إعادة محاولة عند rate limit / تأخر نشر — مرة كل ساعة
    - cron: "0 * * * *"
  workflow_dispatch: {}

# منع تكرار نشر لنفس الخط: تشغيل واحد فقط؛ إلغاء الأقدم عند دفع جديد.
concurrency:
  group: auto-deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  deploy:
    if: github.repository == 'yalabdullmohsen/majalis'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      pr_title: ${{ steps.meta.outputs.pr_title }}
      version_ok: ${{ steps.verify.outputs.version_ok }}
      deploy_status: ${{ steps.verify.outputs.deploy_status }}

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1

      - name: Meta (PR / commit)
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "short_sha=$short" >> "$GITHUB_OUTPUT"
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ github.sha }}/pulls" \
            --jq '.[0] | {number,title}' 2>/dev/null || echo '{}')
          echo "pr_number=$(echo "$pr_json" | jq -r '.number // empty')" >> "$GITHUB_OUTPUT"
          echo "pr_title=$(echo "$pr_json" | jq -r '.title // empty')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/majalis run typecheck

      - name: Production build (تحقق من main قبل الاعتماد على النشر)
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/majalis run build

      - name: انتظار استقرار نشر Vercel + version.json + HTTP 200
        id: verify
        env:
          EXPECT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          soft_rate_limit() {
            local got="$1"
            echo "deploy_status=rate_limited" >> "$GITHUB_OUTPUT"
            echo "version_ok=rate_limited" >> "$GITHUB_OUTPUT"
            {
              echo "## نشر معلّق — Vercel rate limit / تأخر نشر"
              echo ""
              echo "- المتوقع: \`$EXPECT_SHA\`"
              echo "- الحالي على الإنتاج: \`${got:-empty}\`"
              echo "- السبب المحتمل: حد معدل Vercel أو طابور نشر متأخر"
              echo "- الإجراء: سيُعاد المحاولة عبر schedule كل ساعة أو workflow_dispatch"
              echo "- لا تُعاد محاولات يدوية متكررة في نفس الساعة"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Vercel لم يحدّث version.json بعد — معدل/تأخير خارجي. نجاح ليّن؛ أعد المحاولة لاحقاً عبر schedule أو Dispatch."
            exit 0
          }

          verify_once() {
            local attempt="$1"
            echo "—— محاولة تحقق #$attempt ——"
            if [ "$EVENT_NAME" = "push" ]; then
              sleep 90
            else
              sleep 15
            fi
            ok_http=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -sS -o /tmp/majlisilm-health.html -w "%{http_code}" \
                --max-time 30 -L "https://www.majlisilm.com/" || echo "000")
              echo "محاولة HTTP $i: $code (www)"
              if [ "$code" = "200" ]; then
                ok_http=1
                break
              fi
              code2=$(curl -sS -o /tmp/majlisilm-health2.html -w "%{http_code}" \
                --max-time 30 -L "https://majlisilm.com/" || echo "000")
              echo "محاولة HTTP $i: $code2 (apex)"
              if [ "$code2" = "200" ]; then
                ok_http=1
                break
              fi
              sleep 20
            done
            if [ "$ok_http" != "1" ]; then
              echo "HTTP لم يُرجع 200"
              return 1
            fi

            # على schedule/dispatch: طابق SHA الإنتاج مع main؛ وإلا نجاح ليّن + إعادة ساعة لاحقًا
            if [ "$EVENT_NAME" != "push" ]; then
              ok_ver=0
              got=""
              for i in 1 2 3 4 5 6; do
                body=$(curl -sS --max-time 30 -L "https://www.majlisilm.com/version.json" || true)
                got=$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)
                echo "version.json (schedule) محاولة $i: ${got:-empty} expect=$EXPECT_SHA"
                if [ -n "$got" ] && [ "$got" = "$EXPECT_SHA" ]; then
                  ok_ver=1
                  break
                fi
                sleep 20
              done
              if [ "$ok_ver" = "1" ]; then
                echo "version_ok=1" >> "$GITHUB_OUTPUT"
                echo "deploy_status=matched" >> "$GITHUB_OUTPUT"
                echo "✓ الإنتاج طابق main ($EXPECT_SHA)"
                return 0
              fi
              soft_rate_limit "$got"
            fi

            ok_ver=0
            got=""
            for i in 1 2 3 4 5 6 7 8; do
              body=$(curl -sS --max-time 30 -L "https://www.majlisilm.com/version.json" || true)
              got=$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)
              echo "version.json محاولة $i: ${got:-empty}"
              if [ "$got" = "$EXPECT_SHA" ]; then
                ok_ver=1
                break
              fi
              sleep 20
            done
            if [ "$ok_ver" != "1" ]; then
              echo "version.json لا يطابق $EXPECT_SHA (got=${got:-})"
              # إنتاج حي لكن SHA قديم → غالباً rate limit / نشر معلّق — لا نفشل بلا معنى
              soft_rate_limit "$got"
            fi
            echo "version_ok=1" >> "$GITHUB_OUTPUT"
            echo "deploy_status=matched" >> "$GITHUB_OUTPUT"
            echo "✓ الإنتاج 200 و version.json = $EXPECT_SHA"
            return 0
          }

          if verify_once 1; then
            exit 0
          fi
          echo "فشل التحقق — إعادة محاولة تلقائية واحدة…"
          echo "version_ok=0" >> "$GITHUB_OUTPUT"
          if verify_once 2; then
            exit 0
          fi
          exit 1

  psi-gate:
    name: PSI production gate (فحص 13)
    needs: [deploy]
    if: >
      github.repository == 'yalabdullmohsen/majalis' &&
      github.event_name == 'push' &&
      needs.deploy.result == 'success' &&
      needs.deploy.outputs.version_ok == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare --activate

      - name: PSI — FCP/SI 2200/2500 + لا انحدار عن فحص 12
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: pnpm --filter @workspace/majalis run verify:psi-production-gate -- --json | tee /tmp/psi-gate.json

      - name: Upload PSI report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psi-production-gate
          path: /tmp/psi-gate.json
          if-no-files-found: ignore

  notify-success:
    name: notify-success
    needs: [deploy, psi-gate]
    if: >
      github.repository == 'yalabdullmohsen/majalis' &&
      github.event_name == 'push' &&
      needs.deploy.result == 'success' &&
      needs.deploy.outputs.version_ok == '1' &&
      (needs.psi-gate.result == 'success' || needs.psi-gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: رسالة نجاح واحدة (ملخص + webhook اختياري)
        env:
          SHORT: ${{ needs.deploy.outputs.short_sha }}
          PRN: ${{ needs.deploy.outputs.pr_number }}
          PRT: ${{ needs.deploy.outputs.pr_title }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}
        run: |
          set -euo pipefail
          SITE="https://www.majlisilm.com"
          MSG=$(cat <<EOF
          ✅ نُشر بنجاح — مجالس العلم
          PR: ${PRN:-—} — ${PRT:-—}
          Commit: ${SHORT} (${SHA})
          Build / run: ${RUN_ID}
          الموقع: ${SITE}
          version.json: ${SITE}/version.json
          البوابات: Verify build أخضر → دمج squash → نشر Vercel → تطابق version.json
          EOF
          )
          echo "$MSG"
          {
            echo "## نشر ناجح"
            echo ""
            echo "- **PR:** #${PRN:-—} — ${PRT:-—}"
            echo "- **Commit:** \`${SHORT}\` (\`${SHA}\`)"
            echo "- **Build:** [\`${RUN_ID}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID})"
            echo "- **الموقع:** ${SITE}"
            echo "- **version.json:** ${SITE}/version.json"
            echo "- **ملخص البوابات:** Verify build → auto-merge squash → Vercel → تطابق commit"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${WEBHOOK:-}" ]; then
            payload=$(jq -n --arg text "$MSG" '{text:$text, content:$text}')
            curl -sS -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK" || true
          else
            echo "لا يوجد DEPLOY_NOTIFY_WEBHOOK — الملخص في Actions فقط."
          fi
