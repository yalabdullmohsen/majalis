name: Auto Deploy main → production

# بوابة جودة + تحقق صحة بعد وصول main.
# النشر الفعلي يتم مباشرة من Vercel على فرع main
# (artifacts/majalis/vercel.json → git.deploymentEnabled.main = true).
# لا يوجد فرع Git باسم production — أُزيل الاعتماد عليه بعد اختفائه من remote
# (fatal: couldn't find remote ref production، 2026-07-26).

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# يمنع تشغيل نسختين متزامنتين. لا نُلغي تشغيلًا جاريًا (cancel-in-progress:
# false) — تحقق إنتاجي منتصف الطريق لا يجوز قطعه.
concurrency:
  group: auto-deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'yalabdullmohsen/majalis'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/majalis run typecheck

      - name: Production build (تحقق من main قبل الاعتماد على النشر)
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/majalis run build

      - name: انتظار استقرار نشر Vercel من main والتحقق من الإنتاج
        run: |
          set -euo pipefail
          echo "انتظار نشر Vercel من main…"
          # على schedule قد لا يكون هناك deploy جديد؛ نتحقق من الاستجابة فقط.
          # على push نمنح Vercel وقتًا أطول قليلًا.
          if [ "${{ github.event_name }}" = "push" ]; then
            sleep 90
          else
            sleep 15
          fi
          ok=0
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/majlisilm-health.html -w "%{http_code}" \
              --max-time 30 -L "https://www.majlisilm.com/" || echo "000")
            echo "محاولة $i: HTTP $code (www)"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            code2=$(curl -sS -o /tmp/majlisilm-health2.html -w "%{http_code}" \
              --max-time 30 -L "https://majlisilm.com/" || echo "000")
            echo "محاولة $i: HTTP $code2 (apex)"
            if [ "$code2" = "200" ]; then
              ok=1
              break
            fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::majlisilm.com لم يُرجع 200 بعد نشر/تحقق main"
            exit 1
          fi
          echo "✓ الإنتاج يستجيب 200 (مصدر النشر: main → Vercel)"
