name: Preview smoke (manual)

# كان ينتظر معاينة Vercel على كل PR — مكرر وغير مطلوب لـ Verify build.
# معاينات PR أُوقفت في vercel.json (main فقط). التشغيل يدوي عند الحاجة.
# راجع docs/CI_THROUGHPUT.md.

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "URL معاينة أو إنتاج للـsmoke"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: read

jobs:
  preview-smoke:
    name: preview-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Smoke against provided URL
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          url="${PREVIEW_URL%/}"
          echo "smoke → $url"
          code=$(curl -sS -o /tmp/smoke-body -w "%{http_code}" "$url/" || true)
          echo "GET / → $code"
          test "$code" = "200"
          ready=$(curl -sS -o /tmp/readyz -w "%{http_code}" "$url/api/readyz" || true)
          echo "GET /api/readyz → $ready"
          if [ "$ready" != "200" ]; then
            echo "readyz not 200"
            cat /tmp/readyz || true
            exit 1
          fi
          echo "preview-smoke ok"
