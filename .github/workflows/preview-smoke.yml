name: Preview smoke (commit-linked)

# ينتظر Deployment Preview من Vercel لنفس SHA ثم يشغّل smoke خفيفًا.
# لا يدمج ولا يفعّل auto-merge. يستخدم GITHUB_TOKEN فقط.
# فشل /api/readyz بـ 503 أو JSON غير جاهز يمنع اعتبار الـPR أخضرًا للدمج التلقائي.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: read

jobs:
  preview-smoke:
    name: preview-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Wait for Preview URL (same head SHA)
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # Soft-pass early for docs/SQL/workflows-only PRs (no interactive frontend).
          # Avoids smoking a wrong Vercel project URL (e.g. api-server) when the web
          # app preview was skipped via Ignored Build Step.
          changed=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUM}/files?per_page=100" --jq '.[].filename' || true)
          # Content-safe audits (quiz/data/continuation) never need Preview smoke.
          if [ -n "$changed" ]; then
            non_content=$(echo "$changed" | grep -Ev '^(artifacts/majalis/(public/data/|data/)|CONTINUATION_PLAN\.md$)' || true)
            if [ -z "$non_content" ]; then
              echo "preview_ready=false" >> "$GITHUB_OUTPUT"
              echo "Content-audit paths only — soft pass without Preview URL"
              exit 0
            fi
          fi
          if ! echo "$changed" | grep -Eq '^(artifacts/majalis/(src/(views|components|pages|App\.tsx|main\.tsx)|index\.html|vite\.config)|artifacts/api-server/src/)'; then
            echo "preview_ready=false" >> "$GITHUB_OUTPUT"
            echo "No interactive frontend deploy paths — soft pass without Preview URL"
            exit 0
          fi

          url=""
          for i in $(seq 1 24); do
            # Soft-pass when Vercel explicitly skipped this SHA (Ignored Build Step)
            vercel_state=$(gh pr checks "$PR_NUM" 2>/dev/null | awk 'BEGIN{IGNORECASE=1} $1 ~ /Vercel/ {print $2" "$0}' | head -5 || true)
            if echo "$vercel_state" | grep -qiE 'Skipped|Canceled|Ignored'; then
              echo "preview_ready=false" >> "$GITHUB_OUTPUT"
              echo "Vercel preview skipped for this change set — soft pass"
              exit 0
            fi
            # Prefer majalis web preview over api-server / other projects
            url=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${HEAD_SHA}&per_page=20" \
              --jq '[.[] | select((.environment|tostring|test("[Pp]review")) or (.environment|tostring|test("vercel"))) | (.payload.web_url // empty)] | map(select(test("majalis-majalis"))) | .[0] // empty' 2>/dev/null || true)
            if [ -z "${url:-}" ]; then
              url=$(gh pr view "$PR_NUM" --json comments,statusCheckRollup --jq '
                [
                  (.comments // [] | .[].body // ""),
                  (.statusCheckRollup // [] | .[].detailsUrl // ""),
                  (.statusCheckRollup // [] | .[].description // "")
                ] | join("\n")
                | [scan("https://[a-zA-Z0-9.-]+\\.vercel\\.app")]
                | map(select(test("majalis-majalis")))
                | .[0] // empty
              ' 2>/dev/null || true)
            fi
            if [ -n "${url:-}" ]; then
              echo "preview_url=$url" >> "$GITHUB_OUTPUT"
              echo "preview_ready=true" >> "$GITHUB_OUTPUT"
              echo "Found preview: $url"
              exit 0
            fi
            echo "attempt $i/24: preview not ready yet…"
            sleep 30
          done
          if [ "$IS_DRAFT" = "true" ]; then
            echo "preview_ready=false" >> "$GITHUB_OUTPUT"
            echo "Draft PR — preview missing tolerated"
            exit 0
          fi
          echo "preview_ready=false" >> "$GITHUB_OUTPUT"
          echo "::error::Preview URL not found for SHA $HEAD_SHA after waiting"
          exit 1

      - name: Smoke against Preview
        if: steps.preview.outputs.preview_ready == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/}"

          smoke_page() {
            local path="$1"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$base$path" || true)
            echo "GET $path → $code"
            echo "$code" | grep -Eq '^(200|301|302)$'
          }

          smoke_page "/"
          smoke_page "/mushaf"
          smoke_page "/prayer-times"
          smoke_page "/lessons"

          code_health=$(curl -s -o /tmp/healthz.json -w "%{http_code}" "$base/api/healthz" || true)
          echo "healthz=$code_health"
          # 200 preferred; 401/404/3xx tolerated on multi-project previews
          echo "$code_health" | grep -Eq '^(200|401|404|301|302)$'
          if [ "$code_health" = "200" ]; then
            node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/healthz.json","utf8")); if(j.ok!==true){process.exit(1)}'
          fi

          code_ready=$(curl -s -o /tmp/readyz.json -w "%{http_code}" "$base/api/readyz" || true)
          echo "readyz=$code_ready"
          if [ "$code_ready" = "503" ]; then
            echo "::error::/api/readyz returned 503 (DB/schema not ready) — blocking auto-merge readiness"
            cat /tmp/readyz.json || true
            exit 1
          fi
          # 200 = ready; 401/404/3xx tolerated when endpoint gated on preview
          echo "$code_ready" | grep -Eq '^(200|401|404|301|302)$'
          if [ "$code_ready" = "200" ]; then
            node -e '
              const j=JSON.parse(require("fs").readFileSync("/tmp/readyz.json","utf8"));
              const ok = j.status==="ok" || j.status==="ready" || j.ok===true;
              if(!ok){ console.error(j); process.exit(1); }
            '
          fi

          echo "preview-smoke ok for $base"

      - name: Setup workspace (Playwright critical)
        if: steps.preview.outputs.preview_ready == 'true'
        uses: ./.github/actions/setup-workspace
        with:
          playwright: "true"

      - name: Playwright critical acceptance against Preview
        if: steps.preview.outputs.preview_ready == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          pnpm --filter @workspace/majalis exec playwright test \
            tests/10-critical-acceptance.spec.ts \
            --project=desktop
          echo "playwright-critical ok"
