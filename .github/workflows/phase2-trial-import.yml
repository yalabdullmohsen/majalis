name: Phase 2 Trial Import

# ⚠️ ج-٢٥٨ (٢٠٢٦-٠٧-٢٧): أُلغي التشغيل التلقائي على `push` وبقي `workflow_dispatch`
# وحدَه. قوالبُ `data/imports/trial/*.phase2.json` **سجلّاتُ اختبارٍ صريحة**
# («هل يجوز الجمع بين الصلاتين للمسافر في Phase2؟»، «كتاب تجريبي Phase2»،
# «الشيخ التجريبي Phase2»)، وهذه الوظيفة تكتبها في **الجداول الحيّة** فتظهر
# للقارئ؛ وقد حُذفت ثلاثَ مرّات (ج-٢٢٥ وج-٢٢٨ وج-٢٥١) وعادت كلَّ مرّة. وأكبرُ
# مصادر عودتها كانت جدولةَ `/api/cron/import-phase2-trial` كلَّ ست ساعات في
# `vercel.json` (حُذفت في ج-٢٥٨)، وهذا ثاني المصدرين. فبقي التشغيلُ اليدويّ
# عند الحاجة إلى تجربة محرِّك الاستيراد، ولا يعمل من تلقاء نفسه.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    if: github.repository == 'yalabdullmohsen/majalis'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Ensure schema and import Phase 2 trial data
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skip: SUPABASE_SERVICE_ROLE_KEY not configured in GitHub secrets"
            exit 0
          fi
          cd artifacts/majalis
          node scripts/import-phase2-trial.mjs

      - name: Verify Phase 2 data on site and Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Skip verify: SUPABASE_ANON_KEY not configured"
            exit 0
          fi
          cd artifacts/majalis
          node scripts/verify-phase2-import.mjs --base=https://www.majlisilm.com

      - name: Trigger production bootstrap import (fallback)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Skip production API trigger: CRON_SECRET not set"
            exit 0
          fi
          curl -sf -X POST "https://www.majlisilm.com/api/cron/bootstrap-database?action=phase2-trial-import" \
            -H "x-vercel-cron: 1" \
            -H "Authorization: Bearer $CRON_SECRET" || \
          curl -sf -X POST "https://www.majlisilm.com/api/cron/import-phase2-trial" \
            -H "x-vercel-cron: 1" \
            -H "Authorization: Bearer $CRON_SECRET" || \
          echo "Production API import routes not yet deployed — local import above is authoritative"
