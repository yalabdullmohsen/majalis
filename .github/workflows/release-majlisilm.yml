name: Release Majlisilm (يدوي فقط)

# مسار الإصدار اليدوي الوحيد.
# يعمل حصراً عبر workflow_dispatch من فرع main.
# لا pull_request، لا push، لا schedule — عمداً.
# لا يدفع إلى main مباشرة: حماية الفرع تبقى سارية، والنشر يتم
# بدمج PR الإصدار بالطريقة الطبيعية بعد نجاح البوابات.

on:
  workflow_dispatch: {}

concurrency:
  group: release-majlisilm
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  RELEASE_ONLY_DISPATCH_MAIN: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

jobs:
  reject-non-main:
    if: >-
      github.repository == 'yalabdullmohsen/majalis' &&
      (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: رفض التشغيل خارج workflow_dispatch على main
        run: |
          echo "::error::Release Majlisilm يعمل فقط عبر workflow_dispatch من فرع main. event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
          exit 1

  release:
    if: >-
      github.repository == 'yalabdullmohsen/majalis' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: تأكيد حدث الإصدار
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"

      - name: Checkout main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: إعداد هوية git
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "majlisilm-release-bot"
          git config user.email "release-bot@users.noreply.github.com"

      - name: جلب أحدث automation/content وautomation/tasks
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: git fetch origin automation/content automation/tasks

      - name: دمج automation/content إلى شجرة الإصدار المحلية
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          if ! git merge origin/automation/content --no-ff -m "release: دمج automation/content"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "::error::تعارض دمج في automation/content — أُلغي الإصدار بالكامل، main لم يتأثر."
            echo "## ❌ تعارض دمج في automation/content" >> "$GITHUB_STEP_SUMMARY"
            echo "الملفات المتعارضة:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$CONFLICTS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r f; do
              [ -n "$f" ] && echo "::error file=$f::تعارض دمج في هذا الملف بين main وautomation/content"
            done <<< "$CONFLICTS"
            git merge --abort || true
            exit 1
          fi

      - name: دمج automation/tasks إلى شجرة الإصدار المحلية
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          if ! git merge origin/automation/tasks --no-ff -m "release: دمج automation/tasks"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "::error::تعارض دمج في automation/tasks — أُلغي الإصدار بالكامل، main لم يتأثر."
            echo "## ❌ تعارض دمج في automation/tasks" >> "$GITHUB_STEP_SUMMARY"
            echo "الملفات المتعارضة:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$CONFLICTS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r f; do
              [ -n "$f" ] && echo "::error file=$f::تعارض دمج في هذا الملف بين main (بعد دمج automation/content) وautomation/tasks"
            done <<< "$CONFLICTS"
            git merge --abort || true
            exit 1
          fi

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          corepack enable
          corepack prepare --activate

      - name: تثبيت الاعتماديات
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm install --frozen-lockfile

      - name: تثبيت متصفح Playwright (لبوابة تباين الألوان ضمن test:regression)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm --filter @workspace/majalis exec playwright install --with-deps chromium

      - name: Typecheck
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/majalis run typecheck

      - name: Build (بوابة الجودة على نتيجة الدمج المجتمعة)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm --filter @workspace/majalis run build

      - name: اختبارات الانحدار
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm --filter @workspace/majalis run test:regression

      - name: فرع إصدار وطلب دمج إلى main (بلا دفع مباشر)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: automation/release-majlisilm-${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::رفض إنشاء فرع الإصدار: ليس workflow_dispatch على main."
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "لا تغييرات بعد الدمج — لا فرع ولا PR."
            echo "## لا تغييرات للإصدار" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout -B "$RELEASE_BRANCH"
          # ادفع فرع الإصدار فقط. محظور: git push origin HEAD:main
          git push origin "HEAD:refs/heads/${RELEASE_BRANCH}"
          existing=$(gh pr list --base main --head "$RELEASE_BRANCH" --json number --jq '.[0].number // empty' || true)
          if [ -n "${existing}" ]; then
            echo "PR إصدار موجود #${existing}"
            echo "## PR الإصدار #${existing}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          url=$(gh pr create --base main --head "$RELEASE_BRANCH" \
            --title "release: دمج نوافذ الأتمتة (run ${{ github.run_number }})" \
            --body "$(cat <<'EOF'
          إصدار مُتحقَّق محلياً في هذا الـworkflow (typecheck + build + test:regression) بعد دمج `automation/content` و`automation/tasks` فوق `main`.

          لا دفع مباشر إلى `main`. الدمج يتم بطلب السحب هذا عبر حماية الفرع المعتادة.

          EOF
          )")
          echo "## PR الإصدار" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
