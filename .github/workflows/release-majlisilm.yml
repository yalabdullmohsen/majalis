name: Release Majlisilm (يدوي فقط)

# مسار الإصدار اليدوي الوحيد.
# يعمل حصراً عبر workflow_dispatch من فرع main.
# لا pull_request، لا push، لا schedule — عمداً.
# لا يدفع إلى main مباشرة أبدًا.
# لا يجلب ولا يدمج فروع automation/content أو automation/tasks.
# أي محتوى جديد يُدمَج إلى main عبر PR عادي (squash) قبل تشغيل هذا المسار.
# هذا الـworkflow يتحقق من جودة main ثم يشغّل/يؤكد مسار النشر الإنتاجي من main.

on:
  workflow_dispatch: {}

concurrency:
  group: release-majlisilm
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  RELEASE_ONLY_DISPATCH_MAIN: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

jobs:
  reject-non-main:
    if: >-
      github.repository == 'yalabdullmohsen/majalis' &&
      (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: رفض التشغيل خارج workflow_dispatch على main
        run: |
          echo "::error::Release Majlisilm يعمل فقط عبر workflow_dispatch من فرع main. event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
          exit 1

  release:
    if: >-
      github.repository == 'yalabdullmohsen/majalis' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: تأكيد حدث الإصدار
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
          echo "الإصدار من main فقط — بلا فروع أتمتة."

      - name: Checkout main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1

      - name: تأكيد أن الشجرة هي main فقط
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short=8 HEAD)
          echo "main_sha=${SHORT}"
          echo "main_sha=${SHORT}" >> "$GITHUB_STEP_SUMMARY"
          echo "## إصدار من main" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${SHORT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- لا fetch/merge لفروع الأتمتة داخل هذا المسار." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          corepack enable
          corepack prepare --activate

      - name: تثبيت الاعتماديات
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm install --frozen-lockfile

      - name: تثبيت متصفح Playwright (لبوابة تباين الألوان ضمن test:regression)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm --filter @workspace/majalis exec playwright install --with-deps chromium

      - name: Typecheck
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/majalis run typecheck

      - name: Build (بوابة الجودة على main)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm --filter @workspace/majalis run build

      - name: اختبارات الانحدار
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: pnpm --filter @workspace/majalis run test:regression

      - name: تشغيل نشر الإنتاج من main (Auto Deploy)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # لا دفع إلى main. النشر عبر مسار Auto Deploy المعتمد على main / Vercel.
          gh workflow run "Auto Deploy main → production" --ref main
          echo "## نشر الإنتاج" >> "$GITHUB_STEP_SUMMARY"
          echo "- شُغِّل Auto Deploy على \`main\` بعد نجاح بوابات الإصدار." >> "$GITHUB_STEP_SUMMARY"
          echo "- أي محتوى جديد يجب أن يكون مدمجًا مسبقًا عبر PR عادي إلى \`main\`." >> "$GITHUB_STEP_SUMMARY"
