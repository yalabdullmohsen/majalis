name: Vercel Check (manual)

# كان يكرر lint+typecheck+build على كل PR بجانب CI/Verify build.
# أُوقف التشغيل التلقائي — استخدم workflow_dispatch عند التشخيص فقط.
# راجع docs/CI_THROUGHPUT.md.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint-typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup-workspace

      - name: TypeScript check
        run: pnpm run typecheck

      - name: ESLint (zero warnings)
        run: pnpm --filter @workspace/majalis exec eslint src lib --max-warnings=0

      - name: Deterministic production build (Vercel function/API dry-run)
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/majalis run build

      - name: Build must not dirty the git tree
        run: git diff --exit-code

      - name: Verify Vercel entrypoints exist
        run: |
          set -euo pipefail
          test -f artifacts/majalis/vercel.json
          test -f artifacts/majalis/api/index.js
          node -e "JSON.parse(require('fs').readFileSync('artifacts/majalis/vercel.json','utf8')); console.log('vercel.json ok')"
