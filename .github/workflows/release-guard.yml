name: Release guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: release-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-guard:
    if: github.repository == 'yalabdullmohsen/majalis'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (if present)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.lint?0:1)"; then
            pnpm run lint
          else
            echo "skip: no lint script"
          fi

      - name: Typecheck (if present)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.typecheck?0:1)"; then
            pnpm run typecheck
          else
            echo "skip: no typecheck script"
          fi

      - name: Test (if present)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.test?0:1)"; then
            pnpm run test
          else
            echo "skip: no test script"
          fi

      - name: Predeploy guard (source)
        run: node scripts/predeploy-guard.mjs

      - name: Build
        env:
          PORT: "24216"
          BASE_PATH: "/"
        run: pnpm run build

      - name: Predeploy guard (post-build)
        run: node scripts/predeploy-guard.mjs --post-build

      - name: Release report (build only)
        run: node scripts/release-report.mjs --build-ok
        continue-on-error: true

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-report
          path: reports/release-report.md
          if-no-files-found: ignore
