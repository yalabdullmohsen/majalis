<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 120" width="940" height="120">
  <!-- 
    Surah Banner — Fixed SVG Template
    ال Attributes:
    - viewBox: "0 0 940 120" (width: 940 units, height: 120 units)
    - Colors: Gold (#D4AF37), cream (#FFF8DC), dark (#1A1A1A)
    - Symmetrical design with arabesque borders
  -->
  
  <!-- Outer arabesque border (top and bottom) -->
  <g id="border-top" fill="none" stroke="#D4AF37" stroke-width="2">
    <!-- Left decorative corner -->
    <path d="M 20 10 Q 30 5 40 10" stroke-linecap="round"/>
    <path d="M 20 10 Q 25 15 20 20"/>
    
    <!-- Center line -->
    <line x1="50" y1="8" x2="890" y2="8" stroke-width="1"/>
    
    <!-- Right decorative corner -->
    <path d="M 900 10 Q 890 5 880 10" stroke-linecap="round"/>
    <path d="M 900 10 Q 895 15 900 20"/>
  </g>
  
  <!-- Center light panel with double gold frame -->
  <g id="center-panel">
    <!-- Outer gold frame (double line) -->
    <rect x="100" y="20" width="740" height="80" 
          fill="none" stroke="#D4AF37" stroke-width="2" rx="4"/>
    <rect x="105" y="25" width="730" height="70" 
          fill="none" stroke="#D4AF37" stroke-width="1" rx="3" opacity="0.7"/>
    
    <!-- Inner light background -->
    <rect x="110" y="30" width="720" height="60" 
          fill="#FFF8DC" stroke="none" rx="2"/>
    
    <!-- Center decorative separator line -->
    <line x1="470" y1="35" x2="470" y2="85" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Text area (Surah name in center) -->
  <g id="text-area" text-anchor="middle" dominant-baseline="middle">
    <!-- Placeholder for Surah name (will be replaced by component) -->
    <text x="470" y="60" font-family="'qpc-v2', serif" font-size="32" fill="#1A1A1A" font-weight="bold">
      سورة الفاتحة
    </text>
  </g>
  
  <!-- Left flower/ornament -->
  <g id="flower-left" transform="translate(60, 60)">
    <!-- Central circle -->
    <circle cx="0" cy="0" r="8" fill="#D4AF37"/>
    <!-- Petals -->
    <circle cx="0" cy="-10" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="7" cy="-7" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="10" cy="0" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="7" cy="7" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="0" cy="10" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="-7" cy="7" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="-10" cy="0" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="-7" cy="-7" r="4" fill="#D4AF37" opacity="0.8"/>
  </g>
  
  <!-- Right flower/ornament (mirrored) -->
  <g id="flower-right" transform="translate(880, 60)">
    <circle cx="0" cy="0" r="8" fill="#D4AF37"/>
    <circle cx="0" cy="-10" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="-7" cy="-7" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="-10" cy="0" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="-7" cy="7" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="0" cy="10" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="7" cy="7" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="10" cy="0" r="4" fill="#D4AF37" opacity="0.8"/>
    <circle cx="7" cy="-7" r="4" fill="#D4AF37" opacity="0.8"/>
  </g>
  
  <!-- Bottom arabesque border (mirrored from top) -->
  <g id="border-bottom" fill="none" stroke="#D4AF37" stroke-width="2">
    <!-- Left decorative corner -->
    <path d="M 20 110 Q 30 115 40 110" stroke-linecap="round"/>
    <path d="M 20 110 Q 25 105 20 100"/>
    
    <!-- Center line -->
    <line x1="50" y1="112" x2="890" y2="112" stroke-width="1"/>
    
    <!-- Right decorative corner -->
    <path d="M 900 110 Q 890 115 880 110" stroke-linecap="round"/>
    <path d="M 900 110 Q 895 105 900 100"/>
  </g>
</svg>
